    // e uma % pro lançamento inteiro, do jeito mais simples ----
    wrap.appendChild(el('div', { style:'font-weight:700;font-size:12.5px;color:var(--blue-dark);margin-bottom:6px;' }, document.createTextNode('Profissional e comissão')));
    const profRow = el('div', { style:'display:flex;gap:8px;margin-bottom:12px;' });
    const profSelect = el('select', { style:'flex:1.6;padding:9px;font-size:13px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;' });
    profSelect.appendChild(el('option', { value:'' }, document.createTextNode('Não atribuído')));
    state.profissionais.forEach(pr => {
      const opt = el('option', { value:pr.id }, document.createTextNode(pr.nome));
      if(lanc.profissionalId===pr.id) opt.setAttribute('selected','selected');
      profSelect.appendChild(opt);
    });
    profSelect.onchange = (e) => { lanc.profissionalId = e.target.value; saveProgress(); };
    profRow.appendChild(profSelect);
    const pctInput = el('input', { type:'number', min:'0', max:'100', step:'0.1', value: lanc.profissionalPercentual||'', placeholder:'% comissão',
      style:'width:110px;padding:9px;font-size:13px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;' });
    pctInput.oninput = (e) => { lanc.profissionalPercentual = e.target.value; saveProgressDebounced(); };
    profRow.appendChild(pctInput);
    wrap.appendChild(profRow);
    if(lanc.profissionalNomeOriginal && !lanc.profissionalId){
      wrap.appendChild(el('p', { style:'font-size:11px;color:var(--muted);margin:-8px 0 12px;' },
        document.createTextNode('Sugerido pela ficha: "'+lanc.profissionalNomeOriginal+'" — cadastre-o ou selecione acima.')));
    }
    const addTratBtn2 = el('div', { class:'add-row-btn', style:'margin-bottom:14px;' }, document.createTextNode('+ Detalhar por tratamento'));
    addTratBtn2.onclick = () => {
      if(!lanc.tratamentos) lanc.tratamentos = [];
      lanc.tratamentos.push({ id: uid(), descricao:'', valor:0, profissionais:[] });
      registrarAlteracao(lanc, 'Orçamento detalhado por tratamento (tinha só profissional único antes)');
      saveProgress(); refreshPanel();
    };
    wrap.appendChild(addTratBtn2);
  }

  wrap.appendChild(el('div', { style:'font-weight:700;font-size:12.5px;color:var(--blue-dark);margin:10px 0 6px;' }, document.createTextNode('Parcelas')));
  if(!lanc.parcelas.length){
    wrap.appendChild(el('div', { style:'font-size:12px;color:var(--muted);' }, document.createTextNode('Nenhuma parcela cadastrada.')));
  } else {
    const hojeISOParcela = new Date().toISOString().slice(0,10);
    const FORMAS_PAGAMENTO = ['', 'Cartão de crédito', 'Cartão de Débito', 'Pix', 'Dinheiro', 'Promissória', 'Boleto'];
    lanc.parcelas.forEach((p, pi) => {
      const atrasada = !p.pago && p.data && p.data < hojeISOParcela;
      const row = el('div', { class:'parcela-row'+(p.pago?' pago':''), style: atrasada ? 'border-color:var(--red);' : '' });
      const info = el('div', { class:'parcela-info', style:'flex:1;' });

      const linha1 = el('div', { style:'display:flex;gap:8px;align-items:center;flex-wrap:wrap;' });
      const valorInput = el('input', { type:'number', min:'0', step:'0.01', value: p.valor||0,
        style:'width:90px;font-size:13px;font-weight:700;border:1px solid var(--line-light);border-radius:6px;padding:4px 6px;' });
      valorInput.onchange = (e) => {
        const novo = parseFloat(e.target.value)||0;
        if(novo !== p.valor){
          registrarAlteracao(lanc, 'Valor da parcela '+(pi+1)+' alterado de R$ '+formatMoney(p.valor)+' para R$ '+formatMoney(novo));
          p.valor = novo;
          saveProgress();
        }
      };
      linha1.appendChild(valorInput);

      const dataVencInput = el('input', { type:'date', value: p.data||'', style:'font-size:12px;border:1px solid var(--line-light);border-radius:6px;padding:3px 6px;' });
      dataVencInput.onchange = (e) => {
        const novo = e.target.value;
        if(novo !== p.data){
          registrarAlteracao(lanc, 'Vencimento da parcela '+(pi+1)+' alterado de '+(p.data?formatDateBR(p.data):'—')+' para '+formatDateBR(novo));
          p.data = novo;
          saveProgress(); refreshPanel();
        }
      };
      linha1.appendChild(dataVencInput);

      const formaSelect = el('select', { style:'font-size:12px;border:1px solid var(--line-light);border-radius:6px;padding:3px 6px;font-family:inherit;' });
      FORMAS_PAGAMENTO.forEach(f => {
        const opt = el('option', { value:f }, document.createTextNode(f||'Forma...'));
        if(p.forma===f) opt.setAttribute('selected','selected');
        formaSelect.appendChild(opt);
      });
      formaSelect.onchange = (e) => {
        const novo = e.target.value;
        if(novo !== p.forma){
          registrarAlteracao(lanc, 'Forma de pagamento da parcela '+(pi+1)+' alterada de "'+(p.forma||'—')+'" para "'+(novo||'—')+'"');
          p.forma = novo;
          saveProgress();
        }
      };
      linha1.appendChild(formaSelect);
      info.appendChild(linha1);

      const statusLabel = p.pago ? '✓ Pago' : (atrasada ? '⚠ Em atraso' : 'Não pago');
      const statusCor = p.pago ? 'var(--green)' : (atrasada ? 'var(--red)' : 'var(--muted)');
      info.appendChild(el('div', { style:'font-size:11.5px;font-weight:700;color:'+statusCor+';margin-top:4px;' }, document.createTextNode(statusLabel)));
      if(p.pago && p.dataRecebimento){
        info.appendChild(el('div', { style:'font-size:11px;color:var(--muted);' }, document.createTextNode('Pago em '+formatDateBR(p.dataRecebimento))));
      }
      row.appendChild(info);

      const acoesWrap = el('div', { style:'display:flex;flex-direction:column;gap:6px;align-items:flex-end;' });
      if(!p.pago){
        const toggle = el('div', { class:'parcela-toggle' }, document.createTextNode('Marcar como pago'));
        toggle.onclick = () => { parcelaPagandoId = parcelaPagandoId===p.id ? null : p.id; refreshPanel(); };
        acoesWrap.appendChild(toggle);
      } else {
        const toggle = el('div', { class:'parcela-toggle marcado' }, document.createTextNode('✓ Pago'));
        toggle.onclick = () => {
          if(!confirm('Desmarcar esse pagamento?')) return;
          registrarAlteracao(lanc, 'Pagamento da parcela '+(pi+1)+' (R$ '+formatMoney(p.valor)+') desmarcado — estava pago em '+formatDateBR(p.dataRecebimento));
          p.pago = false; p.dataRecebimento = '';
          saveProgress(); refreshPanel();
        };
        acoesWrap.appendChild(toggle);
      }
      const removerParcelaBtn = el('span', { style:'font-size:11px;color:var(--red);cursor:pointer;text-decoration:underline;' }, document.createTextNode('Remover parcela'));
      removerParcelaBtn.onclick = () => {
        if(!confirm('Remover esta parcela de R$ '+formatMoney(p.valor)+'?')) return;
        registrarAlteracao(lanc, 'Parcela '+(pi+1)+' removida (R$ '+formatMoney(p.valor)+', vencimento '+(p.data?formatDateBR(p.data):'—')+')');
        lanc.parcelas.splice(pi,1);
        saveProgress(); refreshPanel();
      };
      acoesWrap.appendChild(removerParcelaBtn);
      row.appendChild(acoesWrap);
      wrap.appendChild(row);

      if(!p.pago && parcelaPagandoId === p.id){
        const miniForm = el('div', { style:'background:#F4F8FB;border-radius:8px;padding:10px;margin:-4px 0 10px;' });
        const dataPagoInput = el('input', { type:'date', value: hojeISOParcela });
        const btnConfirmar = el('div', { class:'add-row-btn', style:'margin-top:8px;background:var(--green);color:#fff;border:none;' }, document.createTextNode('Confirmar'));
        btnConfirmar.onclick = () => {
          const dataFinal = dataPagoInput.value || hojeISOParcela;
          registrarAlteracao(lanc, 'Parcela '+(pi+1)+' (R$ '+formatMoney(p.valor)+') marcada como paga em '+formatDateBR(dataFinal));
          p.pago = true;
          p.dataRecebimento = dataFinal;
          parcelaPagandoId = null;
          saveProgress(); refreshPanel();
        };
        const lbl = el('label', {}, document.createTextNode('Data em que foi pago'));
        miniForm.appendChild(lbl); miniForm.appendChild(dataPagoInput); miniForm.appendChild(btnConfirmar);
        wrap.appendChild(miniForm);
      }
    });
  }

  const addParcelaBtn = el('div', { class:'add-row-btn', style:'margin-top:4px;' }, document.createTextNode('+ Adicionar parcela'));
  addParcelaBtn.onclick = () => {
    lanc.parcelas.push({ id: uid(), valor:0, data:'', forma:'', pago:false, dataRecebimento:'' });
    registrarAlteracao(lanc, 'Nova parcela adicionada');
    saveProgress(); refreshPanel();
  };
  wrap.appendChild(addParcelaBtn);

  // ---- Histórico de alterações (quem mudou o quê e quando) ----
  if((lanc.historicoAlteracoes||[]).length){
    const histWrap = el('div', { style:'margin-top:16px;padding-top:12px;border-top:1px solid var(--line-light);' });
    const histToggle = el('div', { style:'font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;' },
      document.createTextNode((historicoAlteracoesAberto[lanc.id]?'▾':'▸')+' Histórico de alterações ('+lanc.historicoAlteracoes.length+')'));
    histToggle.onclick = () => { historicoAlteracoesAberto[lanc.id] = !historicoAlteracoesAberto[lanc.id]; refreshPanel(); };
    histWrap.appendChild(histToggle);
    if(historicoAlteracoesAberto[lanc.id]){
      const lista = el('div', { style:'margin-top:8px;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto;' });
      lanc.historicoAlteracoes.forEach(h => {
        lista.appendChild(el('div', { style:'background:#F4F8FB;border-radius:8px;padding:8px 10px;font-size:11.5px;' }, [
          el('div', { style:'font-weight:700;' }, document.createTextNode(h.quem + ' — ' + new Date(h.quando).toLocaleString('pt-BR'))),
          el('div', { style:'margin-top:2px;color:var(--ink);' }, document.createTextNode(h.texto)),
        ]));
      });
      histWrap.appendChild(lista);
    }
    wrap.appendChild(histWrap);
  }

  container.appendChild(wrap);
}
let parcelaPagandoId = null;
let historicoAlteracoesAberto = {};

let visaoLancamentos = 'lista'; // 'lista' | 'planilha'
let planilhaAno = new Date().getFullYear();
let filtroBuscaLancamento = '';

function renderLancamentos(container){
  container.appendChild(el('div', { class:'section-title' }, document.createTextNode('Lançamentos')));

  const toggleRow = el('div', { class:'filter-row', style:'margin-bottom:12px;' });
  [['lista','📋 Lista'],['planilha','📊 Planilha (por mês)']].forEach(([key,label]) => {
    const chip = el('div', { class:'filter-chip'+(visaoLancamentos===key?' selected':'') }, document.createTextNode(label));
    chip.onclick = () => { visaoLancamentos = key; refreshPanel(); };
    toggleRow.appendChild(chip);
  });
  container.appendChild(toggleRow);

  if(visaoLancamentos === 'planilha'){
    renderPlanilhaLancamentos(container);
    return;
  }

  if(novoLancamentoAberto){
    renderNovoLancamentoForm(container);
  } else {
    const addBtn = el('div', { class:'add-row-btn' }, document.createTextNode('+ Novo lançamento manual'));
    addBtn.onclick = () => { novoLancamentoAberto = true; refreshPanel(); };
    container.appendChild(addBtn);
  }

  if(!state.lancamentos.length){
    container.appendChild(el('div', { class:'empty-hint', style:'margin-top:14px;' }, document.createTextNode('Nenhum lançamento ainda. Importe um PDF ou crie um manualmente.')));
    return;
  }

  const buscaField = el('div', { class:'field', style:'margin-top:14px;' });
  buscaField.appendChild(el('label', {}, document.createTextNode('Buscar por paciente')));
  const buscaInput = el('input', { type:'text', value: filtroBuscaLancamento, placeholder:'Digite o nome do paciente...' });
  buscaInput.oninput = (e) => { filtroBuscaLancamento = e.target.value; refreshPanel(); };
  buscaField.appendChild(buscaInput);
  container.appendChild(buscaField);

  const termoBusca = filtroBuscaLancamento.trim().toLowerCase();
  const listaFiltrada = state.lancamentos.filter(l => !termoBusca || (l.paciente||'').toLowerCase().includes(termoBusca));

  if(!listaFiltrada.length){
    container.appendChild(el('div', { class:'empty-hint', style:'margin-top:14px;' }, document.createTextNode('Nenhum lançamento encontrado com esse nome.')));
    return;
  }

  const tableWrap = el('div', { style:'margin-top:12px;overflow-x:auto;' });
  const table = el('table', { class:'fin-table' });
  const thead = el('thead', {}, el('tr', {}, [
    el('th', {}, document.createTextNode('Paciente')),
    el('th', {}, document.createTextNode('Profissional')),
    el('th', {}, document.createTextNode('Valor total')),
    el('th', {}, document.createTextNode('Parcelas')),
    el('th', {}, document.createTextNode('Origem')),
    el('th', {}, document.createTextNode('')),
  ]));
  table.appendChild(thead);
  const tbody = el('tbody', {});

  listaFiltrada.forEach(lanc => {
    const pagas = lanc.parcelas.filter(p=>p.pago).length;
    const prof = getProfissional(lanc.profissionalId);
    const tr = el('tr', { class:'fin-table-row' });
    tr.onclick = () => { lancamentoExpandido = lancamentoExpandido===lanc.id ? null : lanc.id; refreshPanel(); };
    tr.appendChild(el('td', { style:'font-weight:600;' }, document.createTextNode(lanc.paciente)));
    tr.appendChild(el('td', {}, document.createTextNode(prof ? prof.nome : '— não atribuído')));
    tr.appendChild(el('td', {}, document.createTextNode('R$ '+formatMoney(lanc.valorTotal))));
    tr.appendChild(el('td', {}, document.createTextNode(pagas+'/'+lanc.parcelas.length+' pagas')));
    tr.appendChild(el('td', {}, el('span', { class:'badge origem' }, document.createTextNode(lanc.origem==='importado'?'Importado':'Manual'))));
    const tdAcoes = el('td', { style:'white-space:nowrap;text-align:right;' });
    const expandIcon = el('span', { style:'color:var(--blue-dark);padding:0 6px;' }, document.createTextNode(lancamentoExpandido===lanc.id?'▲':'▼'));
    const delIcon = el('span', { style:'color:var(--red);padding:0 6px;' }, document.createTextNode('✕'));
    delIcon.onclick = (e) => {
      e.stopPropagation();
      if(confirm('Excluir este lançamento e todas as suas parcelas?')){
        state.lancamentos = state.lancamentos.filter(l=>l.id!==lanc.id);
        saveProgress(); refreshPanel(); toast('Lançamento excluído.');
      }
    };
    tdAcoes.appendChild(expandIcon); tdAcoes.appendChild(delIcon);
    tr.appendChild(tdAcoes);
    tbody.appendChild(tr);

    if(lancamentoExpandido === lanc.id){
      const trDetalhe = el('tr', { class:'fin-table-detail-row' });
      const tdDetalhe = el('td', { colspan:'6' });
      const detalheWrap = el('div', { style:'padding:12px 4px;' });
      renderLancamentoExpandido(detalheWrap, lanc);
      tdDetalhe.appendChild(detalheWrap);
      trDetalhe.appendChild(tdDetalhe);
      tbody.appendChild(trDetalhe);
    }
  });
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  container.appendChild(tableWrap);
}

// ============ RENDER: PARCELAS E RECEBIMENTOS ============
let filtroStatusParcela = 'todas'; // todas | pagas | pendentes
let filtroProfissionalParcela = '';
let parcelaConfirmandoId = null;
let parcelaAjustandoId = null;

function todasParcelasComContexto(){
  const lista = [];
  state.lancamentos.forEach(lanc => {
    lanc.parcelas.forEach(p => {
      lista.push({ parcela:p, lancamento:lanc });
    });
  });
  return lista;
}

function renderParcelasRecebimentos(container){
  container.appendChild(el('div', { class:'section-title' }, document.createTextNode('Parcelas e recebimentos')));
  container.appendChild(el('p', { style:'font-size:12px;color:var(--muted);margin-top:-6px;margin-bottom:14px;' },
    document.createTextNode('Todas as parcelas de todos os contratos, de todos os tempos (não é filtrado por mês). Para ver por período, use a aba Monitoramento.')));

  const souAdminAviso = !!(window._clinicaMe && window._clinicaMe.papel === 'admin');
  const avisoAjuste = el('div', { style:'background:#F4F8FB;border:1.5px solid var(--blue-dark);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--ink);' });
  if(souAdminAviso){
    avisoAjuste.appendChild(document.createTextNode('💡 Precisa trocar valor, forma de pagamento ou data de uma parcela (mesmo já paga)? Clique em "⚙ Ajustar" ao lado dela — fica registrado no histórico com o motivo.'));
  } else {
    avisoAjuste.appendChild(document.createTextNode('💡 Precisa trocar valor, forma de pagamento ou data de uma parcela? Só o administrador da clínica consegue fazer esse ajuste (opção "⚙ Ajustar", visível quando ele está logado).'));
  }
  container.appendChild(avisoAjuste);

  const todas = todasParcelasComContexto();
  const totalGeral = todas.reduce((s,x)=>s+x.parcela.valor,0);
  const totalRecebido = todas.filter(x=>x.parcela.pago).reduce((s,x)=>s+x.parcela.valor,0);
  const totalPendente = totalGeral - totalRecebido;

  const summary = el('div', { class:'summary-grid' });
  summary.appendChild(el('div', { class:'summary-card' }, [
    el('div', { class:'summary-num' }, document.createTextNode('R$ '+formatMoney(totalGeral))),
    el('div', { class:'summary-label' }, document.createTextNode('Total contratado (todo o histórico)'))
  ]));
  summary.appendChild(el('div', { class:'summary-card' }, [
    el('div', { class:'summary-num green' }, document.createTextNode('R$ '+formatMoney(totalRecebido))),
    el('div', { class:'summary-label' }, document.createTextNode('Já recebido (todo o histórico)'))
  ]));
  summary.appendChild(el('div', { class:'summary-card' }, [
    el('div', { class:'summary-num amber' }, document.createTextNode('R$ '+formatMoney(totalPendente))),
    el('div', { class:'summary-label' }, document.createTextNode('Ainda falta receber'))
  ]));
  container.appendChild(summary);

  const filterRow = el('div', { class:'filter-row' });
  [['todas','Todas'],['pagas','Recebidas'],['pendentes','Pendentes']].forEach(([key,label]) => {
    const chip = el('div', { class:'filter-chip'+(filtroStatusParcela===key?' selected':'') }, document.createTextNode(label));
    chip.onclick = () => { filtroStatusParcela = key; refreshPanel(); };
    filterRow.appendChild(chip);
  });
  container.appendChild(filterRow);

  if(state.profissionais.length){
    const profField = el('div', { class:'field' });
    profField.appendChild(el('label', {}, document.createTextNode('Filtrar por profissional')));
    const profSelect = el('select', {});
    profSelect.appendChild(el('option', { value:'' }, document.createTextNode('Todos')));
    state.profissionais.forEach(p => {
      const opt = el('option', { value:p.id }, document.createTextNode(p.nome));
      if(filtroProfissionalParcela===p.id) opt.setAttribute('selected','selected');
      profSelect.appendChild(opt);
    });
    profSelect.onchange = (e) => { filtroProfissionalParcela = e.target.value; refreshPanel(); };
    profField.appendChild(profSelect);
    container.appendChild(profField);
  }

  let filtradas = todas;
  if(filtroStatusParcela==='pagas') filtradas = filtradas.filter(x=>x.parcela.pago);
  if(filtroStatusParcela==='pendentes') filtradas = filtradas.filter(x=>!x.parcela.pago);
  if(filtroProfissionalParcela) filtradas = filtradas.filter(x=>x.lancamento.profissionalId===filtroProfissionalParcela);
  filtradas.sort((a,b) => (a.parcela.data||'').localeCompare(b.parcela.data||''));

  if(!filtradas.length){
    container.appendChild(el('div', { class:'empty-hint', style:'margin-top:10px;' }, document.createTextNode('Nenhuma parcela encontrada com esse filtro.')));
    return;
  }

  const listWrap = el('div', { style:'margin-top:10px;' });
  filtradas.forEach(({parcela:p, lancamento:lanc}) => {
    const prof = getProfissional(lanc.profissionalId);
    const row = el('div', { class:'parcela-row'+(p.pago?' pago':'') });
    const info = el('div', { class:'parcela-info' });
    info.appendChild(el('div', { class:'p-valor' }, document.createTextNode('R$ '+formatMoney(p.valor)+' — '+lanc.paciente)));
    info.appendChild(el('div', { class:'p-sub' }, document.createTextNode(
      [p.data?formatDateBR(p.data):'sem data', p.forma, prof?prof.nome:'sem profissional'].filter(Boolean).join(' • ')
      + (p.pago && p.dataRecebimento ? (' • Recebido em '+formatDateBR(p.dataRecebimento)+(p.horaRecebimento?(' às '+p.horaRecebimento):'')) : '')
      + (p.parcelamentoCartaoInfo ? (' • ' + p.parcelamentoCartaoInfo) : '')
    )));
    if(p.pago && (p.comissoes||[]).length){
      info.appendChild(el('div', { style:'font-size:11px;color:var(--green);margin-top:2px;' }, document.createTextNode(
        '💰 ' + p.comissoes.map(c => c.profissionalNome+': R$ '+formatMoney(c.valor)).join(' • ')
      )));
    }
    row.appendChild(info);

    if(p.pago){
      const toggle = el('div', { class:'parcela-toggle marcado' }, document.createTextNode('✓ Recebido'));
      toggle.onclick = () => {
        if(!confirm('Desmarcar esse recebimento?')) return;
        p.pago = false; p.dataRecebimento = ''; p.horaRecebimento = '';
        saveProgress(); refreshPanel();
      };
      row.appendChild(toggle);
    } else {
      const toggle = el('div', { class:'parcela-toggle' }, document.createTextNode('Marcar recebido'));
      toggle.onclick = () => { parcelaConfirmandoId = (parcelaConfirmandoId===p.id) ? null : p.id; refreshPanel(); };
      row.appendChild(toggle);
    }
    const souAdminFinanceiro = !!(window._clinicaMe && window._clinicaMe.papel === 'admin');
    if(souAdminFinanceiro){
      const ajustarBtn = el('div', { class:'parcela-toggle', style:'background:transparent;border:1.5px solid var(--amber);color:var(--amber);' }, document.createTextNode('⚙ Ajustar'));
      ajustarBtn.onclick = () => { parcelaAjustandoId = (parcelaAjustandoId===p.id) ? null : p.id; parcelaConfirmandoId = null; refreshPanel(); };
      row.appendChild(ajustarBtn);
    }
    listWrap.appendChild(row);

    if((p.historicoAjustes||[]).length){
      const histWrap = el('div', { style:'margin:-4px 0 8px;padding:8px 10px;background:#FFF8EC;border-radius:8px;font-size:11.5px;' });
      histWrap.appendChild(el('div', { style:'font-weight:700;margin-bottom:4px;' }, document.createTextNode('Ajustes feitos pelo administrador:')));
      p.historicoAjustes.forEach(h => {
        histWrap.appendChild(el('div', { style:'margin-bottom:3px;' }, document.createTextNode(
          '• ' + h.quem + ' em ' + new Date(h.quando).toLocaleString('pt-BR') + ': ' + h.resumo + ' — "' + h.justificativa + '"' +
          (h.afetaComissao ? ' (afetou a comissão)' : ' (não afetou a comissão)')
        )));
      });
      listWrap.appendChild(histWrap);
    }

    if(souAdminFinanceiro && parcelaAjustandoId === p.id){
      const formAj = el('div', { class:'card', style:'margin:-4px 0 10px;border-color:var(--amber);' });
      formAj.appendChild(el('p', { style:'font-size:11.5px;color:var(--muted);margin:0 0 10px;' },
        document.createTextNode('Corrige valor, forma ou data desta parcela específica, sem mexer no plano de tratamento original. Fica registrado no histórico.')));
      const ajDados = { valor: p.valor, forma: p.forma||'', data: p.data||'', justificativa:'' };

      const row1aj = el('div', { class:'row' });
      const valorField = el('div', { class:'field' });
      valorField.appendChild(el('label', {}, document.createTextNode('Novo valor (R$)')));
      const valorInputAj = el('input', { type:'number', step:'0.01', min:'0', value: String(ajDados.valor) });
      valorInputAj.oninput = (e) => { ajDados.valor = e.target.value; };
      valorField.appendChild(valorInputAj);
      row1aj.appendChild(valorField);
      const dataFieldAj = el('div', { class:'field' });
      dataFieldAj.appendChild(el('label', {}, document.createTextNode('Nova data de vencimento')));
      const dataInputAj = el('input', { type:'date', value: ajDados.data });
      dataInputAj.oninput = (e) => { ajDados.data = e.target.value; };
      dataFieldAj.appendChild(dataInputAj);
      row1aj.appendChild(dataFieldAj);
      formAj.appendChild(row1aj);

      const formaFieldAj = el('div', { class:'field' });
      formaFieldAj.appendChild(el('label', {}, document.createTextNode('Nova forma de pagamento')));
      const formaSelectAj = el('select', {});
      ['', 'Cartão de crédito', 'Cartão de Débito', 'Pix', 'Dinheiro', 'Promissória', 'Boleto'].forEach(opt => {
        const optEl = el('option', { value: opt }, document.createTextNode(opt || 'Selecione...'));
        if(ajDados.forma === opt) optEl.setAttribute('selected','selected');
        formaSelectAj.appendChild(optEl);
      });
      formaSelectAj.onchange = (e) => { ajDados.forma = e.target.value; };
      formaFieldAj.appendChild(formaSelectAj);
      formAj.appendChild(formaFieldAj);

      const justField = el('div', { class:'field' });
      justField.appendChild(el('label', {}, document.createTextNode('Motivo do ajuste (obrigatório)')));
      const justInput = el('input', { type:'text', placeholder:'Ex: desconto combinado com o paciente' });
      justInput.oninput = (e) => { ajDados.justificativa = e.target.value; };
      justField.appendChild(justInput);
      formAj.appendChild(justField);

      const comissaoAjLabel = el('div', { style:'font-weight:700;font-size:13px;color:var(--amber);margin:12px 0 2px;' },
        document.createTextNode('Comissões deste pagamento'));
      formAj.appendChild(comissaoAjLabel);
      const ajComissoes = (p.comissoes||[]).map(c=>Object.assign({},c));
      const listaComissoesAjWrap = el('div', {});
      formAj.appendChild(listaComissoesAjWrap);
      function renderListaComissoesAj(){
        listaComissoesAjWrap.innerHTML = '';
        ajComissoes.forEach((c, ci) => {
          const linha = el('div', { style:'display:flex;gap:8px;align-items:center;margin-bottom:8px;' });
          const selectProf = el('select', { style:'flex:1.4;padding:8px;font-size:13px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;' });
          selectProf.appendChild(el('option', { value:'' }, document.createTextNode('Selecione o profissional...')));
          state.profissionais.forEach(pr => {
            const opt = el('option', { value:pr.id }, document.createTextNode(pr.nome));
            if(c.profissionalId === pr.id) opt.setAttribute('selected','selected');
            selectProf.appendChild(opt);
          });
          selectProf.onchange = (e) => { c.profissionalId = e.target.value; const pr = state.profissionais.find(x=>x.id===e.target.value); c.profissionalNome = pr?pr.nome:''; };
          linha.appendChild(selectProf);
          const valorInput = el('input', { type:'number', step:'0.01', min:'0', value: c.valor||'', placeholder:'Valor R$', style:'width:100px;padding:8px;font-size:13px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;' });
          valorInput.oninput = (e) => { c.valor = parseFloat(e.target.value)||0; };
          linha.appendChild(valorInput);
          const removerBtn = el('span', { style:'cursor:pointer;color:var(--red);font-size:16px;padding:4px;' }, document.createTextNode('✕'));
          removerBtn.onclick = () => { ajComissoes.splice(ci,1); renderListaComissoesAj(); };
          linha.appendChild(removerBtn);
          listaComissoesAjWrap.appendChild(linha);
        });
      }
      renderListaComissoesAj();
      const addComissaoAjBtn = el('div', { style:'font-size:12.5px;font-weight:700;color:var(--amber);cursor:pointer;margin-bottom:10px;' },
        document.createTextNode('+ Adicionar profissional'));
      addComissaoAjBtn.onclick = () => { ajComissoes.push({ profissionalId:'', profissionalNome:'', valor:0 }); renderListaComissoesAj(); };
      formAj.appendChild(addComissaoAjBtn);

      const btnRowAj = el('div', { class:'row' });
      const salvarAjBtn = el('div', { class:'add-row-btn', style:'flex:1;background:var(--amber);color:#fff;border:none;' }, document.createTextNode('Salvar ajuste'));
      salvarAjBtn.onclick = () => {
        if(!ajDados.justificativa.trim()){ alert('Informe o motivo do ajuste.'); return; }
        const valorNovo = parseFloat(ajDados.valor) || 0;
        const valorAnterior = p.valor;
        const comissoesNovas = ajComissoes.filter(c => c.profissionalId && parseFloat(c.valor) > 0)
          .map(c => ({ profissionalId:c.profissionalId, profissionalNome:c.profissionalNome, valor: parseFloat(c.valor) }));
        const partes = [];
        if(valorNovo !== valorAnterior) partes.push('valor de R$ '+formatMoney(valorAnterior)+' para R$ '+formatMoney(valorNovo));
        if(ajDados.forma && ajDados.forma !== p.forma) partes.push('forma de "'+(p.forma||'—')+'" para "'+ajDados.forma+'"');
        if(ajDados.data && ajDados.data !== p.data) partes.push('data de '+(p.data?formatDateBR(p.data):'—')+' para '+formatDateBR(ajDados.data));
        const comissoesMudaram = JSON.stringify(comissoesNovas) !== JSON.stringify(p.comissoes||[]);
        if(comissoesMudaram) partes.push('comissões ajustadas');
        if(!partes.length){ alert('Nada foi alterado.'); return; }

        if(!p.historicoAjustes) p.historicoAjustes = [];
        p.historicoAjustes.push({
          quem: (window._clinicaMe && window._clinicaMe.nome) || 'Administrador',
          quando: Date.now(),
          justificativa: ajDados.justificativa.trim(),
          resumo: partes.join('; '),
        });

        p.valor = valorNovo;
        if(ajDados.forma) p.forma = ajDados.forma;
        if(ajDados.data) p.data = ajDados.data;
        p.comissoes = comissoesNovas;
        parcelaAjustandoId = null;
        saveProgress(); refreshPanel();
        toast('Ajuste salvo! ' + partes.join('; ') + '.');
      };
      const cancelarAjBtn = el('div', { class:'add-row-btn', style:'flex:1;' }, document.createTextNode('Cancelar'));
      cancelarAjBtn.onclick = () => { parcelaAjustandoId = null; refreshPanel(); };
      btnRowAj.appendChild(salvarAjBtn); btnRowAj.appendChild(cancelarAjBtn);
      formAj.appendChild(btnRowAj);
      listWrap.appendChild(formAj);
    }

    if(!p.pago && parcelaConfirmandoId === p.id){
      const formConf = el('div', { class:'card', style:'margin:-4px 0 10px;border-color:var(--blue-dark);' });
      const hoje = new Date();
      const hojeISO2 = hoje.getFullYear()+'-'+String(hoje.getMonth()+1).padStart(2,'0')+'-'+String(hoje.getDate()).padStart(2,'0');
      const horaAgora = String(hoje.getHours()).padStart(2,'0')+':'+String(hoje.getMinutes()).padStart(2,'0');
      const confDados = { data: hojeISO2, hora: horaAgora, forma: p.forma || '', parcelasCartao: 1, comissoes: (p.comissoes||[]).map(c=>Object.assign({},c)) };

      const row1 = el('div', { class:'row' });
      const dataField = el('div', { class:'field' });
      dataField.appendChild(el('label', {}, document.createTextNode('Dia do pagamento')));
      const dataInput = el('input', { type:'date', value: confDados.data });
      dataInput.oninput = (e) => { confDados.data = e.target.value; };
      dataField.appendChild(dataInput);
      row1.appendChild(dataField);

      const horaField = el('div', { class:'field' });
      horaField.appendChild(el('label', {}, document.createTextNode('Hora (opcional)')));
      const horaInput = el('input', { type:'time', value: confDados.hora });
      horaInput.oninput = (e) => { confDados.hora = e.target.value; };
      horaField.appendChild(horaInput);
      row1.appendChild(horaField);
      formConf.appendChild(row1);

      const formaField = el('div', { class:'field' });
      formaField.appendChild(el('label', {}, document.createTextNode('Forma de pagamento')));
      const formaSelect = el('select', {});
      ['', 'Cartão de crédito', 'Cartão de Débito', 'Pix', 'Dinheiro', 'Promissória', 'Boleto'].forEach(opt => {
        const optEl = el('option', { value: opt }, document.createTextNode(opt || 'Selecione...'));
        if(confDados.forma === opt) optEl.setAttribute('selected','selected');
        formaSelect.appendChild(optEl);
      });
      formaSelect.onchange = (e) => { confDados.forma = e.target.value; parcelasCartaoField.style.display = (e.target.value==='Cartão de crédito') ? '' : 'none'; };
      formaField.appendChild(formaSelect);
      formConf.appendChild(formaField);

      // Só aparece quando a forma é Cartão de crédito — a maquininha costuma repassar o dinheiro
      // pra clínica aos poucos, mês a mês, mesmo que o paciente tenha parcelado no cartão dele.
      // Isso divide o valor pra cada mês contar certo no "recebido", em vez de tudo de uma vez.
      const parcelasCartaoField = el('div', { class:'field', style: confDados.forma==='Cartão de crédito' ? '' : 'display:none;' });
      parcelasCartaoField.appendChild(el('label', {}, document.createTextNode('Em quantas vezes a maquininha vai repassar? (mês a mês)')));
      const parcelasCartaoInput = el('input', { type:'number', min:'1', max:'12', value:'1' });
      parcelasCartaoInput.oninput = (e) => { confDados.parcelasCartao = Math.max(1, parseInt(e.target.value,10)||1); };
      parcelasCartaoField.appendChild(parcelasCartaoInput);
      parcelasCartaoField.appendChild(el('p', { style:'font-size:11px;color:var(--muted);margin:4px 0 0;' },
        document.createTextNode('Ex: paciente parcelou em 6x no cartão dele → coloque 6 aqui, e o valor recebido é dividido igualzinho, um por mês, a partir da data acima.')));
      formConf.appendChild(parcelasCartaoField);

      // ---- Comissões deste pagamento (100% manual — o gestor decide quem recebe e quanto) ----
      const comissoesSection = el('div', { style:'margin-top:14px;padding-top:12px;border-top:1px solid var(--line-light);' });
      comissoesSection.appendChild(el('div', { style:'font-weight:700;font-size:13px;color:var(--blue-dark);margin-bottom:2px;' },
        document.createTextNode('Comissões deste pagamento')));
      comissoesSection.appendChild(el('p', { style:'font-size:11.5px;color:var(--muted);margin:0 0 10px;' },
        document.createTextNode('Escolha quais profissionais recebem comissão sobre esse pagamento específico, e quanto cada um. Nada aqui é calculado sozinho — é você quem decide.')));
      const listaComissoesWrap = el('div', {});
      comissoesSection.appendChild(listaComissoesWrap);

      function renderListaComissoes(){
        listaComissoesWrap.innerHTML = '';
        confDados.comissoes.forEach((c, ci) => {
          const linha = el('div', { style:'display:flex;gap:8px;align-items:center;margin-bottom:8px;' });
          const selectProf = el('select', { style:'flex:1.4;padding:8px;font-size:13px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;' });
          selectProf.appendChild(el('option', { value:'' }, document.createTextNode('Selecione o profissional...')));
          state.profissionais.forEach(pr => {
            const opt = el('option', { value:pr.id }, document.createTextNode(pr.nome));
            if(c.profissionalId === pr.id) opt.setAttribute('selected','selected');
            selectProf.appendChild(opt);
          });
          selectProf.onchange = (e) => {
            c.profissionalId = e.target.value;
            const pr = state.profissionais.find(x=>x.id===e.target.value);
            c.profissionalNome = pr ? pr.nome : '';
          };
          linha.appendChild(selectProf);

          const valorInput = el('input', { type:'number', step:'0.01', min:'0', value: c.valor||'', placeholder:'Valor R$', style:'width:100px;padding:8px;font-size:13px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;' });
          valorInput.oninput = (e) => { c.valor = parseFloat(e.target.value)||0; };
          linha.appendChild(valorInput);

          const sugerirBtn = el('span', { title:'Preencher com base no % configurado desse profissional', style:'cursor:pointer;font-size:16px;padding:4px;' }, document.createTextNode('💡'));
          sugerirBtn.onclick = () => {
            const pr = state.profissionais.find(x=>x.id===c.profissionalId);
            const pct = pr && pr.pagamento ? parseFloat(pr.pagamento.percentual) : NaN;
            if(!pr){ alert('Escolha um profissional primeiro.'); return; }
            if(isNaN(pct)){ alert('Esse profissional não tem % de comissão configurado no cadastro — digite o valor manualmente.'); return; }
            c.valor = Math.round(p.valor * pct/100 * 100)/100;
            valorInput.value = c.valor;
          };
          linha.appendChild(sugerirBtn);

          const removerBtn = el('span', { style:'cursor:pointer;color:var(--red);font-size:16px;padding:4px;' }, document.createTextNode('✕'));
          removerBtn.onclick = () => { confDados.comissoes.splice(ci,1); renderListaComissoes(); };
          linha.appendChild(removerBtn);

          listaComissoesWrap.appendChild(linha);
        });
        const totalComissoes = confDados.comissoes.reduce((s,c)=>s+(parseFloat(c.valor)||0),0);
        if(confDados.comissoes.length){
          listaComissoesWrap.appendChild(el('div', { style:'font-size:11.5px;color:var(--muted);margin-top:2px;' },
            document.createTextNode('Total em comissões: R$ '+formatMoney(totalComissoes)+' de R$ '+formatMoney(p.valor)+' recebidos')));
        }
      }
      renderListaComissoes();

      const addComissaoBtn = el('div', { style:'font-size:12.5px;font-weight:700;color:var(--blue-dark);cursor:pointer;margin-top:4px;' },
        document.createTextNode('+ Adicionar profissional'));
      addComissaoBtn.onclick = () => { confDados.comissoes.push({ profissionalId:'', profissionalNome:'', valor:0 }); renderListaComissoes(); };
      comissoesSection.appendChild(addComissaoBtn);
      formConf.appendChild(comissoesSection);

      const btnRow = el('div', { class:'row', style:'margin-top:8px;' });
      const confirmarBtn = el('div', { class:'add-row-btn', style:'flex:1;background:var(--green);color:#fff;border:none;' }, document.createTextNode('✓ Confirmar pagamento'));
      confirmarBtn.onclick = () => {
        const comissoesValidas = confDados.comissoes.filter(c => c.profissionalId && parseFloat(c.valor) > 0)
          .map(c => ({ profissionalId:c.profissionalId, profissionalNome:c.profissionalNome, valor: parseFloat(c.valor) }));
        const n = (confDados.forma === 'Cartão de crédito') ? confDados.parcelasCartao : 1;
        if(n <= 1){
          p.pago = true;
          p.dataRecebimento = confDados.data || hojeISO2;
          p.horaRecebimento = confDados.hora || '';
          if(confDados.forma) p.forma = confDados.forma;
          p.comissoes = comissoesValidas;
        } else {
          // Divide essa parcela em N recebimentos, um por mês, a partir da data escolhida —
          // assim cada mês só conta a fatia que a maquininha realmente repassou naquele mês.
          // As comissões escolhidas também são divididas na mesma proporção, mês a mês.
          const valorTotal = p.valor;
          const valorPorMes = Math.round((valorTotal / n) * 100) / 100;
          const [anoBase, mesBase, diaBase] = (confDados.data || hojeISO2).split('-').map(Number);
          p.pago = true;
          p.valor = valorPorMes;
          p.dataRecebimento = confDados.data || hojeISO2;
          p.horaRecebimento = confDados.hora || '';
          p.forma = confDados.forma;
          p.parcelamentoCartaoInfo = '1/'+n+' do valor total de R$ '+formatMoney(valorTotal)+' (cartão em '+n+'x)';
          p.comissoes = comissoesValidas.map(c => ({ profissionalId:c.profissionalId, profissionalNome:c.profissionalNome, valor: Math.round(c.valor/n*100)/100 }));
          for(let i=1;i<n;i++){
            let mes = mesBase + i, ano = anoBase;
            while(mes>12){ mes-=12; ano++; }
            const dataRep = ano+'-'+String(mes).padStart(2,'0')+'-'+String(Math.min(diaBase,28)).padStart(2,'0');
            lanc.parcelas.push({
              id: uid(), valor: (i===n-1) ? Math.round((valorTotal - valorPorMes*(n-1))*100)/100 : valorPorMes,
              data: dataRep, forma: confDados.forma, pago: true, dataRecebimento: dataRep, horaRecebimento: '',
              parcelamentoCartaoInfo: (i+1)+'/'+n+' do valor total de R$ '+formatMoney(valorTotal)+' (cartão em '+n+'x)',
              comissoes: comissoesValidas.map(c => ({ profissionalId:c.profissionalId, profissionalNome:c.profissionalNome, valor: Math.round(c.valor/n*100)/100 })),
            });
          }
        }
        parcelaConfirmandoId = null;
        saveProgress(); refreshPanel(); toast('Pagamento confirmado!' + (n>1 ? (' Dividido em '+n+' recebimentos mensais.') : ''));
      };
      const cancelarBtn = el('div', { class:'add-row-btn', style:'flex:1;' }, document.createTextNode('Cancelar'));
      cancelarBtn.onclick = () => { parcelaConfirmandoId = null; refreshPanel(); };
      btnRow.appendChild(confirmarBtn); btnRow.appendChild(cancelarBtn);
      formConf.appendChild(btnRow);

      listWrap.appendChild(formConf);
    }
  });
  container.appendChild(listWrap);
}

// ============ RENDER: MONITORAMENTO (recebido por período e por forma de pagamento) ============
let filtroMonitPeriodo = 'mes'; // 'mes' | 'ano' | 'custom'
let filtroComissaoPeriodo = 'tudo'; // 'tudo' | 'mes' | 'ano' | 'custom'
let filtroComissaoDataIni = '';
let filtroComissaoDataFim = '';
let filtroMonitDataIni = '';
let filtroMonitDataFim = '';

function renderMonitoramento(container){
  container.appendChild(el('div', { class:'section-title' }, document.createTextNode('Monitoramento de recebimentos')));
  container.appendChild(el('p', { style:'font-size:12px;color:var(--muted);margin-top:-6px;margin-bottom:14px;' },
    document.createTextNode('Acompanhe quanto entrou (e quanto ainda falta entrar) por período e por forma de pagamento.')));

  const hoje = new Date();
  const hojeISO = hoje.getFullYear()+'-'+String(hoje.getMonth()+1).padStart(2,'0')+'-'+String(hoje.getDate()).padStart(2,'0');

  const filterRow = el('div', { class:'filter-row' });
  [['mes','Este mês'],['ano','Este ano'],['custom','Período personalizado']].forEach(([key,label]) => {
    const chip = el('div', { class:'filter-chip'+(filtroMonitPeriodo===key?' selected':'') }, document.createTextNode(label));
    chip.onclick = () => { filtroMonitPeriodo = key; refreshPanel(); };
    filterRow.appendChild(chip);
  });
  container.appendChild(filterRow);

  let dataIni, dataFim, labelPeriodo;
  if(filtroMonitPeriodo === 'mes'){
    dataIni = hojeISO.slice(0,8)+'01';
    const ultimoDia = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0).getDate();
    dataFim = hojeISO.slice(0,8)+String(ultimoDia).padStart(2,'0');
    labelPeriodo = hoje.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  } else if(filtroMonitPeriodo === 'ano'){
    dataIni = hoje.getFullYear()+'-01-01';
    dataFim = hoje.getFullYear()+'-12-31';
    labelPeriodo = 'ano de '+hoje.getFullYear();
  } else {
    const row = el('div', { class:'row', style:'margin-top:10px;' });
    const iniField = el('div', { class:'field' });
    iniField.appendChild(el('label', {}, document.createTextNode('De')));
    const iniInput = el('input', { type:'date', value: filtroMonitDataIni || hojeISO.slice(0,8)+'01' });
    iniInput.oninput = (e) => { filtroMonitDataIni = e.target.value; refreshPanel(); };
    iniField.appendChild(iniInput);
    row.appendChild(iniField);
    const fimField = el('div', { class:'field' });
    fimField.appendChild(el('label', {}, document.createTextNode('Até')));
    const fimInput = el('input', { type:'date', value: filtroMonitDataFim || hojeISO });
    fimInput.oninput = (e) => { filtroMonitDataFim = e.target.value; refreshPanel(); };
    fimField.appendChild(fimInput);
    row.appendChild(fimField);
    container.appendChild(row);
    dataIni = filtroMonitDataIni || hojeISO.slice(0,8)+'01';
    dataFim = filtroMonitDataFim || hojeISO;
    labelPeriodo = 'de '+formatDateBR(dataIni)+' até '+formatDateBR(dataFim);
  }

  // Junta todas as parcelas com o lançamento de origem, igual em Parcelas e Recebimentos
  const todas = todasParcelasComContexto();

  const recebidasNoPeriodo = todas.filter(x => x.parcela.pago && x.parcela.dataRecebimento && x.parcela.dataRecebimento >= dataIni && x.parcela.dataRecebimento <= dataFim);
  const totalRecebidoPeriodo = recebidasNoPeriodo.reduce((s,x)=>s+x.parcela.valor,0);

  const REGEX_DATA_ISO = /^\d{4}-\d{2}-\d{2}$/;
  const todasPendentes = todas.filter(x => !x.parcela.pago);
  const pendentesSemDataValida = todasPendentes.filter(x => !x.parcela.data || !REGEX_DATA_ISO.test(x.parcela.data));
  const pendentesNoPeriodo = todasPendentes.filter(x => x.parcela.data && REGEX_DATA_ISO.test(x.parcela.data) && x.parcela.data >= dataIni && x.parcela.data <= dataFim);
  const totalPendentePeriodo = pendentesNoPeriodo.reduce((s,x)=>s+x.parcela.valor,0);

  const summary = el('div', { class:'summary-grid', style:'margin-top:14px;' });
  summary.appendChild(el('div', { class:'summary-card' }, [
    el('div', { class:'summary-num green' }, document.createTextNode('R$ '+formatMoney(totalRecebidoPeriodo))),
    el('div', { class:'summary-label' }, document.createTextNode('Recebido — '+labelPeriodo))
  ]));
  summary.appendChild(el('div', { class:'summary-card' }, [
    el('div', { class:'summary-num amber' }, document.createTextNode('R$ '+formatMoney(totalPendentePeriodo))),
    el('div', { class:'summary-label' }, document.createTextNode('A vencer — '+labelPeriodo))
  ]));
  container.appendChild(summary);

  if(pendentesSemDataValida.length){
    const totalSemData = pendentesSemDataValida.reduce((s,x)=>s+x.parcela.valor,0);
    container.appendChild(el('div', { style:'background:#FFF3E0;border:1.5px solid var(--amber);border-radius:10px;padding:10px 14px;margin-top:10px;font-size:12px;color:#8A5A0F;' },
      document.createTextNode('⚠ '+pendentesSemDataValida.length+' parcela(s) pendente(s), totalizando R$ '+formatMoney(totalSemData)+', estão sem data de vencimento definida — por isso não entram em nenhum período aqui. Veja e corrija na aba "Parcelas e Recebimentos".')));
  }

  // ---- Por forma de pagamento (dentro do período escolhido) ----
  container.appendChild(el('div', { class:'section-title', style:'margin-top:22px;' }, document.createTextNode('Recebido por forma de pagamento — '+labelPeriodo)));
  const formasNoPeriodo = {};
  recebidasNoPeriodo.forEach(x => {
    const forma = x.parcela.forma || 'Não informado';
    formasNoPeriodo[forma] = (formasNoPeriodo[forma]||0) + x.parcela.valor;
  });
  const formasOrdenadas = Object.entries(formasNoPeriodo).sort((a,b)=>b[1]-a[1]);
  if(!formasOrdenadas.length){
    container.appendChild(el('div', { class:'empty-hint' }, document.createTextNode('Nenhum recebimento neste período ainda.')));
  } else {
    formasOrdenadas.forEach(([forma, valor]) => {
      const linha = el('div', { style:'display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-light);font-size:13.5px;' });
      linha.appendChild(el('span', {}, document.createTextNode(forma)));
      linha.appendChild(el('span', { style:'font-weight:700;color:var(--green);' }, document.createTextNode('R$ '+formatMoney(valor))));
      container.appendChild(linha);
    });
  }

  // ---- Visão geral (todo o histórico) por forma: recebido x a receber ----
  container.appendChild(el('div', { class:'section-title', style:'margin-top:22px;' }, document.createTextNode('Visão geral por forma de pagamento (todo o histórico)')));
  const geralPorForma = {};
  todas.forEach(x => {
    const forma = x.parcela.forma || 'Não informado';
    if(!geralPorForma[forma]) geralPorForma[forma] = { recebido:0, pendente:0 };
    if(x.parcela.pago) geralPorForma[forma].recebido += x.parcela.valor;
    else geralPorForma[forma].pendente += x.parcela.valor;
  });
  const geralOrdenado = Object.entries(geralPorForma).sort((a,b)=>(b[1].recebido+b[1].pendente)-(a[1].recebido+a[1].pendente));
  if(!geralOrdenado.length){
    container.appendChild(el('div', { class:'empty-hint' }, document.createTextNode('Nenhum lançamento cadastrado ainda.')));
  } else {
    geralOrdenado.forEach(([forma, v]) => {
      const card = el('div', { class:'card', style:'margin-bottom:8px;' });
      card.appendChild(el('div', { class:'card-title' }, document.createTextNode(forma)));
      const linha = el('div', { style:'display:flex;gap:16px;margin-top:6px;font-size:13px;' });
      linha.appendChild(el('span', {}, [document.createTextNode('Recebido: '), el('b', { style:'color:var(--green);' }, document.createTextNode('R$ '+formatMoney(v.recebido)))]));
      linha.appendChild(el('span', {}, [document.createTextNode('A receber: '), el('b', { style:'color:var(--amber);' }, document.createTextNode('R$ '+formatMoney(v.pendente)))]));
      card.appendChild(linha);
      container.appendChild(card);
    });
  }
}


let agendamentoConsultasCache = [];
async function carregarAgendamentoConsultasCache(){
  try{
    const dados = await ClinicaStorage.load('controle_agendamento_progresso_v1');
    const profissionaisAgenda = (dados && dados.profissionais) || [];
    const consultas = (dados && dados.consultas) || [];
    agendamentoConsultasCache = consultas.map(c => {
      const profAgenda = profissionaisAgenda.find(p => p.id === c.profissionalId);
      return Object.assign({}, c, { __profNome: profAgenda ? profAgenda.nome : '' });
    });
  }catch(e){
    agendamentoConsultasCache = [];
  }
}

function calcularComissoes(dataIni, dataFim){
  const agora = new Date();
  const hojeISO = agora.getFullYear()+'-'+String(agora.getMonth()+1).padStart(2,'0')+'-'+String(agora.getDate()).padStart(2,'0');
  const horaAtual = agora.getHours() + agora.getMinutes()/60;
  const ultimoDiaMesAtual = new Date(agora.getFullYear(), agora.getMonth()+1, 0).getDate();
  const mesFechado = agora.getDate() >= ultimoDiaMesAtual; // o fixo só vence no último dia do mês

  const porProfissional = state.profissionais.map(prof => {
    const lancsDoProf = state.lancamentos.filter(l => l.profissionalId === prof.id);
    let recebido = 0, pendente = 0, totalContratado = 0;
    lancsDoProf.forEach(l => {
      l.parcelas.forEach(p => {
        totalContratado += p.valor;
        if(p.pago) recebido += p.valor; else pendente += p.valor;
      });
    });
    const pct = parseFloat((prof.pagamento && prof.pagamento.percentual) || prof.comissaoPercent) || 0;

    // Percentual (comissão de venda): 100% MANUAL. Não é calculado por fórmula nenhuma — é a
    // soma do que o gestor da clínica atribuiu a este profissional, pagamento por pagamento,
    // ao confirmar cada recebimento (ou ajustar depois). Filtra pelo período, se informado.
    let comissaoPercentual = 0, qtdParcelasPercentual = 0;
    state.lancamentos.forEach(l => {
      l.parcelas.forEach(p => {
        if(!p.pago || !(p.comissoes||[]).length) return;
        if(dataIni && (!p.dataRecebimento || p.dataRecebimento < dataIni)) return;
        if(dataFim && (!p.dataRecebimento || p.dataRecebimento > dataFim)) return;
        p.comissoes.forEach(c => {
          if(c.profissionalId === prof.id){ comissaoPercentual += (parseFloat(c.valor)||0); qtdParcelasPercentual++; }
        });
      });
    });

    // Diária: conta automaticamente a partir das 19h do dia em que o profissional teve paciente
    // agendado — soma os dias trabalhados, independente de contrato fechado ou tratamento feito.
    const nomeNorm = (prof.nome||'').trim().toLowerCase();
    const consultasDoProf = agendamentoConsultasCache.filter(c =>
      c.status === 'confirmado' && (c.__profNome || '').trim().toLowerCase() === nomeNorm
    );
    const consultasDiariaDevida = consultasDoProf.filter(c => {
      const valorDiaria = parseFloat(c.valorDiaria)||0;
      if(valorDiaria <= 0) return false;
      if(dataIni && c.data < dataIni) return false;
      if(dataFim && c.data > dataFim) return false;
      if(!dataFim){ // sem filtro de período: só considera o que já venceu (regra padrão)
        if(c.data < hojeISO) return true;
        if(c.data === hojeISO && horaAtual >= 19) return true;
        return false;
      }
      return true; // com período filtrado, mostra tudo que caiu dentro dele
    });
    const comissaoDiaria = consultasDiariaDevida.reduce((s,c) => s + (parseFloat(c.valorDiaria)||0), 0);

    const comissaoAgendamento = comissaoPercentual + comissaoDiaria;

    // Ajustes manuais feitos pelo administrador em parcelas (com a opção "afeta a comissão"
    // marcada) somam ou descontam direto do valor devido a esse profissional.
    const ajusteComissaoManual = lancsDoProf.reduce((s,l) => s + (l.ajusteComissaoTotal||0), 0);

    // Fixo: só vence no último dia de cada mês.
    const fixoConfigurado = parseFloat(prof.pagamento && prof.pagamento.fixo) || 0;
    const fixoMensal = mesFechado ? fixoConfigurado : 0;

    return {
      prof, totalContratado, recebido, pendente, comissao: recebido*pct/100, pct,
      comissaoAgendamento, comissaoPercentual, comissaoDiaria, ajusteComissaoManual,
      qtdConsultasPercentual: qtdParcelasPercentual, qtdConsultasDiaria: consultasDiariaDevida.length,
      fixoMensal, fixoConfigurado, mesFechado, ultimoDiaMesAtual,
    };
  });
  const semProfissional = state.lancamentos.filter(l => !l.profissionalId);
  let semProfTotal = 0, semProfRecebido = 0;
  semProfissional.forEach(l => l.parcelas.forEach(p => { semProfTotal+=p.valor; if(p.pago) semProfRecebido+=p.valor; }));

  // Rateios fixos (Clínica, Secretária etc.) incidem sobre TODO valor recebido, de qualquer lançamento
  let totalRecebidoGeralBruto = 0;
  state.lancamentos.forEach(l => l.parcelas.forEach(p => { if(p.pago) totalRecebidoGeralBruto += p.valor; }));
  const porRateioFixo = state.rateiosFixos.map(rateio => {
    const pct = parseFloat(rateio.percentual)||0;
    return { rateio, pct, valor: totalRecebidoGeralBruto*pct/100 };
  });

  return { porProfissional, semProfTotal, semProfRecebido, temSemProfissional: semProfissional.length>0, porRateioFixo, totalRecebidoGeralBruto };
}

function renderComissoes(container){
  container.appendChild(el('div', { class:'section-title' }, document.createTextNode('Comissões por profissional')));

  if(!state.profissionais.length && !state.rateiosFixos.length){
    container.appendChild(el('div', { class:'empty-hint' }, document.createTextNode('Cadastre profissionais e/ou rateios fixos na aba "Profissionais" para calcular as comissões.')));
    return;
  }

  const filterRow = el('div', { class:'filter-row' });
  [['tudo','Tudo (sem filtro)'],['mes','Este mês'],['ano','Este ano'],['custom','Período personalizado']].forEach(([key,label]) => {
    const chip = el('div', { class:'filter-chip'+(filtroComissaoPeriodo===key?' selected':'') }, document.createTextNode(label));
    chip.onclick = () => { filtroComissaoPeriodo = key; refreshPanel(); };
    filterRow.appendChild(chip);
  });
  container.appendChild(filterRow);

  const hoje = new Date();
  const hojeISOFiltro = hoje.getFullYear()+'-'+String(hoje.getMonth()+1).padStart(2,'0')+'-'+String(hoje.getDate()).padStart(2,'0');
  let dataIniFiltro = null, dataFimFiltro = null, labelPeriodoComissao = 'todo o período';
  if(filtroComissaoPeriodo === 'mes'){
    dataIniFiltro = hojeISOFiltro.slice(0,8)+'01';
    dataFimFiltro = hojeISOFiltro.slice(0,8)+String(new Date(hoje.getFullYear(), hoje.getMonth()+1, 0).getDate()).padStart(2,'0');
    labelPeriodoComissao = hoje.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  } else if(filtroComissaoPeriodo === 'ano'){
    dataIniFiltro = hoje.getFullYear()+'-01-01';
    dataFimFiltro = hoje.getFullYear()+'-12-31';
    labelPeriodoComissao = 'ano de '+hoje.getFullYear();
  } else if(filtroComissaoPeriodo === 'custom'){
    const row = el('div', { class:'row', style:'margin-top:10px;' });
    const iniField = el('div', { class:'field' });
    iniField.appendChild(el('label', {}, document.createTextNode('De')));
    const iniInput = el('input', { type:'date', value: filtroComissaoDataIni || hojeISOFiltro.slice(0,8)+'01' });
    iniInput.oninput = (e) => { filtroComissaoDataIni = e.target.value; refreshPanel(); };
    iniField.appendChild(iniInput);
    row.appendChild(iniField);
    const fimField = el('div', { class:'field' });
    fimField.appendChild(el('label', {}, document.createTextNode('Até')));
    const fimInput = el('input', { type:'date', value: filtroComissaoDataFim || hojeISOFiltro });
    fimInput.oninput = (e) => { filtroComissaoDataFim = e.target.value; refreshPanel(); };
    fimField.appendChild(fimInput);
    row.appendChild(fimField);
    container.appendChild(row);
    dataIniFiltro = filtroComissaoDataIni || hojeISOFiltro.slice(0,8)+'01';
    dataFimFiltro = filtroComissaoDataFim || hojeISOFiltro;
    labelPeriodoComissao = 'de '+formatDateBR(dataIniFiltro)+' até '+formatDateBR(dataFimFiltro);
  }

  const { porProfissional, semProfTotal, semProfRecebido, temSemProfissional, porRateioFixo, totalRecebidoGeralBruto } = calcularComissoes(dataIniFiltro, dataFimFiltro);

  container.appendChild(el('p', { style:'font-size:12px;color:var(--muted);margin:10px 0 0;' },
    document.createTextNode('Comissões por venda (%) mostradas: ' + labelPeriodoComissao + '. "Total recebido" e "rateio fixo" continuam somando tudo, de todo o histórico.')));

  const totalComissoes = porProfissional.reduce((s,x)=>s+x.comissaoAgendamento+x.fixoMensal,0) + porRateioFixo.reduce((s,x)=>s+x.valor,0);
  const totalRecebidoGeral = porProfissional.reduce((s,x)=>s+x.recebido,0) + semProfRecebido;
  const summary = el('div', { class:'summary-grid', style:'margin-top:10px;' });
  summary.appendChild(el('div', { class:'summary-card' }, [
    el('div', { class:'summary-num green' }, document.createTextNode('R$ '+formatMoney(totalRecebidoGeral))),
    el('div', { class:'summary-label' }, document.createTextNode('Total recebido'))
  ]));
  summary.appendChild(el('div', { class:'summary-card' }, [
    el('div', { class:'summary-num' }, document.createTextNode('R$ '+formatMoney(totalComissoes))),
    el('div', { class:'summary-label' }, document.createTextNode('Total rateado (profissionais + fixos)'))
  ]));
  container.appendChild(summary);

  if(state.profissionais.length){
    container.appendChild(el('div', { style:'font-size:13px;font-weight:700;color:var(--blue-dark);margin:16px 0 8px;' }, document.createTextNode('Por profissional (sobre o que cada um atendeu)')));
  }
  porProfissional.forEach(({prof, totalContratado, recebido, pendente, comissao, pct, comissaoAgendamento, comissaoPercentual, comissaoDiaria, ajusteComissaoManual, qtdConsultasPercentual, qtdConsultasDiaria, fixoMensal, fixoConfigurado, mesFechado, ultimoDiaMesAtual}) => {
    const card = el('div', { class:'card' });
    const pg = prof.pagamento || {};
    const descPagamento = [
      (pg.percentual!==undefined && pg.percentual!=='') ? pg.percentual+'% comissão' : null,
      parseFloat(pg.diaria)>0 ? 'R$ '+formatMoney(parseFloat(pg.diaria))+'/diária' : null,
      parseFloat(pg.fixo)>0 ? 'R$ '+formatMoney(parseFloat(pg.fixo))+'/fixo mensal' : null,
    ].filter(Boolean).join(' + ') || 'sem forma de pagamento configurada';
    card.appendChild(el('div', { class:'card-title' }, document.createTextNode(prof.nome)));
    card.appendChild(el('div', { class:'card-sub' }, document.createTextNode(descPagamento)));

    card.appendChild(el('div', { style:'margin-top:10px;font-size:19px;font-weight:700;color:var(--green);' },
      document.createTextNode('Total devido agora: R$ '+formatMoney(comissaoAgendamento+fixoMensal+ajusteComissaoManual))));

    if(comissaoPercentual > 0 || (pg.percentual!==undefined && pg.percentual!=='')){
      card.appendChild(el('div', { class:'card-sub', style:'margin-top:6px;' }, document.createTextNode(
        '• Comissões atribuídas manualmente: R$ '+formatMoney(comissaoPercentual)+' ('+qtdConsultasPercentual+' pagamento(s) — '+labelPeriodoComissao+')'
      )));
    }
    if(parseFloat(pg.diaria)>0){
      card.appendChild(el('div', { class:'card-sub' }, document.createTextNode(
        '• Diária: R$ '+formatMoney(comissaoDiaria)+' ('+qtdConsultasDiaria+' dia(s), a partir das 19h do dia com paciente agendado)'
      )));
    }
    if(parseFloat(pg.fixo)>0){
      card.appendChild(el('div', { class:'card-sub' }, document.createTextNode(
        mesFechado
          ? ('• Fixo mensal: R$ '+formatMoney(fixoMensal)+' (venceu no dia '+ultimoDiaMesAtual+', último dia do mês)')
          : ('• Fixo mensal: R$ '+formatMoney(fixoConfigurado)+' — ainda não venceu (vence só no dia '+ultimoDiaMesAtual+', último dia do mês)')
      )));
    }
    if(ajusteComissaoManual){
      card.appendChild(el('div', { class:'card-sub', style:'color:'+(ajusteComissaoManual>0?'var(--green)':'var(--red)')+';' }, document.createTextNode(
        '• Ajuste manual do administrador: ' + (ajusteComissaoManual>0?'+':'') + 'R$ ' + formatMoney(ajusteComissaoManual)
      )));
    }

    card.appendChild(el('div', { style:'font-size:11px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--line-light);' },
      document.createTextNode('Referência (baseado em pagamentos recebidos): total contratado R$ '+formatMoney(totalContratado)+' • recebido R$ '+formatMoney(recebido)+' • pendente R$ '+formatMoney(pendente))));
    container.appendChild(card);
  });

  if(porRateioFixo.length){
    container.appendChild(el('div', { style:'font-size:13px;font-weight:700;color:var(--blue-dark);margin:16px 0 8px;' }, document.createTextNode('Rateios fixos (sobre TODO valor recebido: R$ '+formatMoney(totalRecebidoGeralBruto)+')')));
    porRateioFixo.forEach(({rateio, pct, valor}) => {
      const card = el('div', { class:'card' });
      card.appendChild(el('div', { class:'card-title' }, document.createTextNode(rateio.nome + ' — '+pct+'%')));
      card.appendChild(el('div', { style:'margin-top:8px;font-size:18px;font-weight:700;color:var(--green);' },
        document.createTextNode('Valor rateado: R$ '+formatMoney(valor))));
      container.appendChild(card);
    });
  }

  if(temSemProfissional){
    const card = el('div', { class:'card', style:'border-color:var(--amber);background:#FFFBF2;' });
    card.appendChild(el('div', { class:'card-title', style:'color:var(--amber);' }, document.createTextNode('⚠ Lançamentos sem profissional atribuído')));
    card.appendChild(el('div', { class:'card-sub' }, document.createTextNode('Total recebido não considerado em nenhuma comissão: R$ '+formatMoney(semProfRecebido))));
    card.appendChild(el('div', { class:'card-sub' }, document.createTextNode('Vá em "Lançamentos" e atribua um profissional a cada um para incluir na comissão.')));
    container.appendChild(card);
  }

  const pdfBtn = el('div', { class:'add-row-btn', style:'margin-top:16px;background:var(--green);border:none;color:#fff;text-align:center;font-size:15px;padding:14px;' },
    document.createTextNode('📄 Gerar PDF do relatório de comissões'));
  pdfBtn.onclick = () => generateComissoesPDF(porProfissional, semProfTotal, semProfRecebido, temSemProfissional, porRateioFixo, totalRecebidoGeralBruto);
  container.appendChild(pdfBtn);
}

function generateComissoesPDF(porProfissional, semProfTotal, semProfRecebido, temSemProfissional, porRateioFixo, totalRecebidoGeralBruto){
  if(!window.jspdf || !window.jspdf.jsPDF){
    alert('Não foi possível carregar a biblioteca de geração de PDF. Verifique sua conexão com a internet e tente novamente.');
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const pageW=595.28, pageH=841.89, marginX=40, contentW=pageW-marginX*2;
  const BLUE=window._clinicaCorPrimariaRGB||[31,92,139], INK=[26,26,26], MUTED=[91,107,122], GREEN=[46,139,87], LINECOL=[155,187,212], BLUEHEAD=window.clarearCor(BLUE,0.85), BLUELIGHT=window.clarearCor(BLUE,0.93);
  let y=50;
  function ensureSpace(needed){ if(y+needed>pageH-50){ doc.addPage(); desenharMarcaDagua(doc, pageW, pageH, window._clinicaPerfil); y=50; } }

  desenharMarcaDagua(doc, pageW, pageH, window._clinicaPerfil);

  const perfil = window._clinicaPerfil;
  if(perfil && (perfil.nome || perfil.logo)){
    if(perfil.logo){
      try{
        const fmt = perfil.logo.includes('image/png') ? 'PNG' : 'JPEG';
        doc.addImage(perfil.logo, fmt, marginX, y-14, 30, 30);
      }catch(e){}
    }
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...MUTED);
    doc.text(perfil.nome || '', marginX + (perfil.logo?36:0), y);
    y += 16;
  }

  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(...BLUE);
  doc.text('Relatório de Comissões', marginX, y);
  y += 18;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...MUTED);
  const hoje = new Date();
  doc.text('Gerado em ' + String(hoje.getDate()).padStart(2,'0')+'/'+String(hoje.getMonth()+1).padStart(2,'0')+'/'+hoje.getFullYear(), marginX, y);
  y += 14;
  doc.setDrawColor(...BLUE); doc.setLineWidth(1.2);
  doc.line(marginX, y, pageW-marginX, y);
  y += 22;

  const headers = ['Profissional','Forma de pagamento','Consultas','A pagar'];
  const widths = [contentW*0.28, contentW*0.34, contentW*0.16, contentW*0.22];
  const rowH = 22;
  function drawHeader(){
    let cx = marginX;
    headers.forEach((h,i) => {
      doc.setFillColor(...BLUEHEAD); doc.setDrawColor(...LINECOL);
      doc.rect(cx, y, widths[i], rowH, 'FD');
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...BLUE);
      doc.text(h, cx+5, y+rowH-7);
      cx += widths[i];
    });
    y += rowH;
  }
  ensureSpace(rowH*2);
  drawHeader();
  let totalComissoes = 0, totalRecebido = 0;
  porProfissional.forEach((item, ri) => {
    if(y+rowH>pageH-50){ doc.addPage(); y=50; drawHeader(); }
    const aPagar = item.comissaoAgendamento + item.fixoMensal + (item.ajusteComissaoManual||0);
    totalComissoes += aPagar; totalRecebido += item.recebido;
    const pg = item.prof.pagamento || {};
    const descPagamento = [
      (pg.percentual!==undefined && pg.percentual!=='') ? pg.percentual+'% com.' : null,
      parseFloat(pg.diaria)>0 ? 'R$ '+formatMoney(parseFloat(pg.diaria))+'/dia' : null,
      parseFloat(pg.fixo)>0 ? 'R$ '+formatMoney(parseFloat(pg.fixo))+'/mês fixo' : null,
    ].filter(Boolean).join(' + ') || '—';
    let cx = marginX;
    const rowFill = ri%2===1 ? BLUELIGHT : [255,255,255];
    const valores = [item.prof.nome, descPagamento, String(item.qtdConsultasPercentual + item.qtdConsultasDiaria), 'R$ '+formatMoney(aPagar)];
    valores.forEach((val,ci) => {
      doc.setFillColor(...rowFill); doc.setDrawColor(...LINECOL);
      doc.rect(cx, y, widths[ci], rowH, 'FD');
      doc.setFont('helvetica', ci===3?'bold':'normal'); doc.setFontSize(9);
      doc.setTextColor(ci===3?GREEN[0]:INK[0], ci===3?GREEN[1]:INK[1], ci===3?GREEN[2]:INK[2]);
      const clipped = doc.splitTextToSize(String(val), widths[ci]-6)[0]||'';
      doc.text(clipped, cx+5, y+rowH-7);
      cx += widths[ci];
    });
    y += rowH;
  });
  y += 10;
  ensureSpace(30);
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(...BLUE);
  doc.text('Total recebido (todos os profissionais): R$ '+formatMoney(totalRecebido), marginX, y);
  y += 16;
  doc.setTextColor(...GREEN);
  doc.text('Total de comissões a pagar: R$ '+formatMoney(totalComissoes), marginX, y);
  y += 20;

  if(porRateioFixo && porRateioFixo.length){
    ensureSpace(rowH*2 + 30);
    y += 10;
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...BLUE);
    doc.text('Rateios fixos', marginX, y);
    y += 6;
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...MUTED);
    doc.text('Incidem sobre todo o valor recebido: R$ '+formatMoney(totalRecebidoGeralBruto), marginX, y);
    y += 16;

    const headers2 = ['Rateio','%','Valor'];
    const widths2 = [contentW*0.5, contentW*0.2, contentW*0.3];
    function drawHeader2(){
      let cx = marginX;
      headers2.forEach((h,i) => {
        doc.setFillColor(...BLUEHEAD); doc.setDrawColor(...LINECOL);
        doc.rect(cx, y, widths2[i], rowH, 'FD');
        doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...BLUE);
        doc.text(h, cx+5, y+rowH-7);
        cx += widths2[i];
      });
      y += rowH;
    }
    drawHeader2();
    let totalRateiosFixos = 0;
    porRateioFixo.forEach((item, ri) => {
      if(y+rowH>pageH-50){ doc.addPage(); y=50; drawHeader2(); }
      totalRateiosFixos += item.valor;
      let cx = marginX;
      const rowFill = ri%2===1 ? BLUELIGHT : [255,255,255];
      const valores2 = [item.rateio.nome, (item.pct||0)+'%', 'R$ '+formatMoney(item.valor)];
      valores2.forEach((val,ci) => {
        doc.setFillColor(...rowFill); doc.setDrawColor(...LINECOL);
        doc.rect(cx, y, widths2[ci], rowH, 'FD');
        doc.setFont('helvetica', ci===2?'bold':'normal'); doc.setFontSize(9);
        doc.setTextColor(ci===2?GREEN[0]:INK[0], ci===2?GREEN[1]:INK[1], ci===2?GREEN[2]:INK[2]);
        const clipped2 = doc.splitTextToSize(String(val), widths2[ci]-6)[0]||'';
        doc.text(clipped2, cx+5, y+rowH-7);
        cx += widths2[ci];
      });
      y += rowH;
    });
    y += 10;
    ensureSpace(20);
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(...GREEN);
    doc.text('Total de rateios fixos: R$ '+formatMoney(totalRateiosFixos), marginX, y);
    y += 20;
  }

  if(temSemProfissional){
    ensureSpace(30);
    doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(...MUTED);
    const aviso = doc.splitTextToSize('Atenção: há R$ '+formatMoney(semProfRecebido)+' recebidos de lançamentos sem profissional atribuído, não incluídos neste cálculo de comissões.', contentW);
    doc.text(aviso, marginX, y);
  }

  doc.save('relatorio_comissoes_'+hoje.getFullYear()+'-'+String(hoje.getMonth()+1).padStart(2,'0')+'-'+String(hoje.getDate()).padStart(2,'0')+'.pdf');
  toast('PDF do relatório gerado com sucesso!');
}

// ============ NAVEGAÇÃO ============
function renderNav(){
  const nav = document.getElementById('stepsNav');
  nav.innerHTML = '';
  if(STEPS.length <= 1){ nav.style.display = 'none'; return; }
  nav.style.display = '';
  STEPS.forEach((label, i) => {
    const btn = el('button', { class: i===currentStep?'active':'' }, document.createTextNode(label));
    btn.onclick = () => { currentStep = i; renderPanel(i); };
    nav.appendChild(btn);
  });
}
function renderPanel(stepIndex, opts={}){
  currentStep = stepIndex;
  renderNav();
  const main = document.getElementById('main');
  const scrollY = window.scrollY;
  main.innerHTML = '';
  const renderers = [renderLancamentos];
  renderers[stepIndex](main);
  if(opts.keepScroll){ window.scrollTo(0, scrollY); } else { window.scrollTo(0,0); }
}
function refreshPanel(){ renderPanel(currentStep, { keepScroll:true }); }

// ============ INICIALIZAÇÃO ============
(async function iniciarFinanceiro(){
  window._clinicaPerfil = await aplicarIdentidadeClinica();
  const meResp = await fetch('/api/me', { credentials:'same-origin' });
  window._clinicaMe = meResp.ok ? await meResp.json() : null;
  await carregarAgendamentoConsultasCache();
  await clinicaInitPacientes();
  await loadProgress();
  await carregarProfissionaisCompartilhados();
  renderPanel(currentStep);
})();
</script>
