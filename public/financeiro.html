<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Financeiro — Zelo</title>
<script src="client-storage.js"></script>
<script src="clinic-branding.js"></script>
<script src="shared-data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" onerror="
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';
  document.head.appendChild(s);
"></script>
<style>
  :root{
    --blue-dark:#1F5C8B; --blue-med:#2E75B6; --blue-head:#D6E7F3; --blue-light:#EFF6FB;
    --line:#9BBBD4; --line-light:#C9DCEC; --ink:#1A1A1A; --muted:#5B6B7A;
    --green:#2E8B57; --red:#C0392B; --amber:#C98A1F; --bg:#F4F8FB;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:Arial, Helvetica, sans-serif; background:var(--bg); color:var(--ink); -webkit-tap-highlight-color:transparent;}
  header.topbar{
    background:#fff; border-bottom:3px solid var(--blue-dark); padding:14px 16px;
    display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:20;
  }
  header.topbar h1{font-size:18px; margin:0; color:var(--blue-dark); font-weight:700;}
  header.topbar p{margin:2px 0 0; font-size:12px; color:var(--muted); font-style:italic;}

  nav.steps{
    display:flex; overflow-x:auto; background:#fff; border-bottom:1px solid var(--line-light);
    position:sticky; top:62px; z-index:19; -webkit-overflow-scrolling:touch;
  }
  nav.steps button{
    flex:0 0 auto; padding:12px 16px; font-size:13px; font-weight:700; border:none; background:transparent;
    color:var(--muted); border-bottom:3px solid transparent; cursor:pointer; white-space:nowrap;
  }
  nav.steps button.active{color:var(--blue-dark); border-bottom-color:var(--blue-dark);}

  main{max-width:1600px; width:100%; box-sizing:border-box; margin:0 auto; padding:18px 14px 40px;}

  .section-title{
    background:var(--blue-dark); color:#fff; font-weight:700; font-size:14px; letter-spacing:.5px;
    padding:10px 14px; border-radius:6px; margin:18px 0 12px; text-transform:uppercase;
  }
  .section-title:first-child{margin-top:0;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; font-weight:700; margin-bottom:5px; color:var(--ink);}
  .field input[type=text], .field input[type=date], .field input[type=number], .field select{
    width:100%; padding:12px 10px; font-size:16px; border:1.5px solid var(--line); border-radius:8px;
    background:#fff; font-family:inherit;
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--blue-dark); box-shadow:0 0 0 3px var(--blue-head);}
  .row{display:flex; gap:10px; flex-wrap:wrap;}
  .row > .field{flex:1; min-width:130px;}

  .add-row-btn{
    margin-top:8px; padding:12px 14px; border:1.5px dashed var(--line); background:#fff; border-radius:8px;
    color:var(--blue-dark); font-weight:700; font-size:14px; cursor:pointer; text-align:center; position:relative; overflow:hidden;
  }
  .add-row-btn input[type=file]{position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer;}

  .card{background:#fff; border:1.5px solid var(--line-light); border-radius:10px; padding:14px; margin-bottom:12px;}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .card-title{font-size:15px; font-weight:700; color:var(--blue-dark);}
  .card-sub{font-size:12px; color:var(--muted); margin-top:2px;}
  .card-actions{display:flex; gap:14px; flex-shrink:0;}
  .card-actions span{cursor:pointer; font-size:13.5px; font-weight:700;}

  .badge{display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700;}
  .badge.pago{background:#E4F3EA; color:var(--green);}
  .badge.pendente{background:#FCF1DC; color:var(--amber);}
  .badge.origem{background:var(--blue-head); color:var(--blue-dark);}

  .empty-hint{text-align:center; padding:20px; color:var(--muted); font-size:13px; background:#fff; border:1.5px dashed var(--line-light); border-radius:10px;}

  table.tx-table{width:100%; border-collapse:collapse; margin-top:10px; font-size:13px;}
  table.tx-table th{background:var(--blue-head); color:var(--blue-dark); font-weight:700; padding:8px 6px; border:1px solid var(--line-light); text-align:left;}
  table.tx-table td{border:1px solid var(--line-light); padding:8px 6px;}
  table.tx-table tr:nth-child(even) td{background:var(--blue-light);}
  table.tx-table td.remove-cell{width:34px; text-align:center; cursor:pointer; color:var(--red); font-weight:900; font-size:15px;}

  .summary-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
  @media(min-width:520px){.summary-grid{grid-template-columns:repeat(3,1fr);}}
  .summary-card{background:#fff; border:1.5px solid var(--line-light); border-radius:10px; padding:12px; text-align:center;}
  .summary-num{font-size:20px; font-weight:700; color:var(--blue-dark);}
  .summary-num.green{color:var(--green);}
  .summary-num.amber{color:var(--amber);}
  .summary-label{font-size:10.5px; color:var(--muted); font-weight:700; text-transform:uppercase; margin-top:2px;}

  .filter-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .filter-chip{
    padding:8px 13px; border-radius:20px; border:1.5px solid var(--line); background:#fff;
    font-weight:700; font-size:12px; color:var(--muted); cursor:pointer; user-select:none;
  }
  .filter-chip.selected{background:var(--blue-dark); border-color:var(--blue-dark); color:#fff;}

  .fin-table{ width:100%; border-collapse:collapse; font-size:13px; background:#fff; border-radius:10px; overflow:hidden; }
  .fin-table thead th{
    text-align:left; padding:10px 12px; background:var(--bg,#F4F8FB); color:var(--muted);
    font-size:11px; text-transform:uppercase; letter-spacing:0.03em; font-weight:700;
    border-bottom:2px solid var(--line-light); white-space:nowrap;
  }
  .fin-table tbody td{ padding:10px 12px; border-bottom:1px solid var(--line-light); white-space:nowrap; }
  .fin-table-row{ cursor:pointer; transition:background .1s; }
  .fin-table-row:hover{ background:#F4F8FB; }
  .fin-table-detail-row td{ background:#FAFBFC; white-space:normal; }
  .parcela-row{
    display:flex; align-items:flex-start; gap:8px; padding:10px; border:1.5px solid var(--line-light); border-radius:8px;
    margin-bottom:8px; background:#fff; flex-wrap:wrap;
  }
  .parcela-row.pago{background:#F3FBF6; border-color:var(--green);}
  .parcela-info{flex:1; font-size:12.5px;}
  .parcela-info .p-valor{font-weight:700; font-size:14px; color:var(--ink);}
  .parcela-info .p-sub{color:var(--muted); font-size:11.5px; margin-top:2px;}
  .parcela-toggle{
    padding:8px 12px; border-radius:8px; border:1.5px solid var(--green); background:#fff; color:var(--green);
    font-weight:700; font-size:11.5px; cursor:pointer; white-space:nowrap;
  }
  .parcela-toggle.marcado{background:var(--green); color:#fff;}

  .toast{
    position:fixed; top:70px; left:50%; transform:translateX(-50%) translateY(-20px);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:8px; font-size:13px;
    opacity:0; transition:all .25s; z-index:50; pointer-events:none; text-align:center; max-width:90%;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
<link rel="stylesheet" href="theme.css">
<script src="nav-home.js"></script>
</head>
<body>

<header class="topbar">
  <div>
    <h1>Controle de Pagamentos e Comissões</h1>
    <p>Alimentado pelas fichas de anamnese</p>
  </div>
</header>

<nav class="steps" id="stepsNav"></nav>

<main id="main"></main>

<div class="toast" id="toast"></div>

<script>
// ============ ESTADO ============
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

const state = {
  profissionais: [], // {id, nome, comissaoPercent}
  rateiosFixos: [],  // {id, nome, percentual} — ex: "Clínica" 30%, "Secretária" 5% — aplicado sobre TODO valor recebido, além da comissão do profissional
  lancamentos: []    // {id, paciente, profissionalId, profissionalNomeOriginal, clinicaNome, dataContrato, valorTotal, tratamentos:[{descricao,valor}], parcelas:[{id,valor,data,forma,pago,dataRecebimento}], origem}
};

const STEPS = ['Lançamentos'];
let currentStep = 0;

// ============ PERSISTÊNCIA (servidor com reserva local) ============
const STORAGE_KEY = 'controle_pagamentos_comissoes_v1';
function saveProgress(){ ClinicaStorage.save(STORAGE_KEY, state); }
let _saveTimer=null;
function saveProgressDebounced(){ clearTimeout(_saveTimer); _saveTimer=setTimeout(saveProgress,400); }
async function loadProgress(){
  const saved = await ClinicaStorage.load(STORAGE_KEY);
  if(!saved) return false;
  Object.keys(state).forEach(k => { if(saved[k]!==undefined) state[k]=saved[k]; });
  return true;
}
function clearProgress(){ ClinicaStorage.save(STORAGE_KEY, null); try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} }

// A partir de agora, quem cadastra profissionais é o Perfil da Clínica (lista compartilhada,
// a mesma usada no Agendamento). Aqui, só migra dados antigos (se o Financeiro já tinha
// profissionais cadastrados por ele mesmo, antes dessa mudança) e depois só faz leitura.
const CHAVE_PROFISSIONAIS_COMPARTILHADA = 'clinica_profissionais_agenda_v1';
async function carregarProfissionaisCompartilhados(){
  let compartilhados = await ClinicaStorage.load(CHAVE_PROFISSIONAIS_COMPARTILHADA);
  if((!compartilhados || !compartilhados.length) && state.profissionais && state.profissionais.length){
    // Migração única: leva os profissionais (com forma de pagamento) que já existiam
    // localmente no Financeiro para o local compartilhado, preservando os IDs.
    compartilhados = state.profissionais;
    await ClinicaStorage.save(CHAVE_PROFISSIONAIS_COMPARTILHADA, compartilhados);
  }
  state.profissionais = compartilhados || [];
  state.profissionais.forEach(p => { if(!p.pagamento) p.pagamento = { percentual: p.comissaoPercent||'', diaria:'', fixo:'' }; });
}

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

// ============ HELPERS DE RENDER ============
function el(tag, attrs={}, children=[]){
  const e=document.createElement(tag);
  for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{ if(c) e.appendChild(c); });
  return e;
}
function textField(label, store, key, opts={}){
  const f=el('div',{class:'field'});
  f.appendChild(el('label',{},document.createTextNode(label)));
  const input=el('input',{type:opts.type||'text', value:store[key]||''});
  input.oninput=(e)=>{ store[key]=e.target.value; saveProgressDebounced(); };
  f.appendChild(input);
  return f;
}
function formatMoney(n){ return (n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function formatDateBR(str){ if(!str) return '—'; const [y,m,d]=str.split('-'); if(!y||!m||!d) return str; return `${d}/${m}/${y}`; }

function getProfissional(id){ return state.profissionais.find(p=>p.id===id); }

// ============ IMPORTAÇÃO DE PDF DA FICHA DE ANAMNESE ============
function encontrarProfissionalPorNome(nome){
  if(!nome) return '';
  const alvo = nome.trim().toLowerCase();
  const achado = state.profissionais.find(p => p.nome.trim().toLowerCase() === alvo);
  return achado ? achado.id : '';
}

// ============ RENDER: PROFISSIONAIS ============
let novoProfissionalAberto = false;
let profissionalEmEdicao = null;
let novoRateioAberto = false;
let rateioEmEdicao = null;

function renderRateioForm(container, rateio, onSalvar, onCancelar){
  const form = el('div', { class:'card', style:'border-color:var(--blue-dark);' });
  form.appendChild(textField('Nome (ex: Clínica, Secretária Ana)', rateio, 'nome'));
  const pctField = el('div', { class:'field' });
  pctField.appendChild(el('label', {}, document.createTextNode('Percentual (%) sobre TODO valor recebido')));
  const pctInput = el('input', { type:'number', min:'0', max:'100', step:'0.1', value: rateio.percentual||'', placeholder:'Ex: 30' });
  pctInput.oninput = (e) => { rateio.percentual = e.target.value; };
  pctField.appendChild(pctInput);
  form.appendChild(pctField);

  const btnRow = el('div', { class:'row' });
  const salvarBtn = el('div', { class:'add-row-btn', style:'background:var(--blue-dark);color:#fff;border:none;flex:1;' }, document.createTextNode('Salvar'));
  salvarBtn.onclick = () => {
    if(!(rateio.nome||'').trim()){ alert('Informe um nome (ex: Clínica, Secretária).'); return; }
    onSalvar();
  };
  const cancelarBtn = el('div', { class:'add-row-btn', style:'flex:1;' }, document.createTextNode('Cancelar'));
  cancelarBtn.onclick = onCancelar;
  btnRow.appendChild(salvarBtn); btnRow.appendChild(cancelarBtn);
  form.appendChild(btnRow);
  container.appendChild(form);
}

function renderRateiosFixos(container){
  container.appendChild(el('div', { class:'section-title', style:'margin-top:26px;' }, document.createTextNode('Rateios fixos (Clínica, Secretária etc.)')));
  container.appendChild(el('p', { style:'font-size:12px;color:var(--muted);margin-top:-6px;margin-bottom:14px;' },
    document.createTextNode('Percentuais que saem de TODO valor recebido, além da comissão do profissional que atendeu — por exemplo, quanto a clínica retém e quanto uma secretária recebe por cada pagamento.')));

  if(novoRateioAberto){
    const novo = { id: uid(), nome:'', percentual:'' };
    renderRateioForm(container, novo,
      () => { state.rateiosFixos.push(novo); novoRateioAberto=false; saveProgress(); refreshPanel(); toast('Rateio adicionado!'); },
      () => { novoRateioAberto=false; refreshPanel(); }
    );
  } else {
    const addBtn = el('div', { class:'add-row-btn' }, document.createTextNode('+ Novo rateio fixo'));
    addBtn.onclick = () => { novoRateioAberto = true; refreshPanel(); };
    container.appendChild(addBtn);
  }

  if(!state.rateiosFixos.length && !novoRateioAberto){
    container.appendChild(el('div', { class:'empty-hint', style:'margin-top:14px;' }, document.createTextNode('Nenhum rateio fixo cadastrado ainda.')));
    return;
  }

  state.rateiosFixos.forEach(rateio => {
    if(rateioEmEdicao === rateio.id){
      renderRateioForm(container, rateio,
        () => { rateioEmEdicao=null; saveProgress(); refreshPanel(); toast('Rateio atualizado!'); },
        () => { rateioEmEdicao=null; refreshPanel(); }
      );
      return;
    }
    const card = el('div', { class:'card' });
    const top = el('div', { class:'card-top' });
    const info = el('div', {});
    info.appendChild(el('div', { class:'card-title' }, document.createTextNode(rateio.nome)));
    info.appendChild(el('div', { class:'card-sub' }, document.createTextNode('Rateio: '+(rateio.percentual||'0')+'% de todo valor recebido')));
    top.appendChild(info);
    const actions = el('div', { class:'card-actions' });
    const editIcon = el('span', { style:'color:var(--blue-dark);' }, document.createTextNode('✎ Editar'));
    editIcon.onclick = () => { rateioEmEdicao = rateio.id; refreshPanel(); };
    const delIcon = el('span', { style:'color:var(--red);' }, document.createTextNode('✕ Excluir'));
    delIcon.onclick = () => {
      if(confirm('Excluir o rateio "'+rateio.nome+'"?')){
        state.rateiosFixos = state.rateiosFixos.filter(r=>r.id!==rateio.id);
        saveProgress(); refreshPanel(); toast('Rateio excluído.');
      }
    };
    actions.appendChild(editIcon); actions.appendChild(delIcon);
    top.appendChild(actions);
    card.appendChild(top);
    container.appendChild(card);
  });
}

function renderProfissionalForm(container, prof, onSalvar, onCancelar){
  if(!prof.pagamento) prof.pagamento = { percentual: prof.comissaoPercent||'', diaria:'', fixo:'' };
  const form = el('div', { class:'card', style:'border-color:var(--blue-dark);' });
  form.appendChild(textField('Nome do profissional', prof, 'nome'));

  form.appendChild(el('div', { style:'font-weight:700;font-size:13px;color:var(--blue-dark);margin:14px 0 6px;' },
    document.createTextNode('Forma de pagamento')));
  form.appendChild(el('p', { style:'font-size:11.5px;color:var(--muted);margin-top:0;margin-bottom:10px;' },
    document.createTextNode('Marque quantas opções fizerem sentido — dá pra combinar (ex: diária + percentual).')));

  function linhaPagamento(label, campo, placeholder, prefixo){
    const linha = el('div', { style:'display:flex;align-items:center;gap:10px;margin-bottom:10px;' });
    const cb = el('input', { type:'checkbox' });
    cb.checked = !!(prof.pagamento[campo] && parseFloat(prof.pagamento[campo])>0);
    const valInput = el('input', { type:'number', min:'0', step:'0.01', value: prof.pagamento[campo]||'', placeholder,
      style:'flex:1;padding:9px;font-size:14px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;'+(cb.checked?'':'opacity:0.4;') });
    valInput.disabled = !cb.checked;
    cb.onchange = (e) => {
      valInput.disabled = !e.target.checked;
      valInput.style.opacity = e.target.checked ? '1' : '0.4';
      if(!e.target.checked) { prof.pagamento[campo] = ''; valInput.value=''; }
    };
    valInput.oninput = (e) => { prof.pagamento[campo] = e.target.value; };
    const labelEl = el('label', { style:'display:flex;align-items:center;gap:6px;width:110px;font-size:13px;font-weight:600;flex-shrink:0;' }, [cb, document.createTextNode(label)]);
    linha.appendChild(labelEl);
    if(prefixo) linha.appendChild(el('span', { style:'font-size:13px;color:var(--muted);' }, document.createTextNode(prefixo)));
    linha.appendChild(valInput);
    return linha;
  }

  form.appendChild(linhaPagamento('% Comissão', 'percentual', 'Ex: 40', null));
  form.appendChild(linhaPagamento('Diária', 'diaria', 'Ex: 150,00', 'R$'));
  form.appendChild(linhaPagamento('Fixo mensal', 'fixo', 'Ex: 2000,00', 'R$'));

  const btnRow = el('div', { class:'row', style:'margin-top:8px;' });
  const salvarBtn = el('div', { class:'add-row-btn', style:'background:var(--blue-dark);color:#fff;border:none;flex:1;' }, document.createTextNode('Salvar'));
  salvarBtn.onclick = () => {
    if(!(prof.nome||'').trim()){ alert('Informe o nome do profissional.'); return; }
    if(!parseFloat(prof.pagamento.percentual) && !parseFloat(prof.pagamento.diaria) && !parseFloat(prof.pagamento.fixo)){
      if(!confirm('Nenhuma forma de pagamento foi configurada. Salvar mesmo assim?')) return;
    }
    prof.comissaoPercent = prof.pagamento.percentual || ''; // mantém compatibilidade com relatórios antigos
    onSalvar();
  };
  const cancelarBtn = el('div', { class:'add-row-btn', style:'flex:1;' }, document.createTextNode('Cancelar'));
  cancelarBtn.onclick = onCancelar;
  btnRow.appendChild(salvarBtn); btnRow.appendChild(cancelarBtn);
  form.appendChild(btnRow);
  container.appendChild(form);
}

let profissionalExpandido = null;
let novoProfissionalFinAberto = false;

function renderProfissionais(container){
  container.appendChild(el('div', { class:'section-title' }, document.createTextNode('Profissionais e comissões')));

  const explicacao = el('div', { class:'card', style:'background:#F4F8FB;border-color:var(--blue-dark);margin-bottom:14px;' });
  explicacao.appendChild(el('div', { style:'font-weight:700;font-size:13px;color:var(--blue-dark);margin-bottom:6px;' },
    document.createTextNode('Como funcionam as comissões agora')));
  explicacao.appendChild(el('p', { style:'font-size:12.5px;color:var(--ink);margin:0;line-height:1.5;' }, document.createTextNode(
    'A comissão por venda é 100% MANUAL: nada é calculado sozinho. Quando você confirma o recebimento de uma parcela (aba "Parcelas e Recebimentos"), '+
    'você escolhe ali mesmo quais profissionais recebem comissão daquele pagamento específico e quanto cada um — pode dividir entre vários. O % configurado aqui '+
    'é só uma sugestão automática (botão 💡) na hora de preencher, pra agilizar; não é usado em nenhum cálculo por conta própria. '+
    'A diária continua contando sozinha, por dia com paciente confirmado na agenda, e o fixo mensal vence sempre no último dia do mês.'
  )));
  container.appendChild(explicacao);

  const novoBtn = el('div', { class:'add-row-btn', style:'margin-bottom:14px;' }, document.createTextNode('+ Novo profissional'));
  novoBtn.onclick = () => { novoProfissionalFinAberto = true; profissionalExpandido = null; refreshPanel(); };
  container.appendChild(novoBtn);

  if(novoProfissionalFinAberto){
    const novo = { id:'prof'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), nome:'', cor:'#1F5C8B', pagamento:{percentual:'',diaria:'',fixo:''} };
    renderCamposProfissionalFinanceiro(container, novo, async () => {
      state.profissionais.push(novo);
      await ClinicaStorage.save(CHAVE_PROFISSIONAIS_COMPARTILHADA, state.profissionais);
      novoProfissionalFinAberto = false;
      refreshPanel();
      toast('Profissional adicionado!');
    }, () => { novoProfissionalFinAberto = false; refreshPanel(); });
  }

  if(!state.profissionais.length && !novoProfissionalFinAberto){
    container.appendChild(el('div', { class:'empty-hint' }, document.createTextNode('Nenhum profissional cadastrado ainda.')));
    renderRateiosFixos(container);
    return;
  }

  state.profissionais.forEach(prof => {
    if(profissionalExpandido === prof.id){
      renderCamposProfissionalFinanceiro(container, prof, async () => {
        await ClinicaStorage.save(CHAVE_PROFISSIONAIS_COMPARTILHADA, state.profissionais);
        profissionalExpandido = null;
        refreshPanel();
        toast('Alterações salvas!');
      }, () => { profissionalExpandido = null; refreshPanel(); }, async () => {
        if(!confirm('Excluir "'+prof.nome+'"? Isso não apaga lançamentos já feitos, só o cadastro dele.')) return;
        state.profissionais = state.profissionais.filter(p => p.id !== prof.id);
        await ClinicaStorage.save(CHAVE_PROFISSIONAIS_COMPARTILHADA, state.profissionais);
        profissionalExpandido = null;
        refreshPanel();
        toast('Profissional excluído.');
      });
      return;
    }
    const card = el('div', { class:'card', style:'cursor:pointer;' });
    card.onclick = () => { profissionalExpandido = prof.id; novoProfissionalFinAberto = false; refreshPanel(); };
    const top = el('div', { class:'card-top' });
    const info = el('div', {});
    info.appendChild(el('div', { class:'card-title' }, [
      el('span', { style:'display:inline-block;width:11px;height:11px;border-radius:50%;background:'+(prof.cor||'#1F5C8B')+';margin-right:7px;' }),
      document.createTextNode(prof.nome)
    ]));
    const pg = prof.pagamento || { percentual: prof.comissaoPercent||'', diaria:'', fixo:'' };
    const partes = [];
    if((pg.percentual!==undefined && pg.percentual!=='')) partes.push(pg.percentual+'% comissão');
    if(parseFloat(pg.diaria)>0) partes.push('R$ '+formatMoney(parseFloat(pg.diaria))+'/diária');
    if(parseFloat(pg.fixo)>0) partes.push('R$ '+formatMoney(parseFloat(pg.fixo))+'/fixo mensal');
    info.appendChild(el('div', { class:'card-sub' }, document.createTextNode(partes.length ? partes.join(' + ') : 'Sem forma de pagamento configurada — toque pra configurar')));
    top.appendChild(info);
    top.appendChild(el('span', { style:'color:var(--muted);font-size:18px;' }, document.createTextNode('›')));
    card.appendChild(top);
    container.appendChild(card);
  });

  renderRateiosFixos(container);
}

// Formulário de edição de profissional, direto no Financeiro — escreve na mesma lista
// compartilhada usada no Perfil da Clínica e no Agendamento, então fica tudo sincronizado.
function renderCamposProfissionalFinanceiro(container, prof, onSalvar, onCancelar, onExcluir){
  if(!prof.pagamento) prof.pagamento = { percentual:'', diaria:'', fixo:'' };
  const form = el('div', { class:'card', style:'border-color:var(--blue-dark);margin-bottom:14px;' });

  const nomeField = el('div', { class:'field' });
  nomeField.appendChild(el('label', {}, document.createTextNode('Nome')));
  const nomeInput = el('input', { type:'text', value: prof.nome||'', placeholder:'Ex: Dra. Fernanda' });
  nomeInput.oninput = (e) => { prof.nome = e.target.value; };
  nomeField.appendChild(nomeInput);
  form.appendChild(nomeField);

  form.appendChild(el('div', { style:'font-weight:700;font-size:13px;color:var(--blue-dark);margin:14px 0 6px;' },
    document.createTextNode('Forma de pagamento')));
  form.appendChild(el('p', { style:'font-size:11.5px;color:var(--muted);margin-top:0;margin-bottom:10px;' },
    document.createTextNode('Pode combinar mais de uma (ex: diária + percentual).')));

  function linhaPagamento(label, campo, placeholder, prefixo){
    const linha = el('div', { style:'display:flex;align-items:center;gap:10px;margin-bottom:10px;' });
    const cb = el('input', { type:'checkbox' });
    cb.checked = prof.pagamento[campo] !== undefined && prof.pagamento[campo] !== '';
    const valInput = el('input', { type:'number', min:'0', step:'0.01', value: prof.pagamento[campo]||'', placeholder,
      style:'flex:1;padding:9px;font-size:14px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;'+(cb.checked?'':'opacity:0.4;') });
    valInput.disabled = !cb.checked;
    cb.onchange = (e) => {
      valInput.disabled = !e.target.checked;
      valInput.style.opacity = e.target.checked ? '1' : '0.4';
      if(!e.target.checked) { prof.pagamento[campo] = ''; valInput.value=''; }
      else if(!valInput.value){ prof.pagamento[campo] = '0'; valInput.value = '0'; }
    };
    valInput.oninput = (e) => { prof.pagamento[campo] = e.target.value; };
    const labelEl = el('label', { style:'display:flex;align-items:center;gap:6px;width:110px;font-size:13px;font-weight:600;flex-shrink:0;' }, [cb, document.createTextNode(label)]);
    linha.appendChild(labelEl);
    if(prefixo) linha.appendChild(el('span', { style:'font-size:13px;color:var(--muted);' }, document.createTextNode(prefixo)));
    linha.appendChild(valInput);
    return linha;
  }
  form.appendChild(linhaPagamento('% Comissão', 'percentual', 'Ex: 40', null));
  form.appendChild(linhaPagamento('Diária', 'diaria', 'Ex: 150,00', 'R$'));
  form.appendChild(linhaPagamento('Fixo mensal', 'fixo', 'Ex: 2000,00', 'R$'));

  const btnRow = el('div', { class:'row' });
  const salvarBtn = el('div', { class:'add-row-btn', style:'background:var(--blue-dark);color:#fff;border:none;flex:1;' }, document.createTextNode('Salvar'));
  salvarBtn.onclick = () => {
    if(!(prof.nome||'').trim()){ alert('Informe o nome.'); return; }
    onSalvar();
  };
  const cancelarBtn = el('div', { class:'add-row-btn', style:'flex:1;' }, document.createTextNode('Cancelar'));
  cancelarBtn.onclick = onCancelar;
  btnRow.appendChild(salvarBtn); btnRow.appendChild(cancelarBtn);
  form.appendChild(btnRow);

  if(onExcluir){
    const excluirBtn = el('div', { style:'text-align:center;margin-top:10px;font-size:12.5px;color:var(--red);cursor:pointer;text-decoration:underline;' },
      document.createTextNode('🗑 Excluir este profissional'));
    excluirBtn.onclick = onExcluir;
    form.appendChild(excluirBtn);
  }
  container.appendChild(form);
}

const MESES_ABREV = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

// Visão em planilha: uma linha por paciente, uma coluna por mês, mostrando quanto entrou
// (foi efetivamente pago) naquele mês — igual à planilha que a clínica já usava.
function renderPlanilhaLancamentos(container){
  const anoRow = el('div', { style:'display:flex;align-items:center;gap:10px;margin-bottom:12px;' });
  const anoPrevBtn = el('button', { style:'border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-family:inherit;' }, document.createTextNode('‹'));
  anoPrevBtn.onclick = () => { planilhaAno--; refreshPanel(); };
  const anoNextBtn = el('button', { style:'border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-family:inherit;' }, document.createTextNode('›'));
  anoNextBtn.onclick = () => { planilhaAno++; refreshPanel(); };
  anoRow.appendChild(anoPrevBtn);
  anoRow.appendChild(el('div', { style:'font-weight:700;font-size:15px;' }, document.createTextNode('Entradas — '+planilhaAno)));
  anoRow.appendChild(anoNextBtn);
  container.appendChild(anoRow);

  if(!state.lancamentos.length){
    container.appendChild(el('div', { class:'empty-hint' }, document.createTextNode('Nenhum lançamento cadastrado ainda.')));
    return;
  }

  // Quanto esse lançamento recebeu, de fato, em cada mês do ano selecionado
  function valoresPorMes(lanc){
    // Cada parcela conta no mês do VENCIMENTO dela, não no mês em que foi confirmada como paga
    // — assim um parcelamento em 6x, por exemplo, aparece dividido nos 6 meses certos, mesmo
    // que você acabe confirmando vários pagamentos atrasados de uma vez, no mesmo dia.
    // Parcela no cartão de crédito conta como "praticamente garantida" (verde) mesmo antes de
    // confirmar mês a mês — uma vez aprovado no cartão, a maquininha vai repassando sozinha,
    // diferente de dinheiro/pix/boleto, que dependem do paciente aparecer pra pagar de novo.
    const porMes = new Array(12).fill(null).map(()=>({ pago:0, previsto:0 }));
    (lanc.parcelas||[]).forEach(p => {
      if(!p.data) return;
      let ano, mes;
      const isoMatch = String(p.data).match(/^(\d{4})-(\d{2})-\d{2}$/);
      const brMatch = String(p.data).match(/^(\d{2})\/(\d{2})\/(\d{4})$/); // formato antigo, de registros de antes da correção
      if(isoMatch){ ano = parseInt(isoMatch[1],10); mes = parseInt(isoMatch[2],10); }
      else if(brMatch){ ano = parseInt(brMatch[3],10); mes = parseInt(brMatch[2],10); }
      else return;
      if(ano !== planilhaAno) return;
      const garantida = p.pago || p.forma === 'Cartão de crédito';
      if(garantida) porMes[mes-1].pago += p.valor;
      else porMes[mes-1].previsto += p.valor;
    });
    return porMes;
  }

  const tableWrap = el('div', { style:'overflow-x:auto;' });
  const table = el('table', { class:'fin-table', style:'font-size:12px;' });
  const theadRow = [el('th', {}, document.createTextNode('Paciente')), el('th', {}, document.createTextNode('Valor total')), el('th', {}, document.createTextNode('Forma de pgto'))];
  MESES_ABREV.forEach(m => theadRow.push(el('th', { style:'text-align:right;' }, document.createTextNode(m))));
  table.appendChild(el('thead', {}, el('tr', {}, theadRow)));

  const tbody = el('tbody', {});
  const totalPorMes = new Array(12).fill(null).map(()=>({ pago:0, previsto:0 }));

  state.lancamentos.forEach(lanc => {
    const porMes = valoresPorMes(lanc);
    const semDatas = (lanc.parcelas||[]).length && (lanc.parcelas||[]).every(p => !p.data);
    porMes.forEach((v,i) => { totalPorMes[i].pago += v.pago; totalPorMes[i].previsto += v.previsto; });
    const tr = el('tr', { class:'fin-table-row' });
    const tdNomeWrap = el('td', {});
    const tdNome = el('div', { style:'font-weight:600;cursor:pointer;color:var(--blue-dark);' }, document.createTextNode(lanc.paciente));
    tdNome.onclick = () => { visaoLancamentos='lista'; lancamentoExpandido=lanc.id; refreshPanel(); };
    tdNomeWrap.appendChild(tdNome);
    if(!lanc.parcelas || !lanc.parcelas.length){
      const avisoEl = el('div', { style:'font-size:10.5px;color:var(--red);cursor:pointer;' }, document.createTextNode('⚠ sem parcelas cadastradas — toque pra adicionar'));
      avisoEl.onclick = () => { visaoLancamentos='lista'; lancamentoExpandido=lanc.id; refreshPanel(); };
      tdNomeWrap.appendChild(avisoEl);
    } else if(semDatas){
      const avisoEl = el('div', { style:'font-size:10.5px;color:var(--red);cursor:pointer;' }, document.createTextNode('⚠ parcelas sem data de vencimento — toque pra corrigir'));
      avisoEl.onclick = () => { visaoLancamentos='lista'; lancamentoExpandido=lanc.id; refreshPanel(); };
      tdNomeWrap.appendChild(avisoEl);
    }
    tr.appendChild(tdNomeWrap);
    tr.appendChild(el('td', {}, document.createTextNode('R$ '+formatMoney(lanc.valorTotal))));

    const tdForma = el('td', {});
    const formaInput = el('input', { type:'text', value: lanc.formaResumo||'', placeholder:'ex: 6x cartão',
      style:'width:120px;font-size:11.5px;border:1px solid var(--line-light);border-radius:6px;padding:3px 6px;' });
    formaInput.oninput = (e) => { lanc.formaResumo = e.target.value; saveProgressDebounced(); };
    tdForma.appendChild(formaInput);
    tr.appendChild(tdForma);

    porMes.forEach(({pago, previsto}) => {
      const td = el('td', { style:'text-align:right;' });
      if(pago>0) td.appendChild(el('div', { style:'font-weight:700;color:var(--green);' }, document.createTextNode(formatMoney(pago))));
      if(previsto>0) td.appendChild(el('div', { style:'font-size:10.5px;color:var(--amber);'+(pago>0?'':'font-weight:600;') }, document.createTextNode(formatMoney(previsto)+(pago>0?'':' *'))));
      if(!pago && !previsto) td.appendChild(document.createTextNode('—'));
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  // Linha de totais, no rodapé
  const trTotal = el('tr', { style:'background:#F4F8FB;font-weight:700;' });
  trTotal.appendChild(el('td', {}, document.createTextNode('Total do mês')));
  trTotal.appendChild(el('td', {}));
  trTotal.appendChild(el('td', {}));
  totalPorMes.forEach(({pago, previsto}) => {
    const td = el('td', { style:'text-align:right;' });
    if(pago>0) td.appendChild(el('div', { style:'color:var(--green);' }, document.createTextNode('R$ '+formatMoney(pago))));
    if(previsto>0) td.appendChild(el('div', { style:'font-size:10.5px;color:var(--amber);' }, document.createTextNode('R$ '+formatMoney(previsto)+(pago>0?'':' *'))));
    if(!pago && !previsto) td.appendChild(document.createTextNode('—'));
    trTotal.appendChild(td);
  });
  tbody.appendChild(trTotal);

  table.appendChild(tbody);
  tableWrap.appendChild(table);
  container.appendChild(tableWrap);

  container.appendChild(el('p', { style:'font-size:11.5px;color:var(--muted);margin-top:10px;' },
    document.createTextNode('Cada parcela conta no mês do vencimento dela. Em verde: já pago, ou no cartão de crédito (considerado garantido assim que aprovado). Em laranja com *: vencimento naquele mês, ainda não pago (dinheiro, pix, boleto ou promissória). Toque no nome do paciente pra abrir os detalhes e editar parcelas, profissional ou comissão.')));
}


function renderLancamentoExpandido(container, lanc){
  const wrap = el('div', { style:'margin-top:10px;padding-top:10px;border-top:1.5px dashed var(--line-light);' });

  const temTratamentosDetalhados = lanc.tratamentos && lanc.tratamentos.length > 0;

  if(temTratamentosDetalhados){
    // ---- Um ou mais profissionais por tratamento (pode repetir o mesmo profissional em
    // tratamentos diferentes, e pode ter mais de um profissional no MESMO tratamento) ----
    wrap.appendChild(el('div', { style:'font-weight:700;font-size:12.5px;color:var(--blue-dark);margin-bottom:6px;' }, document.createTextNode('Tratamentos e profissionais')));
    lanc.tratamentos.forEach((t, ti) => {
      if(!t.id) t.id = 'trat'+ti+'_'+Date.now().toString(36); // garante um id estável pra cada item
      if(!t.profissionais) t.profissionais = [];
      const tCard = el('div', { style:'background:#F4F8FB;border-radius:10px;padding:10px 12px;margin-bottom:10px;' });
      tCard.appendChild(el('div', { style:'font-weight:600;font-size:13px;margin-bottom:8px;' },
        document.createTextNode((t.descricao||'Tratamento') + (t.valor ? (' — R$ '+formatMoney(t.valor)) : ''))));

      const listaProfsWrap = el('div', {});
      tCard.appendChild(listaProfsWrap);
      function renderProfsDoTratamento(){
        listaProfsWrap.innerHTML = '';
        t.profissionais.forEach((pAssoc, pi) => {
          const linha = el('div', { style:'display:flex;gap:8px;align-items:center;margin-bottom:6px;' });
          const selectProf = el('select', { style:'flex:1.6;padding:8px;font-size:12.5px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;' });
          selectProf.appendChild(el('option', { value:'' }, document.createTextNode('Selecione...')));
          state.profissionais.forEach(pr => {
            const opt = el('option', { value:pr.id }, document.createTextNode(pr.nome));
            if(pAssoc.profissionalId === pr.id) opt.setAttribute('selected','selected');
            selectProf.appendChild(opt);
          });
          selectProf.onchange = (e) => {
            pAssoc.profissionalId = e.target.value;
            const pr = state.profissionais.find(x=>x.id===e.target.value);
            pAssoc.profissionalNome = pr ? pr.nome : '';
            saveProgress();
          };
          linha.appendChild(selectProf);
          const pctInput = el('input', { type:'number', min:'0', max:'100', step:'0.1', value: pAssoc.percentual||'', placeholder:'%',
            style:'width:70px;padding:8px;font-size:12.5px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;' });
          pctInput.oninput = (e) => { pAssoc.percentual = e.target.value; saveProgressDebounced(); };
          linha.appendChild(pctInput);
          const removerBtn = el('span', { style:'cursor:pointer;color:var(--red);font-size:16px;padding:2px 4px;' }, document.createTextNode('✕'));
          removerBtn.onclick = () => { t.profissionais.splice(pi,1); renderProfsDoTratamento(); saveProgress(); };
          linha.appendChild(removerBtn);
          listaProfsWrap.appendChild(linha);
        });
      }
      renderProfsDoTratamento();

      const addProfBtn = el('div', { style:'font-size:12px;font-weight:700;color:var(--blue-dark);cursor:pointer;' },
        document.createTextNode('+ Adicionar profissional a este tratamento'));
      addProfBtn.onclick = () => { t.profissionais.push({ profissionalId:'', profissionalNome:'', percentual:'' }); renderProfsDoTratamento(); saveProgress(); };
      tCard.appendChild(addProfBtn);

      wrap.appendChild(tCard);
    });
  } else {
    // ---- Sem itens detalhados (lançamento manual, sem quebra por tratamento): um profissional
    // e uma % pro lançamento inteiro, do jeito mais simples ----
    wrap.appendChild(el('div', { style:'font-weight:700;font-size:12.5px;color:var(--blue-dark);margin-bottom:6px;' }, document.createTextNode('Profissional e comissão')));
    const profRow = el('div', { style:'display:flex;gap:8px;margin-bottom:12px;' });
    const profSelect = el('select', { style:'flex:1.6;padding:9px;font-size:13px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;' });
    profSelect.appendChild(el('option', { value:'' }, document.createTextNode('Não atribuído')));
    state.profissionais.forEach(pr => {
      const opt = el('option', { value:pr.id }, document.createTextNode(pr.nome));
      if(lanc.profissionalId===pr.id) opt.setAttribute('selected','selected');
      profSelect.appendChild(opt);
    });
    profSelect.onchange = (e) => { lanc.profissionalId = e.target.value; saveProgress(); };
    profRow.appendChild(profSelect);
    const pctInput = el('input', { type:'number', min:'0', max:'100', step:'0.1', value: lanc.profissionalPercentual||'', placeholder:'% comissão',
      style:'width:110px;padding:9px;font-size:13px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;' });
    pctInput.oninput = (e) => { lanc.profissionalPercentual = e.target.value; saveProgressDebounced(); };
    profRow.appendChild(pctInput);
    wrap.appendChild(profRow);
    if(lanc.profissionalNomeOriginal && !lanc.profissionalId){
      wrap.appendChild(el('p', { style:'font-size:11px;color:var(--muted);margin:-8px 0 12px;' },
        document.createTextNode('Sugerido pela ficha: "'+lanc.profissionalNomeOriginal+'" — cadastre-o ou selecione acima.')));
    }
  }

  wrap.appendChild(el('div', { style:'font-weight:700;font-size:12.5px;color:var(--blue-dark);margin:10px 0 6px;' }, document.createTextNode('Parcelas')));
  if(!lanc.parcelas.length){
    wrap.appendChild(el('div', { style:'font-size:12px;color:var(--muted);' }, document.createTextNode('Nenhuma parcela cadastrada.')));
  } else {
    const hojeISOParcela = new Date().toISOString().slice(0,10);
    const FORMAS_PAGAMENTO = ['', 'Cartão de crédito', 'Cartão de Débito', 'Pix', 'Dinheiro', 'Promissória', 'Boleto'];
    lanc.parcelas.forEach((p, pi) => {
      const atrasada = !p.pago && p.data && p.data < hojeISOParcela;
      const row = el('div', { class:'parcela-row'+(p.pago?' pago':''), style: atrasada ? 'border-color:var(--red);' : '' });
      const info = el('div', { class:'parcela-info', style:'flex:1;' });

      const linha1 = el('div', { style:'display:flex;gap:8px;align-items:center;flex-wrap:wrap;' });
      const valorInput = el('input', { type:'number', min:'0', step:'0.01', value: p.valor||0,
        style:'width:90px;font-size:13px;font-weight:700;border:1px solid var(--line-light);border-radius:6px;padding:4px 6px;' });

      dataVencInput.oninput = (e) => { p.data = e.target.value; saveProgressDebounced(); refreshPanel(); };

      info.appendChild(el('div', { style:'font-size:11.5px;font-weight:700;color:'+statusCor+';margin-top:4px;' }, document.createTextNode(statusLabel)));
      if(p.pago && p.dataRecebimento){

      } else {
        const toggle = el('div', { class:'parcela-toggle marcado' }, document.createTextNode('✓ Pago'));
        toggle.onclick = () => {
          if(!confirm('Desmarcar esse pagamento?')) return;
          p.pago = false; p.dataRecebimento = '';
          saveProgress(); refreshPanel();
        };
        acoesWrap.appendChild(toggle);
      }
      const removerParcelaBtn = el('span', { style:'font-size:11px;color:var(--red);cursor:pointer;text-decoration:underline;' }, document.createTextNode('Remover parcela'));
      removerParcelaBtn.onclick = () => {
        if(!confirm('Remover esta parcela de R$ '+formatMoney(p.valor)+'?')) return;
        lanc.parcelas.splice(pi,1);
        saveProgress(); refreshPanel();
      };
      acoesWrap.appendChild(removerParcelaBtn);
      row.appendChild(acoesWrap);
      wrap.appendChild(row);

      if(!p.pago && parcelaPagandoId === p.id){
        const miniForm = el('div', { style:'background:#F4F8FB;border-radius:8px;padding:10px;margin:-4px 0 10px;' });
        const dataPagoInput = el('input', { type:'date', value: hojeISOParcela });
        const btnConfirmar = el('div', { class:'add-row-btn', style:'margin-top:8px;background:var(--green);color:#fff;border:none;' }, document.createTextNode('Confirmar'));
        btnConfirmar.onclick = () => {
          p.pago = true;
          p.dataRecebimento = dataPagoInput.value || hojeISOParcela;
          parcelaPagandoId = null;
          saveProgress(); refreshPanel();
        };
        const lbl = el('label', {}, document.createTextNode('Data em que foi pago'));
        miniForm.appendChild(lbl); miniForm.appendChild(dataPagoInput); miniForm.appendChild(btnConfirmar);
        wrap.appendChild(miniForm);
      }
    });
  }

  const addParcelaBtn = el('div', { class:'add-row-btn', style:'margin-top:4px;' }, document.createTextNode('+ Adicionar parcela'));
  addParcelaBtn.onclick = () => {
    lanc.parcelas.push({ id: uid(), valor:0, data:'', forma:'', pago:false, dataRecebimento:'' });
    saveProgress(); refreshPanel();
  };
  wrap.appendChild(addParcelaBtn);

  container.appendChild(wrap);
}

let visaoLancamentos = 'lista'; // 'lista' | 'planilha'
let planilhaAno = new Date().getFullYear();
let filtroBuscaLancamento = '';

function renderLancamentos(container){
  container.appendChild(el('div', { class:'section-title' }, document.createTextNode('Lançamentos')));

  const toggleRow = el('div', { class:'filter-row', style:'margin-bottom:12px;' });
  [['lista','📋 Lista'],['planilha','📊 Planilha (por mês)']].forEach(([key,label]) => {
    const chip = el('div', { class:'filter-chip'+(visaoLancamentos===key?' selected':'') }, document.createTextNode(label));
    chip.onclick = () => { visaoLancamentos = key; refreshPanel(); };
    toggleRow.appendChild(chip);
  });
  container.appendChild(toggleRow);

  if(visaoLancamentos === 'planilha'){
    renderPlanilhaLancamentos(container);
    return;
  }

  if(novoLancamentoAberto){
    renderNovoLancamentoForm(container);
  } else {
    const addBtn = el('div', { class:'add-row-btn' }, document.createTextNode('+ Novo lançamento manual'));
    addBtn.onclick = () => { novoLancamentoAberto = true; refreshPanel(); };
    container.appendChild(addBtn);
  }

  if(!state.lancamentos.length){
    container.appendChild(el('div', { class:'empty-hint', style:'margin-top:14px;' }, document.createTextNode('Nenhum lançamento ainda. Importe um PDF ou crie um manualmente.')));
    return;
  }

  const buscaField = el('div', { class:'field', style:'margin-top:14px;' });
  buscaField.appendChild(el('label', {}, document.createTextNode('Buscar por paciente')));
  const buscaInput = el('input', { type:'text', value: filtroBuscaLancamento, placeholder:'Digite o nome do paciente...' });
  buscaInput.oninput = (e) => { filtroBuscaLancamento = e.target.value; refreshPanel(); };
  buscaField.appendChild(buscaInput);
  container.appendChild(buscaField);

  const termoBusca = filtroBuscaLancamento.trim().toLowerCase();
  const listaFiltrada = state.lancamentos.filter(l => !termoBusca || (l.paciente||'').toLowerCase().includes(termoBusca));

  if(!listaFiltrada.length){
    container.appendChild(el('div', { class:'empty-hint', style:'margin-top:14px;' }, document.createTextNode('Nenhum lançamento encontrado com esse nome.')));
    return;
  }

  const tableWrap = el('div', { style:'margin-top:12px;overflow-x:auto;' });
  const table = el('table', { class:'fin-table' });
  const thead = el('thead', {}, el('tr', {}, [
    el('th', {}, document.createTextNode('Paciente')),
    el('th', {}, document.createTextNode('Profissional')),
    el('th', {}, document.createTextNode('Valor total')),
    el('th', {}, document.createTextNode('Parcelas')),
    el('th', {}, document.createTextNode('Origem')),
    el('th', {}, document.createTextNode('')),
  ]));
  table.appendChild(thead);
  const tbody = el('tbody', {});

  listaFiltrada.forEach(lanc => {
    const pagas = lanc.parcelas.filter(p=>p.pago).length;
    const prof = getProfissional(lanc.profissionalId);
    const tr = el('tr', { class:'fin-table-row' });
    tr.onclick = () => { lancamentoExpandido = lancamentoExpandido===lanc.id ? null : lanc.id; refreshPanel(); };
    tr.appendChild(el('td', { style:'font-weight:600;' }, document.createTextNode(lanc.paciente)));
    tr.appendChild(el('td', {}, document.createTextNode(prof ? prof.nome : '— não atribuído')));
    tr.appendChild(el('td', {}, document.createTextNode('R$ '+formatMoney(lanc.valorTotal))));
    tr.appendChild(el('td', {}, document.createTextNode(pagas+'/'+lanc.parcelas.length+' pagas')));
    tr.appendChild(el('td', {}, el('span', { class:'badge origem' }, document.createTextNode(lanc.origem==='importado'?'Importado':'Manual'))));
    const tdAcoes = el('td', { style:'white-space:nowrap;text-align:right;' });
    const expandIcon = el('span', { style:'color:var(--blue-dark);padding:0 6px;' }, document.createTextNode(lancamentoExpandido===lanc.id?'▲':'▼'));
    const delIcon = el('span', { style:'color:var(--red);padding:0 6px;' }, document.createTextNode('✕'));
    delIcon.onclick = (e) => {
      e.stopPropagation();
      if(confirm('Excluir este lançamento e todas as suas parcelas?')){
        state.lancamentos = state.lancamentos.filter(l=>l.id!==lanc.id);
        saveProgress(); refreshPanel(); toast('Lançamento excluído.');
      }
    };
    tdAcoes.appendChild(expandIcon); tdAcoes.appendChild(delIcon);
    tr.appendChild(tdAcoes);
    tbody.appendChild(tr);

    if(lancamentoExpandido === lanc.id){
      const trDetalhe = el('tr', { class:'fin-table-detail-row' });
      const tdDetalhe = el('td', { colspan:'6' });
      const detalheWrap = el('div', { style:'padding:12px 4px;' });
      renderLancamentoExpandido(detalheWrap, lanc);
      tdDetalhe.appendChild(detalheWrap);
      trDetalhe.appendChild(tdDetalhe);
      tbody.appendChild(trDetalhe);
    }
  });
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  container.appendChild(tableWrap);
}

  const summary = el('div', { class:'summary-grid' });

  ]));
  summary.appendChild(el('div', { class:'summary-card' }, [
    el('div', { class:'summary-num green' }, document.createTextNode('R$ '+formatMoney(totalRecebido))),
    el('div', { class:'summary-label' }, document.createTextNode('Já recebido (todo o histórico)'))
  ]));
  summary.appendChild(el('div', { class:'summary-card' }, [
    el('div', { class:'summary-num amber' }, document.createTextNode('R$ '+formatMoney(totalPendente))),
    el('div', { class:'summary-label' }, document.createTextNode('Ainda falta receber'))

  container.appendChild(summary);

  const filterRow = el('div', { class:'filter-row' });

    const chip = el('div', { class:'filter-chip'+(filtroStatusParcela===key?' selected':'') }, document.createTextNode(label));
    chip.onclick = () => { filtroStatusParcela = key; refreshPanel(); };
    filterRow.appendChild(chip);
  });
  container.appendChild(filterRow);

  if(state.profissionais.length){
    const profField = el('div', { class:'field' });

    state.profissionais.forEach(p => {
      const opt = el('option', { value:p.id }, document.createTextNode(p.nome));
      if(filtroProfissionalParcela===p.id) opt.setAttribute('selected','selected');
      profSelect.appendChild(opt);
    });
    profSelect.onchange = (e) => { filtroProfissionalParcela = e.target.value; refreshPanel(); };
    profField.appendChild(profSelect);
    container.appendChild(profField);
  }

  let filtradas = todas;
  if(filtroStatusParcela==='pagas') filtradas = filtradas.filter(x=>x.parcela.pago);

  if(filtroProfissionalParcela) filtradas = filtradas.filter(x=>x.lancamento.profissionalId===filtroProfissionalParcela);
  filtradas.sort((a,b) => (a.parcela.data||'').localeCompare(b.parcela.data||''));

    info.appendChild(el('div', { class:'p-sub' }, document.createTextNode(
      [p.data?formatDateBR(p.data):'sem data', p.forma, prof?prof.nome:'sem profissional'].filter(Boolean).join(' • ')
      + (p.pago && p.dataRecebimento ? (' • Recebido em '+formatDateBR(p.dataRecebimento)+(p.horaRecebimento?(' às '+p.horaRecebimento):'')) : '')
      + (p.parcelamentoCartaoInfo ? (' • ' + p.parcelamentoCartaoInfo) : '')
    )));
    if(p.pago && (p.comissoes||[]).length){
      info.appendChild(el('div', { style:'font-size:11px;color:var(--green);margin-top:2px;' }, document.createTextNode(
        '💰 ' + p.comissoes.map(c => c.profissionalNome+': R$ '+formatMoney(c.valor)).join(' • ')
      )));

    if(p.pago){

      ajustarBtn.onclick = () => { parcelaAjustandoId = (parcelaAjustandoId===p.id) ? null : p.id; parcelaConfirmandoId = null; refreshPanel(); };
      row.appendChild(ajustarBtn);
    }
    listWrap.appendChild(row);

    if((p.historicoAjustes||[]).length){
      const histWrap = el('div', { style:'margin:-4px 0 8px;padding:8px 10px;background:#FFF8EC;border-radius:8px;font-size:11.5px;' });
      histWrap.appendChild(el('div', { style:'font-weight:700;margin-bottom:4px;' }, document.createTextNode('Ajustes feitos pelo administrador:')));
      p.historicoAjustes.forEach(h => {
        histWrap.appendChild(el('div', { style:'margin-bottom:3px;' }, document.createTextNode(
          '• ' + h.quem + ' em ' + new Date(h.quando).toLocaleString('pt-BR') + ': ' + h.resumo + ' — "' + h.justificativa + '"' +
          (h.afetaComissao ? ' (afetou a comissão)' : ' (não afetou a comissão)')
        )));
      });
      listWrap.appendChild(histWrap);
    }

    if(souAdminFinanceiro && parcelaAjustandoId === p.id){

      row1aj.appendChild(valorField);
      const dataFieldAj = el('div', { class:'field' });

      row1aj.appendChild(dataFieldAj);

      formaFieldAj.appendChild(el('label', {}, document.createTextNode('Nova forma de pagamento')));
      const formaSelectAj = el('select', {});
      ['', 'Cartão de crédito', 'Cartão de Débito', 'Pix', 'Dinheiro', 'Promissória', 'Boleto'].forEach(opt => {
        const optEl = el('option', { value: opt }, document.createTextNode(opt || 'Selecione...'));

        formaSelectAj.appendChild(optEl);

      formaSelectAj.onchange = (e) => { ajDados.forma = e.target.value; };
      formaFieldAj.appendChild(formaSelectAj);

      const justInput = el('input', { type:'text', placeholder:'Ex: desconto combinado com o paciente' });
      justInput.oninput = (e) => { ajDados.justificativa = e.target.value; };
      justField.appendChild(justInput);
      formAj.appendChild(justField);

      const comissaoAjLabel = el('div', { style:'font-weight:700;font-size:13px;color:var(--amber);margin:12px 0 2px;' },

      formAj.appendChild(comissaoAjLabel);
      const ajComissoes = (p.comissoes||[]).map(c=>Object.assign({},c));
      const listaComissoesAjWrap = el('div', {});
      formAj.appendChild(listaComissoesAjWrap);
      function renderListaComissoesAj(){
        listaComissoesAjWrap.innerHTML = '';

          const linha = el('div', { style:'display:flex;gap:8px;align-items:center;margin-bottom:8px;' });
