<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Financeiro — Zelo</title>
<script src="client-storage.js"></script>
<script src="clinic-branding.js"></script>
<script src="shared-data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" onerror="
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';
  document.head.appendChild(s);
"></script>
<style>
  :root{
    --blue-dark:#1F5C8B; --blue-med:#2E75B6; --blue-head:#D6E7F3; --blue-light:#EFF6FB;
    --line:#9BBBD4; --line-light:#C9DCEC; --ink:#1A1A1A; --muted:#5B6B7A;
    --green:#2E8B57; --red:#C0392B; --amber:#C98A1F; --bg:#F4F8FB;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:Arial, Helvetica, sans-serif; background:var(--bg); color:var(--ink); -webkit-tap-highlight-color:transparent;}
  header.topbar{
    background:#fff; border-bottom:3px solid var(--blue-dark); padding:14px 16px;
    display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:20;
  }
  header.topbar h1{font-size:18px; margin:0; color:var(--blue-dark); font-weight:700;}
  header.topbar p{margin:2px 0 0; font-size:12px; color:var(--muted); font-style:italic;}

  nav.steps{
    display:flex; overflow-x:auto; background:#fff; border-bottom:1px solid var(--line-light);
    position:sticky; top:62px; z-index:19; -webkit-overflow-scrolling:touch;
  }
  nav.steps button{
    flex:0 0 auto; padding:12px 16px; font-size:13px; font-weight:700; border:none; background:transparent;
    color:var(--muted); border-bottom:3px solid transparent; cursor:pointer; white-space:nowrap;
  }
  nav.steps button.active{color:var(--blue-dark); border-bottom-color:var(--blue-dark);}

  main{max-width:1600px; width:100%; box-sizing:border-box; margin:0 auto; padding:18px 14px 40px;}

  .section-title{
    background:var(--blue-dark); color:#fff; font-weight:700; font-size:14px; letter-spacing:.5px;
    padding:10px 14px; border-radius:6px; margin:18px 0 12px; text-transform:uppercase;
  }
  .section-title:first-child{margin-top:0;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; font-weight:700; margin-bottom:5px; color:var(--ink);}
  .field input[type=text], .field input[type=date], .field input[type=number], .field select{
    width:100%; padding:12px 10px; font-size:16px; border:1.5px solid var(--line); border-radius:8px;
    background:#fff; font-family:inherit;
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--blue-dark); box-shadow:0 0 0 3px var(--blue-head);}
  .row{display:flex; gap:10px; flex-wrap:wrap;}
  .row > .field{flex:1; min-width:130px;}

  .add-row-btn{
    margin-top:8px; padding:12px 14px; border:1.5px dashed var(--line); background:#fff; border-radius:8px;
    color:var(--blue-dark); font-weight:700; font-size:14px; cursor:pointer; text-align:center; position:relative; overflow:hidden;
  }
  .add-row-btn input[type=file]{position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer;}

  .card{background:#fff; border:1.5px solid var(--line-light); border-radius:10px; padding:14px; margin-bottom:12px;}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .card-title{font-size:15px; font-weight:700; color:var(--blue-dark);}
  .card-sub{font-size:12px; color:var(--muted); margin-top:2px;}
  .card-actions{display:flex; gap:14px; flex-shrink:0;}
  .card-actions span{cursor:pointer; font-size:13.5px; font-weight:700;}

  .badge{display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700;}
  .badge.pago{background:#E4F3EA; color:var(--green);}
  .badge.pendente{background:#FCF1DC; color:var(--amber);}
  .badge.origem{background:var(--blue-head); color:var(--blue-dark);}

  .empty-hint{text-align:center; padding:20px; color:var(--muted); font-size:13px; background:#fff; border:1.5px dashed var(--line-light); border-radius:10px;}

  table.tx-table{width:100%; border-collapse:collapse; margin-top:10px; font-size:13px;}
  table.tx-table th{background:var(--blue-head); color:var(--blue-dark); font-weight:700; padding:8px 6px; border:1px solid var(--line-light); text-align:left;}
  table.tx-table td{border:1px solid var(--line-light); padding:8px 6px;}
  table.tx-table tr:nth-child(even) td{background:var(--blue-light);}
  table.tx-table td.remove-cell{width:34px; text-align:center; cursor:pointer; color:var(--red); font-weight:900; font-size:15px;}

  .summary-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
  @media(min-width:520px){.summary-grid{grid-template-columns:repeat(3,1fr);}}
  .summary-card{background:#fff; border:1.5px solid var(--line-light); border-radius:10px; padding:12px; text-align:center;}
  .summary-num{font-size:20px; font-weight:700; color:var(--blue-dark);}
  .summary-num.green{color:var(--green);}
  .summary-num.amber{color:var(--amber);}
  .summary-label{font-size:10.5px; color:var(--muted); font-weight:700; text-transform:uppercase; margin-top:2px;}

  .filter-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .filter-chip{
    padding:8px 13px; border-radius:20px; border:1.5px solid var(--line); background:#fff;
    font-weight:700; font-size:12px; color:var(--muted); cursor:pointer; user-select:none;
  }
  .filter-chip.selected{background:var(--blue-dark); border-color:var(--blue-dark); color:#fff;}

  .fin-table{ width:100%; border-collapse:collapse; font-size:13px; background:#fff; border-radius:10px; overflow:hidden; }
  .fin-table thead th{
    text-align:left; padding:10px 12px; background:var(--bg,#F4F8FB); color:var(--muted);
    font-size:11px; text-transform:uppercase; letter-spacing:0.03em; font-weight:700;
    border-bottom:2px solid var(--line-light); white-space:nowrap;
  }
  .fin-table tbody td{ padding:10px 12px; border-bottom:1px solid var(--line-light); white-space:nowrap; }
  .fin-table-row{ cursor:pointer; transition:background .1s; }
  .fin-table-row:hover{ background:#F4F8FB; }
  .fin-table-detail-row td{ background:#FAFBFC; white-space:normal; }
  .fin-col-fixa{ position:sticky; background:#fff; z-index:1; }
  .fin-col-1{ left:0; min-width:140px; box-shadow:2px 0 4px rgba(0,0,0,0.04); }
  .fin-col-2{ left:140px; min-width:95px; }
  .fin-col-3{ left:235px; min-width:110px; }
  .fin-col-4{ left:345px; min-width:135px; box-shadow:2px 0 4px rgba(0,0,0,0.04); }
  thead .fin-col-fixa{ background:var(--bg,#F4F8FB); z-index:2; }
  .parcela-row{
    display:flex; align-items:flex-start; gap:8px; padding:10px; border:1.5px solid var(--line-light); border-radius:8px;
    margin-bottom:8px; background:#fff; flex-wrap:wrap;
  }
  .parcela-row.pago{background:#F3FBF6; border-color:var(--green);}
  .parcela-info{flex:1; font-size:12.5px;}
  .parcela-info .p-valor{font-weight:700; font-size:14px; color:var(--ink);}
  .parcela-info .p-sub{color:var(--muted); font-size:11.5px; margin-top:2px;}
  .parcela-toggle{
    padding:8px 12px; border-radius:8px; border:1.5px solid var(--green); background:#fff; color:var(--green);
    font-weight:700; font-size:11.5px; cursor:pointer; white-space:nowrap;
  }
  .parcela-toggle.marcado{background:var(--green); color:#fff;}

  .toast{
    position:fixed; top:70px; left:50%; transform:translateX(-50%) translateY(-20px);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:8px; font-size:13px;
    opacity:0; transition:all .25s; z-index:50; pointer-events:none; text-align:center; max-width:90%;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
<link rel="stylesheet" href="theme.css">
<script src="nav-home.js"></script>
</head>
<body>

<header class="topbar">
  <div>
    <h1>Controle de Pagamentos e Comissões</h1>
    <p>Alimentado pelas fichas de anamnese</p>
  </div>
</header>

<nav class="steps" id="stepsNav"></nav>

<main id="main"></main>

<div class="toast" id="toast"></div>

<script>
// ============ ESTADO ============
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

// Registra uma alteração manual no histórico do lançamento — quem fez, quando, e o que mudou.
// Usado em toda edição relevante (tratamentos, valor total, parcelas, forma de pagamento,
// status de pagamento), pra sempre ficar rastreável quem alterou o quê.
function registrarAlteracao(lanc, texto){
  if(!lanc.historicoAlteracoes) lanc.historicoAlteracoes = [];
  lanc.historicoAlteracoes.unshift({
    quem: (window._clinicaMe && window._clinicaMe.nome) || 'Usuário',
    quando: Date.now(),
    texto,
  });
}

const state = {
  profissionais: [], // {id, nome, comissaoPercent}
  rateiosFixos: [],  // {id, nome, percentual} — ex: "Clínica" 30%, "Secretária" 5% — aplicado sobre TODO valor recebido, além da comissão do profissional
  lancamentos: []    // {id, paciente, profissionalId, profissionalNomeOriginal, clinicaNome, dataContrato, valorTotal, tratamentos:[{descricao,valor}], parcelas:[{id,valor,data,forma,pago,dataRecebimento}], origem}
};

const STEPS = ['Lançamentos'];
let currentStep = 0;

// ============ PERSISTÊNCIA (servidor com reserva local) ============
const STORAGE_KEY = 'controle_pagamentos_comissoes_v1';
function saveProgress(){ ClinicaStorage.save(STORAGE_KEY, state); }
let _saveTimer=null;
function saveProgressDebounced(){ clearTimeout(_saveTimer); _saveTimer=setTimeout(saveProgress,400); }
async function loadProgress(){
  const saved = await ClinicaStorage.load(STORAGE_KEY);
  if(!saved) return false;
  Object.keys(state).forEach(k => { if(saved[k]!==undefined) state[k]=saved[k]; });
  return true;
}
function clearProgress(){ ClinicaStorage.save(STORAGE_KEY, null); try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} }

// A partir de agora, quem cadastra profissionais é o Perfil da Clínica (lista compartilhada,
// a mesma usada no Agendamento). Aqui, só migra dados antigos (se o Financeiro já tinha
// profissionais cadastrados por ele mesmo, antes dessa mudança) e depois só faz leitura.
const CHAVE_PROFISSIONAIS_COMPARTILHADA = 'clinica_profissionais_agenda_v1';
async function carregarProfissionaisCompartilhados(){
  let compartilhados = await ClinicaStorage.load(CHAVE_PROFISSIONAIS_COMPARTILHADA);
  if((!compartilhados || !compartilhados.length) && state.profissionais && state.profissionais.length){
    // Migração única: leva os profissionais (com forma de pagamento) que já existiam
    // localmente no Financeiro para o local compartilhado, preservando os IDs.
    compartilhados = state.profissionais;
    await ClinicaStorage.save(CHAVE_PROFISSIONAIS_COMPARTILHADA, compartilhados);
  }
  state.profissionais = compartilhados || [];
  state.profissionais.forEach(p => { if(!p.pagamento) p.pagamento = { percentual: p.comissaoPercent||'', diaria:'', fixo:'' }; });
}

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

// ============ HELPERS DE RENDER ============
function el(tag, attrs={}, children=[]){
  const e=document.createElement(tag);
  for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{ if(c) e.appendChild(c); });
  return e;
}
function textField(label, store, key, opts={}){
  const f=el('div',{class:'field'});
  f.appendChild(el('label',{},document.createTextNode(label)));
  const input=el('input',{type:opts.type||'text', value:store[key]||''});
  input.oninput=(e)=>{ store[key]=e.target.value; saveProgressDebounced(); };
  f.appendChild(input);
  return f;
}
function formatMoney(n){ return (n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function formatDateBR(str){ if(!str) return '—'; const [y,m,d]=str.split('-'); if(!y||!m||!d) return str; return `${d}/${m}/${y}`; }

function getProfissional(id){ return state.profissionais.find(p=>p.id===id); }

// ============ IMPORTAÇÃO DE PDF DA FICHA DE ANAMNESE ============
function encontrarProfissionalPorNome(nome){
  if(!nome) return '';
  const alvo = nome.trim().toLowerCase();
  const achado = state.profissionais.find(p => p.nome.trim().toLowerCase() === alvo);
  return achado ? achado.id : '';
}

// ============ RENDER: PROFISSIONAIS ============
let novoProfissionalAberto = false;
let profissionalEmEdicao = null;
let novoRateioAberto = false;
let rateioEmEdicao = null;

function renderRateioForm(container, rateio, onSalvar, onCancelar){
  const form = el('div', { class:'card', style:'border-color:var(--blue-dark);' });
  form.appendChild(textField('Nome (ex: Clínica, Secretária Ana)', rateio, 'nome'));
  const pctField = el('div', { class:'field' });
  pctField.appendChild(el('label', {}, document.createTextNode('Percentual (%) sobre TODO valor recebido')));
  const pctInput = el('input', { type:'number', min:'0', max:'100', step:'0.1', value: rateio.percentual||'', placeholder:'Ex: 30' });
  pctInput.oninput = (e) => { rateio.percentual = e.target.value; };
  pctField.appendChild(pctInput);
  form.appendChild(pctField);

  const btnRow = el('div', { class:'row' });
  const salvarBtn = el('div', { class:'add-row-btn', style:'background:var(--blue-dark);color:#fff;border:none;flex:1;' }, document.createTextNode('Salvar'));
  salvarBtn.onclick = () => {
    if(!(rateio.nome||'').trim()){ alert('Informe um nome (ex: Clínica, Secretária).'); return; }
    onSalvar();
  };
  const cancelarBtn = el('div', { class:'add-row-btn', style:'flex:1;' }, document.createTextNode('Cancelar'));
  cancelarBtn.onclick = onCancelar;
  btnRow.appendChild(salvarBtn); btnRow.appendChild(cancelarBtn);
  form.appendChild(btnRow);
  container.appendChild(form);
}

function renderRateiosFixos(container){
  container.appendChild(el('div', { class:'section-title', style:'margin-top:26px;' }, document.createTextNode('Rateios fixos (Clínica, Secretária etc.)')));
  container.appendChild(el('p', { style:'font-size:12px;color:var(--muted);margin-top:-6px;margin-bottom:14px;' },
    document.createTextNode('Percentuais que saem de TODO valor recebido, além da comissão do profissional que atendeu — por exemplo, quanto a clínica retém e quanto uma secretária recebe por cada pagamento.')));

  if(novoRateioAberto){
    const novo = { id: uid(), nome:'', percentual:'' };
    renderRateioForm(container, novo,
      () => { state.rateiosFixos.push(novo); novoRateioAberto=false; saveProgress(); refreshPanel(); toast('Rateio adicionado!'); },
      () => { novoRateioAberto=false; refreshPanel(); }
    );
  } else {
    const addBtn = el('div', { class:'add-row-btn' }, document.createTextNode('+ Novo rateio fixo'));
    addBtn.onclick = () => { novoRateioAberto = true; refreshPanel(); };
    container.appendChild(addBtn);
  }

  if(!state.rateiosFixos.length && !novoRateioAberto){
    container.appendChild(el('div', { class:'empty-hint', style:'margin-top:14px;' }, document.createTextNode('Nenhum rateio fixo cadastrado ainda.')));
    return;
  }

  state.rateiosFixos.forEach(rateio => {
    if(rateioEmEdicao === rateio.id){
      renderRateioForm(container, rateio,
        () => { rateioEmEdicao=null; saveProgress(); refreshPanel(); toast('Rateio atualizado!'); },
        () => { rateioEmEdicao=null; refreshPanel(); }
      );
      return;
    }
    const card = el('div', { class:'card' });
    const top = el('div', { class:'card-top' });
    const info = el('div', {});
    info.appendChild(el('div', { class:'card-title' }, document.createTextNode(rateio.nome)));
    info.appendChild(el('div', { class:'card-sub' }, document.createTextNode('Rateio: '+(rateio.percentual||'0')+'% de todo valor recebido')));
    top.appendChild(info);
    const actions = el('div', { class:'card-actions' });
    const editIcon = el('span', { style:'color:var(--blue-dark);' }, document.createTextNode('✎ Editar'));
    editIcon.onclick = () => { rateioEmEdicao = rateio.id; refreshPanel(); };
    const delIcon = el('span', { style:'color:var(--red);' }, document.createTextNode('✕ Excluir'));
    delIcon.onclick = () => {
      if(confirm('Excluir o rateio "'+rateio.nome+'"?')){
        state.rateiosFixos = state.rateiosFixos.filter(r=>r.id!==rateio.id);
        saveProgress(); refreshPanel(); toast('Rateio excluído.');
      }
    };
    actions.appendChild(editIcon); actions.appendChild(delIcon);
    top.appendChild(actions);
    card.appendChild(top);
    container.appendChild(card);
  });
}

function renderProfissionalForm(container, prof, onSalvar, onCancelar){
  if(!prof.pagamento) prof.pagamento = { percentual: prof.comissaoPercent||'', diaria:'', fixo:'' };
  const form = el('div', { class:'card', style:'border-color:var(--blue-dark);' });
  form.appendChild(textField('Nome do profissional', prof, 'nome'));

  form.appendChild(el('div', { style:'font-weight:700;font-size:13px;color:var(--blue-dark);margin:14px 0 6px;' },
    document.createTextNode('Forma de pagamento')));
  form.appendChild(el('p', { style:'font-size:11.5px;color:var(--muted);margin-top:0;margin-bottom:10px;' },
    document.createTextNode('Marque quantas opções fizerem sentido — dá pra combinar (ex: diária + percentual).')));

  function linhaPagamento(label, campo, placeholder, prefixo){
    const linha = el('div', { style:'display:flex;align-items:center;gap:10px;margin-bottom:10px;' });
    const cb = el('input', { type:'checkbox' });
    cb.checked = !!(prof.pagamento[campo] && parseFloat(prof.pagamento[campo])>0);
    const valInput = el('input', { type:'number', min:'0', step:'0.01', value: prof.pagamento[campo]||'', placeholder,
      style:'flex:1;padding:9px;font-size:14px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;'+(cb.checked?'':'opacity:0.4;') });
    valInput.disabled = !cb.checked;
    cb.onchange = (e) => {
      valInput.disabled = !e.target.checked;
      valInput.style.opacity = e.target.checked ? '1' : '0.4';
      if(!e.target.checked) { prof.pagamento[campo] = ''; valInput.value=''; }
    };
    valInput.oninput = (e) => { prof.pagamento[campo] = e.target.value; };
    const labelEl = el('label', { style:'display:flex;align-items:center;gap:6px;width:110px;font-size:13px;font-weight:600;flex-shrink:0;' }, [cb, document.createTextNode(label)]);
    linha.appendChild(labelEl);
    if(prefixo) linha.appendChild(el('span', { style:'font-size:13px;color:var(--muted);' }, document.createTextNode(prefixo)));
    linha.appendChild(valInput);
    return linha;
  }

  form.appendChild(linhaPagamento('% Comissão', 'percentual', 'Ex: 40', null));
  form.appendChild(linhaPagamento('Diária', 'diaria', 'Ex: 150,00', 'R$'));
  form.appendChild(linhaPagamento('Fixo mensal', 'fixo', 'Ex: 2000,00', 'R$'));

  const btnRow = el('div', { class:'row', style:'margin-top:8px;' });
  const salvarBtn = el('div', { class:'add-row-btn', style:'background:var(--blue-dark);color:#fff;border:none;flex:1;' }, document.createTextNode('Salvar'));
  salvarBtn.onclick = () => {
    if(!(prof.nome||'').trim()){ alert('Informe o nome do profissional.'); return; }
    if(!parseFloat(prof.pagamento.percentual) && !parseFloat(prof.pagamento.diaria) && !parseFloat(prof.pagamento.fixo)){
      if(!confirm('Nenhuma forma de pagamento foi configurada. Salvar mesmo assim?')) return;
    }
    prof.comissaoPercent = prof.pagamento.percentual || ''; // mantém compatibilidade com relatórios antigos
    onSalvar();
  };
  const cancelarBtn = el('div', { class:'add-row-btn', style:'flex:1;' }, document.createTextNode('Cancelar'));
  cancelarBtn.onclick = onCancelar;
  btnRow.appendChild(salvarBtn); btnRow.appendChild(cancelarBtn);
  form.appendChild(btnRow);
  container.appendChild(form);
}

let profissionalExpandido = null;
let novoProfissionalFinAberto = false;

function renderProfissionais(container){
  container.appendChild(el('div', { class:'section-title' }, document.createTextNode('Profissionais e comissões')));

  const explicacao = el('div', { class:'card', style:'background:#F4F8FB;border-color:var(--blue-dark);margin-bottom:14px;' });
  explicacao.appendChild(el('div', { style:'font-weight:700;font-size:13px;color:var(--blue-dark);margin-bottom:6px;' },
    document.createTextNode('Como funcionam as comissões agora')));
  explicacao.appendChild(el('p', { style:'font-size:12.5px;color:var(--ink);margin:0;line-height:1.5;' }, document.createTextNode(
    'A comissão por venda é 100% MANUAL: nada é calculado sozinho. Quando você confirma o recebimento de uma parcela (aba "Parcelas e Recebimentos"), '+
    'você escolhe ali mesmo quais profissionais recebem comissão daquele pagamento específico e quanto cada um — pode dividir entre vários. O % configurado aqui '+
    'é só uma sugestão automática (botão 💡) na hora de preencher, pra agilizar; não é usado em nenhum cálculo por conta própria. '+
    'A diária continua contando sozinha, por dia com paciente confirmado na agenda, e o fixo mensal vence sempre no último dia do mês.'
  )));
  container.appendChild(explicacao);

  const novoBtn = el('div', { class:'add-row-btn', style:'margin-bottom:14px;' }, document.createTextNode('+ Novo profissional'));
  novoBtn.onclick = () => { novoProfissionalFinAberto = true; profissionalExpandido = null; refreshPanel(); };
  container.appendChild(novoBtn);

  if(novoProfissionalFinAberto){
    const novo = { id:'prof'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), nome:'', cor:'#1F5C8B', pagamento:{percentual:'',diaria:'',fixo:''} };
    renderCamposProfissionalFinanceiro(container, novo, async () => {
      state.profissionais.push(novo);
      await ClinicaStorage.save(CHAVE_PROFISSIONAIS_COMPARTILHADA, state.profissionais);
      novoProfissionalFinAberto = false;
      refreshPanel();
      toast('Profissional adicionado!');
    }, () => { novoProfissionalFinAberto = false; refreshPanel(); });
  }

  if(!state.profissionais.length && !novoProfissionalFinAberto){
    container.appendChild(el('div', { class:'empty-hint' }, document.createTextNode('Nenhum profissional cadastrado ainda.')));
    renderRateiosFixos(container);
    return;
  }

  state.profissionais.forEach(prof => {
    if(profissionalExpandido === prof.id){
      renderCamposProfissionalFinanceiro(container, prof, async () => {
        await ClinicaStorage.save(CHAVE_PROFISSIONAIS_COMPARTILHADA, state.profissionais);
        profissionalExpandido = null;
        refreshPanel();
        toast('Alterações salvas!');
      }, () => { profissionalExpandido = null; refreshPanel(); }, async () => {
        if(!confirm('Excluir "'+prof.nome+'"? Isso não apaga lançamentos já feitos, só o cadastro dele.')) return;
        state.profissionais = state.profissionais.filter(p => p.id !== prof.id);
        await ClinicaStorage.save(CHAVE_PROFISSIONAIS_COMPARTILHADA, state.profissionais);
        profissionalExpandido = null;
        refreshPanel();
        toast('Profissional excluído.');
      });
      return;
    }
    const card = el('div', { class:'card', style:'cursor:pointer;' });
    card.onclick = () => { profissionalExpandido = prof.id; novoProfissionalFinAberto = false; refreshPanel(); };
    const top = el('div', { class:'card-top' });
    const info = el('div', {});
    info.appendChild(el('div', { class:'card-title' }, [
      el('span', { style:'display:inline-block;width:11px;height:11px;border-radius:50%;background:'+(prof.cor||'#1F5C8B')+';margin-right:7px;' }),
      document.createTextNode(prof.nome)
    ]));
    const pg = prof.pagamento || { percentual: prof.comissaoPercent||'', diaria:'', fixo:'' };
    const partes = [];
    if((pg.percentual!==undefined && pg.percentual!=='')) partes.push(pg.percentual+'% comissão');
    if(parseFloat(pg.diaria)>0) partes.push('R$ '+formatMoney(parseFloat(pg.diaria))+'/diária');
    if(parseFloat(pg.fixo)>0) partes.push('R$ '+formatMoney(parseFloat(pg.fixo))+'/fixo mensal');
    info.appendChild(el('div', { class:'card-sub' }, document.createTextNode(partes.length ? partes.join(' + ') : 'Sem forma de pagamento configurada — toque pra configurar')));
    top.appendChild(info);
    top.appendChild(el('span', { style:'color:var(--muted);font-size:18px;' }, document.createTextNode('›')));
    card.appendChild(top);
    container.appendChild(card);
  });

  renderRateiosFixos(container);
}

function renderCamposProfissionalFinanceiro(container, prof, onSalvar, onCancelar, onExcluir){

    document.createTextNode('Pode combinar mais de uma (ex: diária + percentual).')));

    const linha = el('div', { style:'display:flex;align-items:center;gap:10px;margin-bottom:10px;' });

    valInput.disabled = !cb.checked;
    cb.onchange = (e) => {
      valInput.disabled = !e.target.checked;
      valInput.style.opacity = e.target.checked ? '1' : '0.4';
      if(!e.target.checked) { prof.pagamento[campo] = ''; valInput.value=''; }
      else if(!valInput.value){ prof.pagamento[campo] = '0'; valInput.value = '0'; }
    };
    valInput.oninput = (e) => { prof.pagamento[campo] = e.target.value; };
    const labelEl = el('label', { style:'display:flex;align-items:center;gap:6px;width:110px;font-size:13px;font-weight:600;flex-shrink:0;' }, [cb, document.createTextNode(label)]);

    linha.appendChild(valInput);
    return linha;
  }
  form.appendChild(linhaPagamento('% Comissão', 'percentual', 'Ex: 40', null));
  form.appendChild(linhaPagamento('Diária', 'diaria', 'Ex: 150,00', 'R$'));
  form.appendChild(linhaPagamento('Fixo mensal', 'fixo', 'Ex: 2000,00', 'R$'));

  const btnRow = el('div', { class:'row' });
  const salvarBtn = el('div', { class:'add-row-btn', style:'background:var(--blue-dark);color:#fff;border:none;flex:1;' }, document.createTextNode('Salvar'));
  salvarBtn.onclick = () => {
    if(!(prof.nome||'').trim()){ alert('Informe o nome.'); return; }
    onSalvar();
  };
  const cancelarBtn = el('div', { class:'add-row-btn', style:'flex:1;' }, document.createTextNode('Cancelar'));
  cancelarBtn.onclick = onCancelar;
  btnRow.appendChild(salvarBtn); btnRow.appendChild(cancelarBtn);
  form.appendChild(btnRow);

  if(onExcluir){
    const excluirBtn = el('div', { style:'text-align:center;margin-top:10px;font-size:12.5px;color:var(--red);cursor:pointer;text-decoration:underline;' },
      document.createTextNode('🗑 Excluir este profissional'));
    excluirBtn.onclick = onExcluir;
    form.appendChild(excluirBtn);
  }
  container.appendChild(form);
}

const MESES_ABREV = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

// Visão em planilha: uma linha por paciente, uma coluna por mês, mostrando quanto entrou
// (foi efetivamente pago) naquele mês — igual à planilha que a clínica já usava.
let planilhaMesIni = null; // null = usa o padrão (mês atual, se for o ano corrente)
let planilhaMesFim = null; // null = até dezembro

// ===================== NOVA PLANILHA (projeto financeiro parte 1) =====================
// Cada lançamento pode virar mais de uma "linha" na planilha: por padrão todos os tratamentos
// do paciente ficam numa linha só (o profissional que fechou o contrato), mas se algum
// tratamento for atribuído a outro profissional, ele "desmembra" pra uma linha nova, logo
// abaixo, repetindo os dados do paciente — com seu próprio valor e suas próprias parcelas
// (uma fração proporcional das parcelas originais, recalculada automaticamente).
function getLinhasDaPlanilha(lanc){
  if(!lanc.linhasDerivadas) lanc.linhasDerivadas = [];
  const temTratamentos = lanc.tratamentos && lanc.tratamentos.length > 0;
  const idsNasDerivadas = new Set();
  lanc.linhasDerivadas.forEach(ld => (ld.tratamentoIds||[]).forEach(id => idsNasDerivadas.add(id)));

  const tratamentosPrincipais = temTratamentos ? lanc.tratamentos.filter(t => !idsNasDerivadas.has(t.id)) : [];
  const valorPrincipal = temTratamentos ? tratamentosPrincipais.reduce((s,t)=>s+(t.valor||0),0) : (lanc.valorTotal||0);

  const linhas = [{
    id: 'principal', lanc, isPrincipal: true,
    tratamentos: tratamentosPrincipais,
    valor: valorPrincipal,
    profissionalId: lanc.profissionalId || '',
    profissionalNome: (getProfissional(lanc.profissionalId)||{}).nome || lanc.profissionalNomeOriginal || '',
    forma: lanc.formaResumo || '',
    parcelas: lanc.parcelas || [],
  }];

  lanc.linhasDerivadas.forEach(ld => {
    const tratsDaLinha = temTratamentos ? lanc.tratamentos.filter(t => (ld.tratamentoIds||[]).includes(t.id)) : [];
    linhas.push({
      id: ld.id, lanc, isPrincipal: false, derivada: ld,
      tratamentos: tratsDaLinha,
      valor: tratsDaLinha.reduce((s,t)=>s+(t.valor||0),0),
      profissionalId: ld.profissionalId, profissionalNome: ld.profissionalNome,
      forma: ld.forma || lanc.formaResumo || '',
      parcelas: ld.parcelas || [],
    });
  });
  return linhas;
}

// Gera parcelas novas pra uma linha derivada, proporcionais ao valor dela, replicando as
// mesmas datas de vencimento e a mesma forma de pagamento das parcelas originais.
function gerarParcelasProporcionais(parcelasBase, fracao){
  return (parcelasBase||[]).map(p => ({
    id: uid(), valor: Math.round((p.valor||0) * fracao * 100)/100,
    data: p.data||'', forma: p.forma||'', pago:false, dataRecebimento:'', corManual:null,
  }));
}

let celulaValorAberta = null;   // lancId
let celulaFormaAberta = null;   // lancId+linhaId
let celulaProfAberta = null;    // lancId+linhaId
let celulaParcelaAberta = null; // lancId+linhaId+parcelaIdx
const FORMAS_PAGAMENTO_PLANILHA = ['Cartão de crédito', 'Cartão de Débito', 'Pix', 'Dinheiro', 'Promissória', 'Boleto'];

function renderPlanilhaLancamentos(container){
  if(!state.lancamentos.length){
    container.appendChild(el('div', { class:'empty-hint' }, document.createTextNode('Nenhum lançamento cadastrado ainda.')));
    return;
  }

  // Monta todas as linhas de todos os lançamentos.
  const todasLinhas = [];
  state.lancamentos.forEach(lanc => getLinhasDaPlanilha(lanc).forEach(linha => todasLinhas.push(linha)));

  // Descobre o intervalo de meses a mostrar como coluna: do mês mais antigo com parcela até o
  // mais recente, com uma margem de alguns meses pra trás e pra frente (pra dar espaço de
  // rolar e já ver os próximos meses vazios, prontos pra próximas parcelas).
  const hoje = new Date();
  let minData = new Date(hoje.getFullYear(), hoje.getMonth()-2, 1);
  let maxData = new Date(hoje.getFullYear(), hoje.getMonth()+6, 1);
  todasLinhas.forEach(l => (l.parcelas||[]).forEach(p => {
    if(!p.data) return;
    const m = String(p.data).match(/^(\d{4})-(\d{2})-\d{2}$/);
    if(!m) return;
    const d = new Date(parseInt(m[1],10), parseInt(m[2],10)-1, 1);
    if(d < minData) minData = d;
    if(d > maxData) maxData = d;
  }));
  const mesesColunas = [];
  let cursor = new Date(minData);
  while(cursor <= maxData){
    mesesColunas.push({ ano: cursor.getFullYear(), mes: cursor.getMonth()+1 });
    cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
  }
  const idxMesAtual = mesesColunas.findIndex(c => c.ano===hoje.getFullYear() && c.mes===hoje.getMonth()+1);

  const tableWrap = el('div', { style:'overflow-x:auto;', id:'planilhaScrollWrap' });
  const table = el('table', { class:'fin-table', style:'font-size:12px;' });
  const theadCells = [
    el('th', { class:'fin-col-fixa fin-col-1' }, document.createTextNode('Nome')),
    el('th', { class:'fin-col-fixa fin-col-2' }, document.createTextNode('Valor total')),
    el('th', { class:'fin-col-fixa fin-col-3' }, document.createTextNode('Forma de pgto')),
    el('th', { class:'fin-col-fixa fin-col-4' }, document.createTextNode('Profissional')),
  ];
  mesesColunas.forEach(c => theadCells.push(el('th', { style:'text-align:center;min-width:86px;' }, document.createTextNode(MESES_ABREV[c.mes-1]+'/'+String(c.ano).slice(2)))));
  table.appendChild(el('thead', {}, el('tr', {}, theadCells)));

  const tbody = el('tbody', {});

  todasLinhas.forEach(linha => {
    const lanc = linha.lanc;
    const tr = el('tr', { class:'fin-table-row' });

    // ---- Nome (só a linha principal mostra; derivadas repetem em cinza claro, indicando o mesmo paciente) ----
    const tdNome = el('td', { class:'fin-col-fixa fin-col-1', style: linha.isPrincipal ? 'font-weight:600;' : 'color:var(--muted);font-style:italic;' },
      document.createTextNode(lanc.paciente + (linha.isPrincipal ? '' : ' (tratamento à parte)')));
    tr.appendChild(tdNome);

    // ---- 1) Valor total do tratamento — clique abre a lista de tratamentos pra editar valores ----
    const tdValor = el('td', { class:'fin-col-fixa fin-col-2', style:'cursor:pointer;color:var(--blue-dark);font-weight:700;text-decoration:underline dotted;' },
      document.createTextNode('R$ '+formatMoney(linha.valor)));
    tdValor.onclick = () => { celulaValorAberta = (celulaValorAberta===lanc.id) ? null : lanc.id; celulaFormaAberta=null; celulaProfAberta=null; celulaParcelaAberta=null; refreshPanel(); };
    tr.appendChild(tdValor);

    // ---- 2) Forma de pagamento — clique abre as opções ----
    const chaveLinha = lanc.id+'|'+linha.id;
    const tdForma = el('td', { class:'fin-col-fixa fin-col-3', style:'cursor:pointer;color:var(--blue-dark);text-decoration:underline dotted;' },
      document.createTextNode(linha.forma || 'Definir...'));
    tdForma.onclick = () => { celulaFormaAberta = (celulaFormaAberta===chaveLinha) ? null : chaveLinha; celulaValorAberta=null; celulaProfAberta=null; celulaParcelaAberta=null; refreshPanel(); };
    tr.appendChild(tdForma);

    // ---- 3) Profissional executor — clique abre a redistribuição por tratamento ----
    const tdProf = el('td', { class:'fin-col-fixa fin-col-4', style:'cursor:pointer;color:var(--blue-dark);text-decoration:underline dotted;' },
      document.createTextNode(linha.profissionalNome || 'Definir...'));
    tdProf.onclick = () => { celulaProfAberta = (celulaProfAberta===chaveLinha) ? null : chaveLinha; celulaValorAberta=null; celulaFormaAberta=null; celulaParcelaAberta=null; refreshPanel(); };
    tr.appendChild(tdProf);

    // ---- 4) Parcelas — uma célula por mês (coluna), colorida, com o número da parcela dentro ----
    // Mapeia cada parcela dessa linha pro seu mês/ano de vencimento, guardando também a posição
    // sequencial dela (1ª, 2ª, 3ª...) dentro do plano de pagamento.
    const parcelaPorMes = {}; // chave "ano-mes" -> {parcela, indice}
    (linha.parcelas||[]).forEach((p, i) => {
      const m = p.data ? String(p.data).match(/^(\d{4})-(\d{2})-\d{2}$/) : null;
      if(m) parcelaPorMes[m[1]+'-'+m[2]] = { p, i };
    });
    let mostrouRoxo = false;
    mesesColunas.forEach(c => {
      const chaveMes = c.ano+'-'+String(c.mes).padStart(2,'0');
      const achado = parcelaPorMes[chaveMes];
      const td = el('td', { style:'text-align:center;padding:4px;' });
      if(!achado){
        if(!mostrouRoxo && (!linha.parcelas || !linha.parcelas.length) && linha.valor>0 && c.ano===hoje.getFullYear() && c.mes===hoje.getMonth()+1){
          // Ainda não foi dividido em parcelas — mostra o valor inteiro em roxo, sinalizando indefinição, no mês atual
          mostrouRoxo = true;
          const chip = el('div', { style:'background:#EDE7F6;color:#5E35B1;border-radius:6px;padding:5px 4px;font-weight:700;cursor:pointer;' },
            document.createTextNode('R$ '+formatMoney(linha.valor)));
          chip.onclick = () => { celulaParcelaAberta = (celulaParcelaAberta===(chaveLinha+'|0')) ? null : (chaveLinha+'|0'); celulaValorAberta=null; celulaFormaAberta=null; celulaProfAberta=null; refreshPanel(); };
          td.appendChild(chip);
        } else {
          td.appendChild(document.createTextNode('—'));
        }
        tr.appendChild(td);
        return;
      }
      const { p, i } = achado;
      const cor = p.corManual || (p.pago ? 'verde' : 'vermelho');
      const bg = cor==='verde' ? '#E8F5E9' : (cor==='vermelho' ? '#FFEBEE' : '#EDE7F6');
      const fg = cor==='verde' ? '#2E7D32' : (cor==='vermelho' ? '#C62828' : '#5E35B1');
      const chip = el('div', { style:'background:'+bg+';color:'+fg+';border-radius:6px;padding:5px 4px;font-weight:700;cursor:pointer;' }, [
        el('div', {}, document.createTextNode('R$ '+formatMoney(p.valor))),
        el('div', { style:'font-size:9.5px;font-weight:600;opacity:0.85;' }, document.createTextNode('Parcela '+(i+1))),
      ]);
      const chaveParcela = chaveLinha+'|'+i;
      chip.onclick = () => { celulaParcelaAberta = (celulaParcelaAberta===chaveParcela) ? null : chaveParcela; celulaValorAberta=null; celulaFormaAberta=null; celulaProfAberta=null; refreshPanel(); };
      td.appendChild(chip);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);

    // ---- Painéis abertos (aparecem numa linha logo abaixo, ocupando a largura toda) ----
    const totalColunas = 4 + mesesColunas.length;
    if(celulaValorAberta === lanc.id && linha.isPrincipal){
      tbody.appendChild(linhaPainel(totalColunas, renderPainelValorTotal(lanc)));
    }
    if(celulaFormaAberta === chaveLinha){
      tbody.appendChild(linhaPainel(totalColunas, renderPainelForma(lanc, linha)));
    }
    if(celulaProfAberta === chaveLinha){
      tbody.appendChild(linhaPainel(totalColunas, renderPainelProfissional(lanc, linha)));
    }
    const qtdParcelasLinha = Math.max((linha.parcelas||[]).length, 1);
    for(let i=0;i<qtdParcelasLinha;i++){
      if(celulaParcelaAberta === chaveLinha+'|'+i){
        tbody.appendChild(linhaPainel(totalColunas, renderPainelParcela(lanc, linha, i)));
      }
    }
  });

  table.appendChild(tbody);
  tableWrap.appendChild(table);
  container.appendChild(tableWrap);

  container.appendChild(el('p', { style:'font-size:11.5px;color:var(--muted);margin-top:10px;' },
    document.createTextNode('Verde: recebido. Vermelho: não recebido. Roxo: ainda sem definição de parcelas (mostra o valor cheio do tratamento). Toque em qualquer célula pra editar. Arraste a tabela pros lados pra ver outros meses.')));

  // Já abre a planilha rolada até o mês atual, em vez de começar lá em janeiro.
  if(idxMesAtual > 0){
    setTimeout(() => {
      const larguraColunaMes = 86;
      tableWrap.scrollLeft = Math.max(0, (idxMesAtual - 1) * larguraColunaMes);
    }, 30);
  }
}

// Cria uma <tr> que ocupa a largura toda da tabela, pra mostrar um painel de edição
// logo abaixo da linha que foi clicada.
function linhaPainel(totalColunas, conteudo){
  const tr = el('tr', {});
  const td = el('td', { colspan: String(totalColunas), style:'background:#FAFBFC;padding:12px;' });
  td.appendChild(conteudo);
  tr.appendChild(td);
  return tr;
}

// ---- Painel 3: reatribuir profissional por tratamento (clique na célula "Profissional executor") ----
function renderPainelProfissional(lanc, linha){
  const wrap = el('div', {});
  wrap.appendChild(el('div', { style:'font-weight:700;font-size:12.5px;margin-bottom:4px;' }, document.createTextNode('Redistribuir tratamentos entre profissionais')));
  wrap.appendChild(el('p', { style:'font-size:11px;color:var(--muted);margin:0 0 8px;' },
    document.createTextNode('Ao indicar um profissional diferente pra um tratamento específico, ele vira uma linha nova na planilha, com valor e parcelas próprias.')));

  const temTratamentos = linha.tratamentos && linha.tratamentos.length > 0;
  if(!temTratamentos){
    const selectUnico = el('select', { style:'padding:7px 8px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;' });
    selectUnico.appendChild(el('option', { value:'' }, document.createTextNode('Não atribuído')));
    state.profissionais.forEach(pr => {
      const opt = el('option', { value:pr.id }, document.createTextNode(pr.nome));
      if(lanc.profissionalId===pr.id) opt.setAttribute('selected','selected');
      selectUnico.appendChild(opt);
    });
    selectUnico.onchange = (e) => {
      const pr = state.profissionais.find(x=>x.id===e.target.value);
      registrarAlteracao(lanc, 'Profissional executor alterado de "'+(linha.profissionalNome||'—')+'" para "'+(pr?pr.nome:'—')+'"');
      lanc.profissionalId = e.target.value;
      saveProgress(); refreshPanel();
    };
    wrap.appendChild(selectUnico);
  } else {
    const tabela = el('table', { style:'width:100%;font-size:12px;border-collapse:collapse;' });
    tabela.appendChild(el('thead',{}, el('tr',{},[
      el('th', { style:'text-align:left;padding:4px;' }, document.createTextNode('Tratamento')),
      el('th', { style:'text-align:left;padding:4px;' }, document.createTextNode('Profissional avaliador')),
      el('th', { style:'text-align:left;padding:4px;' }, document.createTextNode('Profissional indicado')),
    ])));
    const tbodyT = el('tbody', {});
    linha.tratamentos.forEach(t => {
      const tr = el('tr', {});
      tr.appendChild(el('td', { style:'padding:4px;' }, document.createTextNode(t.descricao||'—')));
      const avaliadorNome = getProfissional(t.profissionalAvaliadorId || lanc.profissionalId);
      tr.appendChild(el('td', { style:'padding:4px;color:var(--muted);' }, document.createTextNode(avaliadorNome ? avaliadorNome.nome : '—')));
      const tdIndicado = el('td', { style:'padding:4px;' });
      const selectIndicado = el('select', { style:'padding:5px 6px;border:1.5px solid var(--line);border-radius:6px;font-family:inherit;width:100%;' });
      selectIndicado.appendChild(el('option', { value:'' }, document.createTextNode('Selecione...')));
      state.profissionais.forEach(pr => {
        const opt = el('option', { value:pr.id }, document.createTextNode(pr.nome));
        if(linha.profissionalId===pr.id) opt.setAttribute('selected','selected');
        selectIndicado.appendChild(opt);
      });
      selectIndicado.onchange = (e) => {
        const novoProfId = e.target.value;
        const pr = state.profissionais.find(x=>x.id===novoProfId);
        if(!t.profissionalAvaliadorId) t.profissionalAvaliadorId = lanc.profissionalId;
        if(novoProfId === linha.profissionalId) return; // nada mudou de fato

        if(novoProfId === lanc.profissionalId && !linha.isPrincipal){
          // Voltou pro profissional principal — remove da linha derivada
          linha.derivada.tratamentoIds = linha.derivada.tratamentoIds.filter(id=>id!==t.id);
          registrarAlteracao(lanc, 'Tratamento "'+(t.descricao||'—')+'" voltou pro profissional principal');
        } else {
          // Cria (ou reaproveita) uma linha derivada pro profissional novo
          if(!lanc.linhasDerivadas) lanc.linhasDerivadas = [];
          let destino = lanc.linhasDerivadas.find(ld => ld.profissionalId === novoProfId);
          if(!destino){
            const valorAntes = linha.tratamentos.reduce((s,x)=>s+(x.valor||0),0) || 1;
            const fracao = (t.valor||0) / valorAntes;
            destino = {
              id: uid(), profissionalId: novoProfId, profissionalNome: pr?pr.nome:'',
              tratamentoIds: [], forma: linha.forma,
              parcelas: gerarParcelasProporcionais(linha.parcelas, fracao),
            };
            lanc.linhasDerivadas.push(destino);
          }
          // Remove de onde estava antes (principal ou outra derivada) e coloca na nova
          if(!linha.isPrincipal) linha.derivada.tratamentoIds = linha.derivada.tratamentoIds.filter(id=>id!==t.id);
          if(!destino.tratamentoIds.includes(t.id)) destino.tratamentoIds.push(t.id);
          registrarAlteracao(lanc, 'Tratamento "'+(t.descricao||'—')+'" reatribuído para '+(pr?pr.nome:'—')+' (nova linha na planilha)');
        }
        saveProgress(); celulaProfAberta = null; refreshPanel();
      };
      tdIndicado.appendChild(selectIndicado);
      tr.appendChild(tdIndicado);
      tbodyT.appendChild(tr);
    });
    tabela.appendChild(tbodyT);
    wrap.appendChild(tabela);
  }
  const fecharBtn = el('div', { style:'margin-top:10px;font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline;' }, document.createTextNode('Fechar'));
  fecharBtn.onclick = () => { celulaProfAberta = null; refreshPanel(); };
  wrap.appendChild(fecharBtn);
  return wrap;
}

// ---- Painel 4: editar uma parcela específica (cor, valor, compensação em mês posterior) ----
function renderPainelParcela(lanc, linha, idx){
  const wrap = el('div', {});
  if(!linha.parcelas) linha.parcelas = linha.isPrincipal ? (lanc.parcelas = lanc.parcelas||[]) : (linha.derivada.parcelas = linha.derivada.parcelas||[]);
  // Se ainda não existe essa parcela (ex: veio do estado "roxo, tudo somado"), cria a primeira
  // parcela de verdade com o valor cheio, pronta pra ser dividida/ajustada.
  if(!linha.parcelas[idx]){
    while(linha.parcelas.length <= idx) linha.parcelas.push({ id: uid(), valor: idx===0?linha.valor:0, data:'', forma: linha.forma||'', pago:false, dataRecebimento:'', corManual:null });
  }
  const p = linha.parcelas[idx];

  wrap.appendChild(el('div', { style:'font-weight:700;font-size:12.5px;margin-bottom:8px;' }, document.createTextNode('Parcela '+(idx+1))));

  const row1 = el('div', { style:'display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap;' });
  const valorField = el('div', {});
  valorField.appendChild(el('label', { style:'display:block;font-size:11px;color:var(--muted);' }, document.createTextNode('Valor')));
  const valorInput = el('input', { type:'number', min:'0', step:'0.01', value: p.valor||0, style:'width:100px;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;' });
  valorInput.onchange = (e) => {
    const novo = parseFloat(e.target.value)||0;
    if(novo !== p.valor){
      registrarAlteracao(lanc, 'Valor da parcela '+(idx+1)+' alterado de R$ '+formatMoney(p.valor)+' para R$ '+formatMoney(novo));
      p.valor = novo; saveProgress(); refreshPanel();
    }
  };
  valorField.appendChild(valorInput);
  row1.appendChild(valorField);

  const dataField = el('div', {});
  dataField.appendChild(el('label', { style:'display:block;font-size:11px;color:var(--muted);' }, document.createTextNode('Vencimento')));
  const dataInput = el('input', { type:'date', value: p.data||'', style:'padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;' });
  dataInput.onchange = (e) => { p.data = e.target.value; saveProgress(); refreshPanel(); };
  dataField.appendChild(dataInput);
  row1.appendChild(dataField);
  wrap.appendChild(row1);

  wrap.appendChild(el('div', { style:'font-size:11px;color:var(--muted);margin-bottom:4px;' }, document.createTextNode('Cor')));
  const coresRow = el('div', { style:'display:flex;gap:8px;margin-bottom:12px;' });
  [['verde','✓ Recebido','#2E7D32','#E8F5E9'],['vermelho','Não recebido','#C62828','#FFEBEE'],[null,'Automático','var(--ink)','#fff']].forEach(([valor,label,fg,bg]) => {
    const chip = el('div', { style:'padding:6px 12px;border-radius:8px;cursor:pointer;font-size:11.5px;font-weight:700;border:1.5px solid '+fg+';color:'+fg+';background:'+bg+((p.corManual===valor)?';box-shadow:0 0 0 2px '+fg+';':'') }, document.createTextNode(label));
    chip.onclick = () => {
      registrarAlteracao(lanc, 'Cor da parcela '+(idx+1)+' definida manualmente como "'+label+'"');
      p.corManual = valor;
      if(valor==='verde') p.pago = true; if(valor==='vermelho') p.pago = false;
      saveProgress(); refreshPanel();
    };
    coresRow.appendChild(chip);
  });
  wrap.appendChild(coresRow);

  // Compensar diferença numa parcela posterior
  const compWrap = el('div', { style:'padding-top:10px;border-top:1px solid var(--line-light);' });
  compWrap.appendChild(el('div', { style:'font-size:11px;color:var(--muted);margin-bottom:6px;' },
    document.createTextNode('Paciente pagou a menos? Compensa a diferença somando numa parcela mais pra frente:')));
  const compRow = el('div', { style:'display:flex;gap:8px;align-items:center;flex-wrap:wrap;' });
  const compValorInput = el('input', { type:'number', step:'0.01', placeholder:'Valor a compensar', style:'width:130px;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;' });
  compRow.appendChild(compValorInput);
  const compParcelaSelect = el('select', { style:'padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;' });
  linha.parcelas.forEach((pp,ppi) => { if(ppi>idx) compParcelaSelect.appendChild(el('option', { value:ppi }, document.createTextNode('Parcela '+(ppi+1)))); });
  if(!compParcelaSelect.children.length) compParcelaSelect.appendChild(el('option', { value:'' }, document.createTextNode('(crie uma parcela posterior primeiro)')));
  compRow.appendChild(compParcelaSelect);
  const compBtn = el('div', { class:'add-row-btn', style:'padding:6px 14px;' }, document.createTextNode('Adicionar'));
  compBtn.onclick = () => {
    const valorComp = parseFloat(compValorInput.value)||0;
    const destIdx = parseInt(compParcelaSelect.value,10);
    if(!valorComp || isNaN(destIdx)){ alert('Preencha o valor e escolha a parcela de destino.'); return; }
    linha.parcelas[destIdx].valor = (linha.parcelas[destIdx].valor||0) + valorComp;
    registrarAlteracao(lanc, 'Compensação de R$ '+formatMoney(valorComp)+' da parcela '+(idx+1)+' somada na parcela '+(destIdx+1));
    saveProgress(); refreshPanel();
  };
  compRow.appendChild(compBtn);
  compWrap.appendChild(compRow);
  wrap.appendChild(compWrap);

  const fecharBtn = el('div', { style:'margin-top:10px;font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline;' }, document.createTextNode('Fechar'));
  fecharBtn.onclick = () => { celulaParcelaAberta = null; refreshPanel(); };
  wrap.appendChild(fecharBtn);
  return wrap;
}
