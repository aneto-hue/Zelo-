<style>

    --blue-dark:#1F5C8B;
    --blue-med:#2E75B6;
    --blue-head:#D6E7F3;
    --blue-light:#EFF6FB;
    --line:#9BBBD4;
    --line-light:#C9DCEC;
    --ink:#1A1A1A;
    --muted:#5B6B7A;
    --green:#2E8B57;
    --red:#C0392B;
    --amber:#C98A1F;
    --bg:#F4F8FB;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  header.topbar{
    background:#fff;
    border-bottom:3px solid var(--blue-dark);
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:14px;
    position:sticky;
    top:0;
    z-index:20;
  }
  .logo-box{
    width:56px;height:56px;border:1.5px dashed var(--line);
    border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-size:9px;color:#9BAAB8;text-align:center;line-height:1.1;flex-shrink:0;
  }
  header.topbar h1{font-size:18px;margin:0;color:var(--blue-dark);font-weight:700;}
  header.topbar p{margin:2px 0 0;font-size:12px;color:var(--muted);font-style:italic;}

  nav.steps{
    display:flex;
    overflow-x:auto;
    background:#fff;
    border-bottom:1px solid var(--line-light);
    position:sticky;
    top:86px;
    z-index:19;
    -webkit-overflow-scrolling:touch;
  }
  nav.steps button{
    flex:0 0 auto;
    padding:12px 16px;
    font-size:13px;
    font-weight:700;
    border:none;
    background:transparent;
    color:var(--muted);
    border-bottom:3px solid transparent;
    cursor:pointer;
    white-space:nowrap;
  }
  nav.steps button.active{
    color:var(--blue-dark);
    border-bottom-color:var(--blue-dark);
  }

  main{
    max-width:1600px; width:100%; box-sizing:border-box; margin:0 auto;
    padding:18px 14px 100px;
  }
  .panel{display:none;}
  .panel.active{display:block;}

  .section-title{
    background:var(--blue-dark);
    color:#fff;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.5px;
    padding:10px 14px;
    border-radius:6px;
    margin:18px 0 12px;
    text-transform:uppercase;
  }
  .section-title:first-child{margin-top:0;}

  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:5px;
    color:var(--ink);
  }
  .field input[type=text], .field input[type=date], .field textarea{
    width:100%;
    padding:12px 10px;
    font-size:16px;
    border:1.5px solid var(--line);
    border-radius:8px;
    background:#fff;
    font-family:inherit;
  }
  .field input:focus, .field textarea:focus{
    outline:none;
    border-color:var(--blue-dark);
    box-shadow:0 0 0 3px var(--blue-head);
  }
  .row{display:flex; gap:10px; flex-wrap:wrap;}
  .row > .field{flex:1; min-width:140px;}

  .q-card{
    background:#fff;
    border:1.5px solid var(--line-light);
    border-radius:10px;
    padding:14px;
    margin-bottom:12px;
  }
  .q-text{font-size:15px; font-weight:600; margin-bottom:10px; display:block;}
  .q-text .hint{font-weight:400; font-style:italic; color:var(--muted); font-size:13px;}

  .yn-group{display:flex; gap:10px; margin-bottom:8px;}
  .yn-btn{
    flex:1;
    max-width:120px;
    padding:11px 0;
    text-align:center;
    border:1.5px solid var(--line);
    border-radius:8px;
    background:#fff;
    font-size:14px;
    font-weight:700;
    color:var(--muted);
    cursor:pointer;
    user-select:none;
  }
  .yn-btn.sim.selected{background:var(--green); border-color:var(--green); color:#fff;}
  .yn-btn.nao.selected{background:#888; border-color:#888; color:#fff;}

  .sub-field{margin-top:8px;}
  .sub-field input[type=text]{
    width:100%;
    padding:9px 8px;
    font-size:14px;
    border:1px solid var(--line-light);
    border-radius:6px;
    font-family:inherit;

  .sub-field label{font-size:12px; color:var(--muted); font-style:italic; display:block; margin-bottom:4px;}

  .disease-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:8px;
    margin-bottom:14px;

    padding:20px;

    position:fixed; top:96px; left:50%; transform:translateX(-50%) translateY(-20px);

    opacity:0; transition:all .25s; z-index:50; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

<script>
// ============ DATA MODEL ============
const state = {
  clinic: { nome:'', dentista:'', cro:'', endereco:'', cidade:'', telefone:'', email:'', cnpj:'', logo:'' },
  patient: { nome:'', nasc:'', sexo:'', idade:'', rg:'', cpf:'', telefone:'', email:'', endereco:'', obs:'', responsavel:'', respCpf:'', foto:'' },
  general: {}, // question key -> 'sim'|'nao', plus text subfields
  diseases: {}, // disease name -> bool
  oral: {},
  dentist: { obs:'' },
  outrosTratamentos: [], // [{descricao:'', valor:''}]
  declare: { eu:'', cpf:'', data:'', dr:'', cro:'' },
  teeth: {}, // kept for backward compat loading old saves
  toothData: {}, // toothNumber -> { status:0-3, situacao:'', tratamento:'', valor:'' }
  payInfo: { total:'', forma:'', vencimento:'', parcelas:'' },
  payRows: [ ['', '', ''] ],
  contract: { autorizaImagem:'', dataContrato:'', npEmissao:'', npVencimento:'', textoPersonalizado:'' },
  images: { clinicas: [], radiografias: [] },
  historicoOrcamentos: [], // [{id, dataGeracao, itens:[{dente,situacao,tratamento,valor}], outros:[{descricao,valor}], total}]
  financeiroLancamentoId: '' // id do lançamento já criado automaticamente no Financeiro (evita duplicar ao gerar o PDF de novo)

// Chaves do state que pertencem à FICHA de um paciente específico (tudo, exceto "clinic",
// que agora é compartilhado por todas as fichas). Usado para separar o que é salvo em
// cada lugar, e para "zerar" a ficha ao abrir/criar uma nova.
const FICHA_KEYS = Object.keys(state).filter(k => k !== 'clinic');
const FICHA_TEMPLATE_VAZIA = JSON.parse(JSON.stringify(
  FICHA_KEYS.reduce((acc,k) => { acc[k] = state[k]; return acc; }, {})
));

const GENERAL_QUESTIONS = [
  { key:'dornosdentes', text:'Sente alguma dor nos dentes ou boca?', sub:[{key:'ondedoi', label:'Onde? (qual dente ou região)'}] },
  { key:'tratamento', text:'Está ou esteve recentemente em tratamento médico?', sub:[{key:'motivo', label:'Por qual motivo?'}] },
  { key:'remedio', text:'Está tomando algum remédio?', sub:[{key:'quais', label:'Quais?'}] },
  { key:'gravida', text:'Está grávida?', sub:[{key:'mes', label:'Qual mês?'}] },
  { key:'alergiamed', text:'Já teve reação alérgica a algum medicamento?', sub:[{key:'qualalergia', label:'Qual(is)?'}] },
  { key:'alergiaanest', text:'Já teve reação alérgica à anestesia?' },
  { key:'sangrar', text:'Quando se machuca costuma sangrar muito?' },
  { key:'cicatrizar', text:'Demora a cicatrizar?' },
  { key:'tontura', text:'Costuma sentir tonturas ou desmaios?' },
];
const GENERAL_QUESTIONS_2 = [
  { key:'marcapasso', text:'Usa marca-passo ou válvula cardíaca?' },
  { key:'trombose', text:'Já teve trombose?' },
  { key:'fuma', text:'Fuma?' },
  { key:'alcool', text:'Toma bebida alcoólica frequentemente?' },
];
const DISEASES = ['Pressão alta','Problemas cardíacos','Diabetes','Problema nos rins','Tuberculose','Artrite','Asma / Bronquite','Hepatite','Anemia','Problemas nervosos','Depressão','Epilepsia','Problemas respiratórios','Febre reumática','Convulsão','Reumatismo','Sífilis','HIV'];

const ORAL_QUESTIONS = [
  { key:'gengiva', text:'Suas gengivas sangram facilmente?', sub:[{key:'escova', label:'Usa escova? / Usa fio dental?'}] },
  { key:'sensiveis', text:'Tem dentes sensíveis?', sub:[{key:'sensmotivo', label:'Devido ao frio / Ao quente'}] },
  { key:'range', text:'Range os dentes?', sub:[{key:'mordelabio', label:'Morde os lábios?'}] },
  { key:'dificuldade', text:'Ao abrir a boca sente dificuldade, dor ou ruído?' },
  { key:'respira', text:'Respira bem pelo nariz?', alertOn:'nao', sub:[{key:'dorouvido', label:'Dor no ouvido ou na face?'}] },
  { key:'outroproblema', text:'Existe algum outro problema de saúde geral ou bucal que não foi perguntado e você deseja relatar?', sub:[{key:'qualoutro', label:'Qual?'}] },
];

let currentStep = 0;
let modoAtual = 'lista'; // 'lista' = lista de pacientes | 'ficha' = editando a ficha de um paciente
let fichaAtivaPacienteId = null;
const STEPS = ['Questionário de Saúde','Imagens','Odontograma','Contrato e Pagamento'];

// ============ IMAGE HELPERS ============
// Fixes EXIF rotation issues from phone cameras (photos that look correct in
// the browser preview but appear sideways when drawn raw into the PDF), and
// normalizes the output to a reasonable size/format for storage + PDF embedding.
function loadFixedImageDataURL(file, callback){
  const maxDim = 1400; // cap resolution to keep state/localStorage small

  function fromBitmap(bitmap){
    const canvas = document.createElement('canvas');
    let w = bitmap.width, h = bitmap.height;
    if(w > maxDim || h > maxDim){
      const scale = maxDim / Math.max(w, h);
      w = Math.round(w * scale);
      h = Math.round(h * scale);
    }
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(bitmap, 0, 0, w, h);
    callback(canvas.toDataURL('image/jpeg', 0.9));
  }

  if(window.createImageBitmap){
    createImageBitmap(file, { imageOrientation: 'from-image' })
      .then(fromBitmap)
      .catch(() => fallbackViaImageEl());
  } else {
    fallbackViaImageEl();
  }

  function fallbackViaImageEl(){
    // Older browsers: createImageBitmap unsupported. EXIF orientation may not
    // be auto-corrected here, but this keeps the app working everywhere.
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.naturalWidth, h = img.naturalHeight;
        if(w > maxDim || h > maxDim){
          const scale = maxDim / Math.max(w, h);
          w = Math.round(w * scale);
          h = Math.round(h * scale);
        }
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        callback(canvas.toDataURL('image/jpeg', 0.9));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
}

// ============ RENDER HELPERS ============
function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k === 'class') e.className = attrs[k];
    else if(k === 'html') e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children)?children:[children]).forEach(c => { if(c) e.appendChild(c); });
  return e;
}

function yesNoBlock(store, q){
  const card = el('div', { class:'q-card' });
  card.appendChild(el('span', { class:'q-text' }, document.createTextNode(q.text)));
  const grp = el('div', { class:'yn-group' });
  const simBtn = el('div', { class:'yn-btn sim' + (store[q.key]==='sim'?' selected':'') }, document.createTextNode('Sim'));
  const naoBtn = el('div', { class:'yn-btn nao' + (store[q.key]==='nao'?' selected':'') }, document.createTextNode('Não'));
  simBtn.onclick = () => { store[q.key] = store[q.key]==='sim'?'':'sim'; refreshPanel(); };
  naoBtn.onclick = () => { store[q.key] = store[q.key]==='nao'?'':'nao'; refreshPanel(); };
  grp.appendChild(simBtn); grp.appendChild(naoBtn);
  card.appendChild(grp);
  if(q.sub){
    q.sub.forEach(s => {
      const wrap = el('div', { class:'sub-field' });
      wrap.appendChild(el('label', {}, document.createTextNode(s.label)));
      const input = el('input', { type:'text', value: store[s.key]||'' });
      input.oninput = (e) => { store[s.key] = e.target.value; saveProgressDebounced(); };
      wrap.appendChild(comDitado(input));
      card.appendChild(wrap);
    });
  } else if(store[q.key] === 'sim'){
    const noteKey = q.key + '_obs';
    const wrap = el('div', { class:'sub-field' });
    wrap.appendChild(el('label', {}, document.createTextNode('Observações')));
    const input = el('input', { type:'text', value: store[noteKey]||'' });
    input.oninput = (e) => { store[noteKey] = e.target.value; saveProgressDebounced(); };
    wrap.appendChild(comDitado(input));
    card.appendChild(wrap);
  }
  return card;
}

function maskCPF(v){
  v = v.replace(/\D/g,'').slice(0,11);
  v = v.replace(/(\d{3})(\d)/,'$1.$2');
  v = v.replace(/(\d{3})(\d)/,'$1.$2');
  v = v.replace(/(\d{3})(\d{1,2})$/,'$1-$2');
  return v;
}
function maskTelefone(v){
  v = v.replace(/\D/g,'').slice(0,11);
  if(v.length > 10) v = v.replace(/(\d{2})(\d{5})(\d{0,4})/,'($1) $2-$3');
  else if(v.length > 5) v = v.replace(/(\d{2})(\d{4})(\d{0,4})/,'($1) $2-$3');
  else if(v.length > 2) v = v.replace(/(\d{2})(\d{0,5})/,'($1) $2');
  else if(v.length > 0) v = v.replace(/(\d{0,2})/,'($1');
  return v.trim();
}
function maskRG(v){
  let letraFinal = '';
  if(/[Xx]$/.test(v.replace(/[^\dXx]/g,''))){
    const limpoComX = v.replace(/[^\dXx]/g,'').slice(0,9);
    if(/[Xx]$/.test(limpoComX)){ letraFinal = 'X'; v = limpoComX.slice(0,-1); }
  }
  v = v.replace(/\D/g,'').slice(0,9);
  v = v.replace(/(\d{2})(\d)/,'$1.$2');
  v = v.replace(/(\d{3})(\d)/,'$1.$2');
  v = v.replace(/(\d{3})(\d{1,2})$/,'$1-$2');
  if(letraFinal) v = (v.endsWith('-') ? v : v + '-') + letraFinal;
  return v;
}
// Detecta automaticamente qual máscara aplicar, pelo nome do campo (cpf/rg/telefone)
function mascaraParaCampo(key){
  const k = key.toLowerCase();
  if(k==='cpf') return maskCPF;
  if(k==='rg') return maskRG;
  if(k.includes('telefone') || k==='whatsapp' || k==='celular') return maskTelefone;
  return null;
}

function textField(label, store, key, opts={}){
  const f = el('div', { class:'field' });
  f.appendChild(el('label', {}, document.createTextNode(label)));
  const mascara = opts.mask===false ? null : mascaraParaCampo(key);
  const attrsInput = { type: opts.type||'text', value: store[key]||'' };
  if(mascara) attrsInput.inputmode = 'numeric';
  const input = el('input', attrsInput);
  input.oninput = (e) => {
    if(mascara){ e.target.value = mascara(e.target.value); }
    store[key] = e.target.value;
    saveProgressDebounced();
  };
  f.appendChild((opts.type && opts.type !== 'text') ? input : comDitado(input));
  return f;
}

// ============ IMPORTAR DADOS A PARTIR DE PDF (gerado pela ficha de preenchimento externa) ============
const PDF_DATA_TAG = 'FICHA_ANAMNESE_DATA:';
function encodePdfData(obj){
  try{
    const json = JSON.stringify(obj);
    return btoa(unescape(encodeURIComponent(json))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }catch(e){ return null; }
}
function decodePdfData(code){
  try{
    let b64 = String(code).trim().replace(/-/g,'+').replace(/_/g,'/');
    while(b64.length % 4) b64 += '=';
    return JSON.parse(decodeURIComponent(escape(atob(b64))));
  }catch(e){ return null; }
}
function extractDataFromPDFBytes(bytes){
  // jsPDF grava metadados (Keywords) como texto simples no PDF (sem compressão),
  // então dá para extrair direto dos bytes, sem precisar de nenhuma biblioteca extra.
  let raw = '';
  const chunk = 0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    raw += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  }
  const m = raw.match(/\/Keywords\s*\(([^)]*)\)/);
  if(!m) return null;
  const kwIdx = m[1].indexOf(PDF_DATA_TAG);
  if(kwIdx === -1) return null;
  const codeMatch = m[1].slice(kwIdx + PDF_DATA_TAG.length).match(/[A-Za-z0-9_-]+/);
  if(!codeMatch) return null;
  return decodePdfData(codeMatch[0]);
}
function importDataFromPDFFile(kind, file, targetLabel){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const bytes = new Uint8Array(reader.result);
      const incoming = extractDataFromPDFBytes(bytes);
      if(!incoming || typeof incoming !== 'object'){
        alert('Não foi possível encontrar dados neste PDF. Confirme se ele foi gerado pela ficha de preenchimento de "' + targetLabel + '".');
        return;
      }
      const target = state[kind];
      Object.keys(target).forEach(k => {
        if(incoming[k] !== undefined && incoming[k] !== ''){ target[k] = incoming[k]; }
      });
      refreshPanel();
      toast('Dados de "' + targetLabel + '" importados com sucesso!');
    }catch(err){
      alert('Não foi possível ler este PDF. Verifique se o arquivo não está corrompido.');
    }
  };
  reader.readAsArrayBuffer(file);
}
function importDataFromPDFFileMulti(kinds, file, targetLabel){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const bytes = new Uint8Array(reader.result);
      const incoming = extractDataFromPDFBytes(bytes);
      if(!incoming || typeof incoming !== 'object'){
        alert('Não foi possível encontrar dados neste PDF. Confirme se ele foi gerado pela ficha de preenchimento de "' + targetLabel + '".');
        return;
      }
      kinds.forEach(kind => {
        const part = incoming[kind];
        if(!part || typeof part !== 'object') return;
        const target = state[kind];
        Object.keys(part).forEach(k => {
          if(part[k] !== undefined && part[k] !== ''){ target[k] = part[k]; }
        });
      });
      refreshPanel();
      toast('Dados de "' + targetLabel + '" importados com sucesso!');
    }catch(err){
      alert('Não foi possível ler este PDF. Verifique se o arquivo não está corrompido.');
    }
  };
  reader.readAsArrayBuffer(file);
}

function novoTratamentoId(){ return 'tt'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function td(n){
  let entry = state.toothData[n];
  if(!entry){
    entry = state.toothData[n] = { status:0, tratamentos:[] };
    return entry;
  }
  // Migra fichas antigas (um único tratamento gravado direto no objeto do dente)
  // para o novo formato de lista, sem perder nada que já estava preenchido.
  if(!Array.isArray(entry.tratamentos)){
    const tinhaConteudo = entry.situacao || entry.tratamento || entry.valor;
    const antigo = {
      id: novoTratamentoId(),
      situacao: entry.situacao||'', tratamento: entry.tratamento||'', valor: entry.valor||'',
      procedimentoId: entry.procedimentoId||'', estoqueBaixado: entry.estoqueBaixado||''
    };
    entry.tratamentos = tinhaConteudo ? [antigo] : [];
    delete entry.situacao; delete entry.tratamento; delete entry.valor;
    delete entry.procedimentoId; delete entry.estoqueBaixado;
  }
  return entry;
}

let estoqueCache = { produtos: [], procedimentos: [] };

async function carregarEstoqueCache(){
  const dados = await ClinicaStorage.load('controle_estoque_progresso_v1');
  estoqueCache.produtos = (dados && dados.produtos) || [];
  estoqueCache.procedimentos = (dados && dados.procedimentos) || [];
}

// Dá baixa no estoque dos materiais de um procedimento (grava movimentações de saída direto
// nos dados do módulo Estoque, na mesma clínica). Não bloqueia mesmo se o estoque ficar negativo
// (mesmo comportamento do módulo Estoque, que só avisa, não impede).
async function baixarEstoqueProcedimento(proc, contexto){
  if(!proc || !proc.materiais || !proc.materiais.length) return;
  const dados = await ClinicaStorage.load('controle_estoque_progresso_v1') || { produtos:[], movimentacoes:[], procedimentos:[] };
  if(!Array.isArray(dados.movimentacoes)) dados.movimentacoes = [];
  const hoje = new Date();
  const hojeStr = hoje.getFullYear()+'-'+String(hoje.getMonth()+1).padStart(2,'0')+'-'+String(hoje.getDate()).padStart(2,'0');
  proc.materiais.forEach(m => {
    dados.movimentacoes.unshift({
      id: 'idmov'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
      produtoId: m.produtoId,
      tipo: 'saida',
      quantidade: parseFloat(m.quantidade)||0,
      data: hojeStr,
      motivo: 'Uso em procedimento: ' + proc.nome + (contexto ? (' — ' + contexto) : '')
    });
  });
  ClinicaStorage.save('controle_estoque_progresso_v1', dados);
}
let refreshPaymentDisplay = null;

function buildOdontoSVG(){
  const cell=36, gap=2, gapMid=12;
  const decCell=28, decGap=2, decGapMid=8;
  const totalW = 16*(cell+gap)+gapMid+20;

  // Layout vertical:
  // y=14: arcada superior permanente (h=cell=36), label abaixo: 14+36+11=61
  // y=68: arcada inferior permanente (h=36), label acima: 68-4=64
  // y=126: linha separadora + label DECÍDUOS (y=138)
  // y=146: arcada superior decídua (h=28), label abaixo: 146+28+11=185
  // y=188: arcada inferior decídua (h=28), label acima: 188-4=184
  // totalH: 188+28+14 = 230
  const totalH = 232;
  let svg=`<svg viewBox="0 0 ${totalW} ${totalH}" width="100%" style="max-width:720px;display:block;margin:0 auto;">`;

  svg+=`<text x="${totalW/2}" y="10" text-anchor="middle" font-size="9" fill="#9BAAB8" font-family="Arial" font-weight="700">SUPERIOR</text>`;
  svg+=`<text x="${totalW/2}" y="116" text-anchor="middle" font-size="9" fill="#9BAAB8" font-family="Arial" font-weight="700">INFERIOR</text>`;

  const midX = 10 + 8*(cell+gap) + gapMid/2;
  svg+=`<line x1="${midX}" y1="12" x2="${midX}" y2="118" stroke="#DDD" stroke-width="1" stroke-dasharray="4,3"/>`;

  svg+=`<line x1="10" y1="123" x2="${totalW-10}" y2="123" stroke="#DDD" stroke-width="1" stroke-dasharray="5,3"/>`;
  svg+=`<text x="${totalW/2}" y="134" text-anchor="middle" font-size="9" fill="#B8860B" font-family="Arial" font-weight="700">DECÍDUOS</text>`;

  const decMidX = totalW/2;
  svg+=`<line x1="${decMidX}" y1="136" x2="${decMidX}" y2="${totalH-4}" stroke="#E8D5A0" stroke-width="1" stroke-dasharray="4,3"/>`;

  const allUpper=[...UPPER_RIGHT,...UPPER_LEFT];
  const allLower=[...LOWER_RIGHT,...LOWER_LEFT];
  const decUpper=[...DEC_UPPER_RIGHT,...DEC_UPPER_LEFT];
  const decLower=[...DEC_LOWER_RIGHT,...DEC_LOWER_LEFT];

  function drawRow(numbers, rowY, isUpper, isDeciduous){
    const c = isDeciduous ? decCell : cell;
    const g2 = isDeciduous ? decGap : gap;
    const gm = isDeciduous ? decGapMid : gapMid;
    const perSide = numbers.length / 2;
    const rowW = perSide*(c+g2)*2 + gm;
    const startX = isDeciduous ? Math.round((totalW - rowW)/2) : 10;

    numbers.forEach((n,i)=>{
      const x = startX + i*(c+g2) + (i>=perSide?gm:0);
      const tData = td(n);
      const fill = TOOTH_COLORS[tData.status||0];
      const fillActual = tData.status===0 && isDeciduous ? '#FFFDE7' : fill;
      const strokeActual = tData.status>0 ? TOOTH_STROKES[tData.status] : (isDeciduous?'#B8860B':'#9BBBD4');
      const isSel = selectedTooth==n;
      const hasNote = tData.status!==3 && !!(tData.tratamentos && tData.tratamentos.some(t=>t.situacao||t.tratamento||t.valor));
      const absent = tData.status===3;

      svg+=`<g class="tooth-g" data-tooth="${n}" style="cursor:pointer">`;
      if(absent){
        svg+=`<rect x="${x}" y="${rowY}" width="${c}" height="${c}" rx="4" fill="#EEE" stroke="#AAA" stroke-width="1.2" stroke-dasharray="4,2"/>`;
        svg+=`<line x1="${x+4}" y1="${rowY+4}" x2="${x+c-4}" y2="${rowY+c-4}" stroke="#AAA" stroke-width="1.5"/>`;
        svg+=`<line x1="${x+c-4}" y1="${rowY+4}" x2="${x+4}" y2="${rowY+c-4}" stroke="#AAA" stroke-width="1.5"/>`;
      } else {
        svg+=`<rect x="${x}" y="${rowY}" width="${c}" height="${c}" rx="4" fill="${fillActual}" stroke="${strokeActual}" stroke-width="${isSel?2.5:1.5}"/>`;
        const fs = isDeciduous ? 9 : 10;
        svg+=`<text x="${x+c/2}" y="${rowY+c/2+Math.round(fs/3)+1}" font-size="${fs}" text-anchor="middle" font-family="Arial" fill="${strokeActual}" font-weight="700">${n}</text>`;
      }
      if(isSel) svg+=`<rect x="${x-2}" y="${rowY-2}" width="${c+4}" height="${c+4}" rx="6" fill="none" stroke="#F39C12" stroke-width="2.5"/>`;
      if(hasNote) svg+=`<circle cx="${x+c-3}" cy="${rowY+3}" r="3.5" fill="#F39C12"/>`;
      svg+=`</g>`;
    });
  }

  drawRow(allUpper, 14, true, false);
  drawRow(allLower, 68, false, false);
  drawRow(decUpper, 140, true, true);
  drawRow(decLower, 188, false, true);

  svg+=`</svg>`;
  return svg;
}

function formatCurrencyMask(value){
  // Mantém apenas os dígitos digitados
  let digits = String(value).replace(/\D/g,'');
  if(!digits) return '';
  // Remove zeros à esquerda excedentes, mas garante ao menos 3 dígitos (centavos + 1 inteiro)
  digits = digits.replace(/^0+(?=\d)/,'');
  while(digits.length < 3) digits = '0' + digits;
  const cents = digits.slice(-2);
  let intPart = digits.slice(0, -2).replace(/^0+(?=\d)/,'');
  intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return 'R$ ' + intPart + ',' + cents;
}

function openToothModal(container, n){
  // Remove qualquer modal existente
  const existing = document.getElementById('tooth-modal-overlay');
  if(existing) existing.remove();

  const tData = td(n);
  const statusNames = ['Sem alteração','Problema','Tratado','Ausente'];
  const colors = [
    ['#F4F8FB','#1F5C8B'],
    ['#FADADD','#C0392B'],
    ['#B9D6EC','#1F5C8B'],
    ['#E8E8E8','#888888']
  ];

  function rebuild(){
    const existing2 = document.getElementById('tooth-modal-overlay');
    if(existing2) existing2.remove();
    openToothModal(container, n);
  }

  function fecharModalDente(){
    (tData.tratamentos||[]).forEach(t => {
      if(t.procedimentoId && t.estoqueBaixado !== t.procedimentoId){
        const proc = estoqueCache.procedimentos.find(p => p.id === t.procedimentoId);
        if(proc){
          baixarEstoqueProcedimento(proc, 'Dente '+n+(state.patient.nome?(' — '+state.patient.nome):''));
          t.estoqueBaixado = t.procedimentoId;
          toast('Estoque baixado para "'+proc.nome+'"!');
        }
      }
    });
    overlay.remove(); selectedTooth=null; renderSVGOnly(container); syncTotalToPayInfo(); saveProgressDebounced();
    if(refreshOdontoTable) refreshOdontoTable();
    if(refreshPaymentDisplay) refreshPaymentDisplay();
  }

  const overlay = el('div', { class:'tooth-modal-overlay' });
  overlay.id = 'tooth-modal-overlay';
  overlay.onclick = (e) => { if(e.target===overlay){ fecharModalDente(); } };

  const modal = el('div', { class:'tooth-modal' });

  // Cabeçalho
  const hdr = el('div', { class:'modal-hdr' });
  hdr.appendChild(el('div', { class:'modal-title' }, document.createTextNode('Dente ' + n)));
  const closeBtn = el('span', { class:'modal-close' }, document.createTextNode('✕'));
  closeBtn.onclick = () => { fecharModalDente(); };
  hdr.appendChild(closeBtn);
  modal.appendChild(hdr);

  // Botões de status
  const statusRow = el('div', { class:'status-btns' });
  [0,1,2,3].forEach(s=>{
    const active = tData.status===s;
    const btn = el('div', { class:'status-btn',
      style:`border-color:${active?colors[s][1]:'var(--line-light)'};background:${active?colors[s][0]:'#fff'};color:${active?colors[s][1]:'var(--muted)'};`
    }, document.createTextNode(statusNames[s]));
    btn.onclick = () => { tData.status=s; saveProgressDebounced(); rebuild(); };
    statusRow.appendChild(btn);
  });
  modal.appendChild(statusRow);

  // Lista de procedimentos deste dente (pode ter mais de um) — exceto quando o dente está Ausente (3)
  if(tData.status !== 3){
    if(!tData.tratamentos.length) tData.tratamentos.push({ id: novoTratamentoId(), situacao:'', tratamento:'', valor:'', procedimentoId:'', estoqueBaixado:'' });

    modal.appendChild(el('div', { style:'font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:14px 0 8px;' },
      document.createTextNode('Procedimento(s) para este dente')));

    const listaWrap = el('div', {});
    modal.appendChild(listaWrap);

    function renderListaTratamentos(){
      listaWrap.innerHTML = '';
      tData.tratamentos.forEach((t, idx) => {
        const bloco = el('div', { style:'border:1.5px solid var(--line-light);border-radius:10px;padding:12px;margin-bottom:12px;position:relative;' });

        if(tData.tratamentos.length > 1){
          const numBadge = el('div', { style:'font-size:11px;font-weight:700;color:var(--blue-dark);margin-bottom:8px;' },
            document.createTextNode('Procedimento ' + (idx+1)));
          bloco.appendChild(numBadge);
        }

        if(estoqueCache.procedimentos.length){
          const procField = el('div', { class:'field' });
          procField.appendChild(el('label', {}, document.createTextNode('Procedimento cadastrado (opcional)')));
          const procSelect = el('select', { style:'width:100%;padding:11px 10px;font-size:15px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;' });
          procSelect.appendChild(el('option', { value:'' }, document.createTextNode('— Preencher manualmente —')));
          estoqueCache.procedimentos.forEach(p => {
            const opt = el('option', { value:p.id }, document.createTextNode(p.nome + (p.valorSugerido?(' — R$ '+parseFloat(p.valorSugerido).toFixed(2).replace('.',','))+'':'')));
            if(t.procedimentoId === p.id) opt.setAttribute('selected','selected');
            procSelect.appendChild(opt);
          });
          procSelect.onchange = (e) => {
            const proc = estoqueCache.procedimentos.find(p => p.id === e.target.value);
            if(proc){
              t.procedimentoId = proc.id;
              t.tratamento = proc.nome;
              if(proc.valorSugerido){
                const centavos = Math.round(parseFloat(proc.valorSugerido) * 100);
                t.valor = formatCurrencyMask(String(centavos));
              }
            } else {
              t.procedimentoId = '';
            }
            saveProgressDebounced();
            rebuild();
          };
          procField.appendChild(procSelect);
          bloco.appendChild(procField);
          if(t.procedimentoId){
            const proc = estoqueCache.procedimentos.find(p => p.id === t.procedimentoId);
            if(proc && proc.materiais && proc.materiais.length){
              const jaBaixado = t.estoqueBaixado === t.procedimentoId;
              bloco.appendChild(el('p', { style:'font-size:11.5px;color:'+(jaBaixado?'var(--muted)':'var(--amber)')+';margin-top:-6px;margin-bottom:10px;' },
                document.createTextNode(jaBaixado
                  ? '✓ Estoque já baixado para este procedimento.'
                  : '⚠ Ao confirmar, os materiais deste procedimento serão baixados do estoque automaticamente.')));
            }
          }
        }

        [['situacao','Situação / Diagnóstico'],['tratamento','Tratamento proposto'],['valor','Valor (R$)']].forEach(([key,label])=>{
          const f = el('div', { class:'field' });
          f.appendChild(el('label', {}, document.createTextNode(label)));
          if(key==='valor'){
            const inp = el('input', { type:'text', inputmode:'numeric', value:t[key]?formatCurrencyMask(t[key]):'', placeholder:'R$ 0,00', style:'font-weight:700;color:var(--green);' });
            inp.oninput = e => {
              e.target.value = formatCurrencyMask(e.target.value);
              t[key]=e.target.value;
              saveProgressDebounced();
            };
            f.appendChild(inp);
          } else {
            const inp = el('input', { type:'text', value:t[key]||'', placeholder:label });
            inp.oninput = e => { t[key]=e.target.value; saveProgressDebounced(); };
            f.appendChild(comDitado(inp));
          }
          bloco.appendChild(f);
        });

        if(tData.tratamentos.length > 1){
          const removerBtn = el('div', { style:'text-align:right;' }, [
            el('span', { style:'color:var(--red);cursor:pointer;font-size:12px;font-weight:700;' }, document.createTextNode('✕ Remover este procedimento'))
          ]);
          removerBtn.onclick = () => {
            tData.tratamentos.splice(idx,1);
            saveProgressDebounced();
            rebuild();
          };
          bloco.appendChild(removerBtn);
        }

        listaWrap.appendChild(bloco);
      });
    }
    renderListaTratamentos();

    const addTratamentoBtn = el('div', { class:'add-row-btn', style:'text-align:center;margin-bottom:4px;' },
      document.createTextNode('+ Adicionar outro procedimento neste dente'));
    addTratamentoBtn.onclick = () => {
      tData.tratamentos.push({ id: novoTratamentoId(), situacao:'', tratamento:'', valor:'', procedimentoId:'', estoqueBaixado:'' });
      saveProgressDebounced();
      rebuild();
    };
    modal.appendChild(addTratamentoBtn);
  }

  // ---- Imagens deste dente (foto clínica, raio-x etc.) ----
  if(!tData.imagens) tData.imagens = [];
  modal.appendChild(el('div', { style:'font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:18px 0 8px;' },
    document.createTextNode('Imagens deste dente')));
  modal.appendChild(galleryField('Fotos e radiografias do dente ' + n, tData.imagens, () => { saveProgressDebounced(); }));

  // Botão salvar/fechar
  const saveBtn = el('div', { class:'modal-save' }, document.createTextNode('Confirmar'));
  saveBtn.onclick = () => { fecharModalDente(); };
  modal.appendChild(saveBtn);

  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

function renderSVGOnly(container){
  const wrap = document.getElementById('odonto-svg-wrap');
  if(wrap) wrap.innerHTML = buildOdontoSVG();
  bindToothClicks(container);
}

function renderToothPanel(container){
  // Remove painel fixo antigo se existir
  const existing = document.getElementById('tooth-panel');
  if(existing) existing.remove();
  // Mostra hint quando nada selecionado
  if(!selectedTooth){
    const hint = el('div', {
      style:'text-align:center;padding:16px;color:var(--muted);font-size:13px;background:#fff;border:1.5px dashed var(--line-light);border-radius:10px;margin-top:12px;'
    }, document.createTextNode('Toque num dente para selecionar o estado e anotar.'));
    hint.id = 'tooth-panel';
    container.appendChild(hint);
  }
}

function renderOdontogramPanel(container){
  renderSVGOnly(container);
  renderToothPanel(container);
}

function bindToothClicks(container){
  const wrap = document.getElementById('odonto-svg-wrap');
  if(!wrap) return;
  wrap.querySelectorAll('.tooth-g').forEach(g=>{
    g.onclick = ()=>{
      const n = parseInt(g.getAttribute('data-tooth'));
      selectedTooth = n;
      renderSVGOnly(container);
      openToothModal(container, n);
    };
  });
}

function renderTeethGrid(container){
  const wrap = el('div', { class:'odonto-wrap', html: buildOdontoSVG() });

function parseMoney(str){
  if(!str) return 0;
  let clean = String(str).replace(/[^\d,\.]/g,'');
  // Formato brasileiro: ponto = milhar, vírgula = decimal
  clean = clean.replace(/\./g,'').replace(',', '.');
  const n = parseFloat(clean);
  return isNaN(n)?0:n;
}

function calcTotalTratamentos(){
  let total = 0;
  ALL_TEETH.forEach(n=>{
    const d=state.toothData[n];
    if(d && Array.isArray(d.tratamentos)){
      d.tratamentos.forEach(t => { if(t.valor) total += parseMoney(t.valor); });
    }
  });
  (state.outrosTratamentos||[]).forEach(item=>{
    if(item.valor) total += parseMoney(item.valor);
  });
  return total;
}

function formatMoney(n){
  return n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}

// Junta os tratamentos de TODOS os dentes anotados numa lista única e "achatada" —
// um item por procedimento (um dente com 2 procedimentos gera 2 itens aqui).
function listarTodosTratamentosDentes(){
  const itens = [];
  ALL_TEETH.forEach(n => {
    const d = state.toothData[n];
    if(!d) return;
    const lista = (d.tratamentos && d.tratamentos.length) ? d.tratamentos : (d.status>0 ? [null] : []);
    lista.forEach(t => {
      if(!t && d.status===0) return;
      itens.push({ dente:n, status:d.status, situacao: t?(t.situacao||''):'', tratamento: t?(t.tratamento||''):'', valor: t?(t.valor||''):'' });
    });
  });
  return itens;
}

function syncTotalToPayInfo(){
  const total = calcTotalTratamentos();
  if(total>0) state.payInfo.total = formatMoney(total);
}

      valInp.oninput=e=>{e.target.value=formatCurrencyMask(e.target.value);item.valor=e.target.value;saveProgressDebounced();syncTotalToPayInfo();renderTabelaConsolidada();if(refreshPaymentDisplay) refreshPaymentDisplay();};

    // Linhas dos dentes (uma linha por procedimento, ou uma linha só do status se não houver detalhe)

          const opt=el('option',{value:String(i)},document.createTextNode(lbl));
          if(d.status===i) opt.setAttribute('selected','selected');
          selEstado.appendChild(opt);
        });
        selEstado.onchange=(e)=>{ d.status=parseInt(e.target.value,10); saveProgressDebounced(); syncTotalToPayInfo(); renderSVGOnly(container); if(refreshPaymentDisplay) refreshPaymentDisplay(); };
        tdEstado.appendChild(selEstado);
        tr.appendChild(tdEstado);

        // Garante que existe um objeto de tratamento pra editar (cria na hora, se preciso)
        function garantirTratamento(){
          if(t) return t;
          t = { id: novoTratamentoId(), situacao:'', tratamento:'', valor:'', procedimentoId:'', estoqueBaixado:'' };
          if(!Array.isArray(d.tratamentos)) d.tratamentos = [];
          d.tratamentos.push(t);

        [['situacao','Situação'],['tratamento','Tratamento'],['valor','Valor (R$)']].forEach(([campo,placeholder])=>{
          const tdCampo=el('td',{style:'padding:5px 4px;'});
          const inputCampo=el('input',{type:'text', value: t?(t[campo]||''):'', placeholder:placeholder,

          inputCampo.oninput=(e)=>{
            if(campo==='valor') e.target.value = formatCurrencyMask(e.target.value);
            const alvo = garantirTratamento();
            alvo[campo] = e.target.value;
            saveProgressDebounced();
            if(campo==='valor'){ syncTotalToPayInfo(); if(refreshPaymentDisplay) refreshPaymentDisplay(); atualizarTotalConsolidado(); }
          };
          tdCampo.appendChild(inputCampo);
          tr.appendChild(tdCampo);
        });

        const tdAction=el('td',{style:'padding:7px 6px;text-align:center;'});
        const delBtn=el('span',{style:'cursor:pointer;color:#C0392B;font-size:18px;line-height:1;padding:4px;'},document.createTextNode('✕'));
        delBtn.onclick=()=>{
          if(t){
            const idxReal = d.tratamentos.indexOf(t);
            if(idxReal>-1) d.tratamentos.splice(idxReal,1);
          } else {
            state.toothData[n] = { status:0, tratamentos:[] };
          }
          saveProgressDebounced();
          syncTotalToPayInfo();
          renderTabelaConsolidada();
          renderSVGOnly(container);
          if(refreshPaymentDisplay) refreshPaymentDisplay();
        };
        tdAction.appendChild(delBtn);
        tr.appendChild(tdAction);
        tbl.appendChild(tr);
      });
    });

    // Linhas dos outros tratamentos
    outros.forEach(item=>{
      const tr=el('tr',{style:'background:var(--blue-light);'});
      const tdDesc=el('td',{style:'padding:5px 4px;'});
      const inputDesc=el('input',{type:'text', value:item.descricao||'', placeholder:'Descrição',
        style:'width:100%;padding:5px 6px;font-size:12.5px;border:1px solid var(--line-light);border-radius:6px;font-family:inherit;font-weight:600;color:var(--blue-dark);'});
      inputDesc.oninput=(e)=>{ item.descricao=e.target.value; saveProgressDebounced(); };
      tdDesc.appendChild(inputDesc);
      tr.appendChild(tdDesc);
      ['—','—'].forEach(v=>{
        const td2=el('td',{style:'padding:7px 6px;color:var(--muted);text-align:center;'});
        td2.appendChild(document.createTextNode(v));
        tr.appendChild(td2);
      });
      const tdVazio=el('td',{style:'padding:7px 6px;'});
      tr.appendChild(tdVazio);
      const tdValor=el('td',{style:'padding:5px 4px;'});
      const inputValor=el('input',{type:'text', value:item.valor||'', placeholder:'Valor (R$)',
        style:'width:100%;padding:5px 6px;font-size:12.5px;border:1px solid var(--line-light);border-radius:6px;font-family:inherit;font-weight:700;color:var(--green);'});
      inputValor.oninput=(e)=>{ e.target.value = formatCurrencyMask(e.target.value); item.valor=e.target.value; saveProgressDebounced(); syncTotalToPayInfo(); if(refreshPaymentDisplay) refreshPaymentDisplay(); atualizarTotalConsolidado(); };
      tdValor.appendChild(inputValor);
      tr.appendChild(tdValor);
      const tdAction=el('td',{style:'padding:7px 6px;text-align:center;'});
      const delBtn=el('span',{style:'cursor:pointer;color:#C0392B;font-size:18px;line-height:1;padding:4px;'},document.createTextNode('✕'));
      delBtn.onclick=()=>{
        const idx = state.outrosTratamentos.indexOf(item);
        if(idx>-1) state.outrosTratamentos.splice(idx,1);
        saveProgressDebounced();
        syncTotalToPayInfo();
        renderOutrosRows(outrosWrapper);
        renderTabelaConsolidada();
        if(refreshPaymentDisplay) refreshPaymentDisplay();
      };
      tdAction.appendChild(delBtn);
      tr.appendChild(tdAction);
      tbl.appendChild(tr);
    });

    tbl.appendChild(el('tr')); // espaçador

    // Linha de total
    const total = calcTotalTratamentos();
    let totalValorCell = null;
    if(total>0){
      const trTotal=el('tr',{style:'background:var(--blue-dark);'});
      ['TOTAL','','','','R$ '+formatMoney(total),''].forEach((v,i)=>{
        const isValueCell = i===4;
        const cellColor = isValueCell ? '#3DDC84' : '#fff';
        const td2=el('td',{style:`padding:9px 6px;font-weight:700;color:${cellColor};background:var(--blue-dark);`+(i===0?'':'text-align:'+(i===4?'left':'center')+';')});
        td2.appendChild(document.createTextNode(v));
        trTotal.appendChild(td2);
        if(isValueCell) totalValorCell = td2;
      });
      tbl.appendChild(trTotal);
      // Sincroniza automaticamente com Pagamento
      syncTotalToPayInfo();
    }
    tabelaTotalCellRef = totalValorCell;

    tabelaWrap.appendChild(tbl);
  }

  // Atualiza só o número do total (sem reconstruir a tabela inteira) — assim o campo
  // que a pessoa está digitando não perde o foco a cada tecla.
  let tabelaTotalCellRef = null;
  function atualizarTotalConsolidado(){
    const novoTotal = calcTotalTratamentos();
    if(tabelaTotalCellRef){
      tabelaTotalCellRef.textContent = 'R$ ' + formatMoney(novoTotal);
    } else if(novoTotal > 0){
      // Ainda não existia linha de total (total zerado antes) — agora precisa criar, então refaz a tabela.
      renderTabelaConsolidada();
    }
  }

  renderTabelaConsolidada();
  refreshOdontoTable = renderTabelaConsolidada;

  const orcamentoBtn = el('div', { class:'add-row-btn',
    style:'margin-top:10px;background:#fff;border:1.5px dashed var(--blue-dark);color:var(--blue-dark);text-align:center;font-size:14px;padding:13px;' },
    document.createTextNode('📄 Gerar apenas o Orçamento (PDF, sem contrato)'));
  orcamentoBtn.onclick = () => { generateOrcamentoPDF(); renderHistoricoOrcamentos(); };
  container.appendChild(orcamentoBtn);
  container.appendChild(el('p', { style:'font-size:11.5px;color:var(--muted);margin-top:6px;margin-bottom:0;' },
    document.createTextNode('Use isso enquanto o paciente ainda está decidindo. Quando ele fechar o tratamento, gere o PDF completo (com contrato e nota promissória) na última aba.')));

  const historicoWrap = el('div', {});
  container.appendChild(historicoWrap);
  function renderHistoricoOrcamentos(){
    historicoWrap.innerHTML = '';
    if(!state.historicoOrcamentos || !state.historicoOrcamentos.length) return;
    historicoWrap.appendChild(el('div', { style:'font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:16px 0 8px;' },
      document.createTextNode('Histórico de orçamentos gerados')));
    state.historicoOrcamentos.forEach(orc => {
      const dataFmt = new Date(orc.dataGeracao).toLocaleDateString('pt-BR') + ' às ' + new Date(orc.dataGeracao).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
      const qtdItens = (orc.itens?.length||0) + (orc.outros?.length||0);
      const card = el('div', { class:'card', style:'padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;' });
      const info = el('div', {});
      info.appendChild(el('div', { style:'font-weight:700;font-size:13.5px;' }, document.createTextNode('R$ ' + formatMoney(orc.total||0))));
      info.appendChild(el('div', { style:'font-size:11.5px;color:var(--muted);' }, document.createTextNode(dataFmt + ' • ' + qtdItens + ' item(ns)')));
      card.appendChild(info);
      const delBtn = el('span', { style:'color:var(--red);cursor:pointer;font-size:12px;font-weight:700;' }, document.createTextNode('✕'));
      delBtn.onclick = () => {
        if(!confirm('Remover este registro do histórico de orçamentos?')) return;
        state.historicoOrcamentos = state.historicoOrcamentos.filter(o=>o.id!==orc.id);
        saveProgress();
        renderHistoricoOrcamentos();
      };
      card.appendChild(delBtn);
      historicoWrap.appendChild(card);
    });
  }
  renderHistoricoOrcamentos();
}


// Calcula a data de vencimento (DD/MM/AAAA) para um dado dia do mês, avançando "monthOffset" meses a partir do mês atual.
// Se o dia não existir no mês (ex: 31 em fevereiro), usa o último dia daquele mês.
// Converte "DD/MM/AAAA" (formato usado na tabela de parcelas da Anamnese, mais fácil de ler)
// para "AAAA-MM-DD" (formato usado para comparar datas no resto do sistema — Agendamento,
// Central de Pendências etc.). Sem essa conversão, uma parcela com vencimento futuro podia
// aparecer errado como "atrasada", porque comparar "15/08/2026" com "2026-08-04" como texto
// puro não dá o resultado certo.
function converterDataBRparaISO(str){
  const m = String(str||'').trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(!m) return str||''; // não bate com o formato esperado — devolve como veio, sem quebrar nada
  return m[3] + '-' + m[2] + '-' + m[1];
}

function computeDueDate(day, monthOffset){
  const today = new Date();
  let month = today.getMonth() + (monthOffset||0);
  let year = today.getFullYear();
  while(month > 11){ month -= 12; year++; }
  const lastDay = new Date(year, month+1, 0).getDate();
  const d = Math.min(parseInt(day,10)||1, lastDay);
  const dd = String(d).padStart(2,'0');
  const mm = String(month+1).padStart(2,'0');
  return dd+'/'+mm+'/'+year;
}

// Gera automaticamente as linhas de parcelas (Valor dividido, Data nos meses subsequentes, Forma de pagamento)
// a partir do número de parcelas e do dia de vencimento escolhidos.
function regenerateParcelas(){
  const n = parseInt(state.payInfo.parcelas, 10);
  const day = state.payInfo.vencimento;
  if(!n || n<1 || !day) return;
  const totalValor = calcTotalTratamentos();
  const centavosTotal = Math.round(totalValor*100);
  const baseCent = Math.floor(centavosTotal/n);
  const restoCent = centavosTotal - (baseCent*n);
  const novasLinhas = [];
  for(let i=0; i<n; i++){
    const cent = baseCent + (i===n-1 ? restoCent : 0); // ajusta arredondamento na última parcela
    const valorTxt = totalValor>0 ? ('R$ '+formatMoney(cent/100)) : '';
    const dataTxt = computeDueDate(day, i);
    novasLinhas.push([valorTxt, dataTxt, state.payInfo.forma||'']);
  }
  state.payRows = novasLinhas;
  saveProgressDebounced();
  refreshPanel();
}

function renderPayment(container){
  container.appendChild(el('div', { class:'section-title' }, document.createTextNode('Plano de pagamento')));
  const infoTable = el('table', { class:'pay-info-table' });

  // Guarda os inputs das colunas "Valor" (0), "Data do pagamento" (1) e "Forma do pagamento" (2) da tabela
  // para poder atualizá-los ao vivo, sem re-renderizar o painel inteiro (o que tiraria o foco do campo).
  const rowInputs = []; // { valorInput, dataInput, formaInput }
  let totalInputEl = null;

  [['total','Valor total do tratamento'],['forma','Forma de pagamento'],['parcelas','Número de parcelas'],['vencimento','Vencimento todo dia']].forEach(([key,label]) => {
    const tr = el('tr');
    tr.appendChild(el('td', { class:'label' }, document.createTextNode(label)));
    const td = el('td');
    if(key==='total'){
      const totalValor = calcTotalTratamentos();
      const totalTexto = totalValor>0 ? ('R$ '+formatMoney(totalValor)) : '';
      state.payInfo.total = totalTexto;
      const input = el('input', { type:'text', value: totalTexto, readonly:'readonly', style:'font-weight:700;color:var(--green);background:var(--blue-light);cursor:not-allowed;' });
      totalInputEl = input;
      td.appendChild(input);
    } else if(key==='forma'){
      const options = ['', 'Cartão de crédito', 'Cartão de Débito', 'Pix', 'Dinheiro', 'Promissória', 'Boleto'];
      const select = el('select', { style:'width:100%;padding:9px 8px;font-size:14px;border:1px solid var(--line-light);border-radius:6px;font-family:inherit;background:#fff;' });
      options.forEach(opt => {
        const optEl = el('option', { value: opt }, document.createTextNode(opt || 'Selecione...'));
        if((state.payInfo.forma||'') === opt) optEl.setAttribute('selected','selected');
        select.appendChild(optEl);
      });
      select.onchange = (e) => {
        state.payInfo.forma = e.target.value;
        saveProgressDebounced();
        if(state.payInfo.parcelas && state.payInfo.vencimento){
          regenerateParcelas();
        } else {
          // Preenche automaticamente a "Forma do pagamento" das linhas ainda vazias, sem sobrescrever correções já feitas
          rowInputs.forEach((r, ri) => {
            if(!state.payRows[ri][2]){
              r.formaInput.value = e.target.value;
              state.payRows[ri][2] = e.target.value;
            }
          });
        }
      };
      td.appendChild(select);
    } else if(key==='parcelas'){
      const select = el('select', { style:'width:100%;padding:9px 8px;font-size:14px;border:1px solid var(--line-light);border-radius:6px;font-family:inherit;background:#fff;' });
      const blankOpt = el('option', { value:'' }, document.createTextNode('Selecione...'));
      if(!state.payInfo.parcelas) blankOpt.setAttribute('selected','selected');
      select.appendChild(blankOpt);
      for(let n=1; n<=24; n++){
        const optEl = el('option', { value:String(n) }, document.createTextNode(n===1 ? 'À vista (1x)' : n+'x'));
        if(String(state.payInfo.parcelas||'') === String(n)) optEl.setAttribute('selected','selected');
        select.appendChild(optEl);
      }
      select.onchange = (e) => {
        state.payInfo.parcelas = e.target.value;
        saveProgressDebounced();
        if(state.payInfo.parcelas && state.payInfo.vencimento){
          regenerateParcelas();
        }
      };
      td.appendChild(select);
    } else {
      const select = el('select', { style:'width:100%;padding:9px 8px;font-size:14px;border:1px solid var(--line-light);border-radius:6px;font-family:inherit;background:#fff;' });
      const blankOpt = el('option', { value:'' }, document.createTextNode('Selecione o dia...'));
      if(!state.payInfo.vencimento) blankOpt.setAttribute('selected','selected');
      select.appendChild(blankOpt);
      for(let d=1; d<=31; d++){
        const optEl = el('option', { value:String(d) }, document.createTextNode('Dia '+d));
        if(String(state.payInfo.vencimento||'') === String(d)) optEl.setAttribute('selected','selected');
        select.appendChild(optEl);
      }
      select.onchange = (e) => {
        state.payInfo.vencimento = e.target.value;
        saveProgressDebounced();
        if(state.payInfo.parcelas){
          // Já sabendo o número de parcelas, cria a tabela inteira automaticamente com os vencimentos dos meses subsequentes
          regenerateParcelas();
        } else if(e.target.value){
          // Sem número de parcelas definido: apenas preenche a data nas linhas ainda vazias
          rowInputs.forEach((r, ri) => {
            if(!state.payRows[ri][1]){
              const dataTxt = computeDueDate(e.target.value, ri);
              r.dataInput.value = dataTxt;
              state.payRows[ri][1] = dataTxt;
            }
          });
        }
      };
      td.appendChild(select);
    }
    tr.appendChild(td);
    infoTable.appendChild(tr);
  });
  container.appendChild(infoTable);

  const table = el('table', { class:'tx-table' });
  const thead = el('tr');
  ['Valor','Data do pagamento','Forma do pagamento'].forEach(h => thead.appendChild(el('th', {}, document.createTextNode(h))));
  table.appendChild(thead);
  state.payRows.forEach((row, ri) => {
    const tr = el('tr');
    const inputsForRow = {};
    row.forEach((val, ci) => {
      const td = el('td');
      const input = el('input', { type:'text', value: val });
      input.oninput = (e) => { state.payRows[ri][ci] = e.target.value; saveProgressDebounced(); };
      td.appendChild(input);
      tr.appendChild(td);
      if(ci===0) inputsForRow.valorInput = input;
      if(ci===1) inputsForRow.dataInput = input;
      if(ci===2) inputsForRow.formaInput = input;
    });
    rowInputs.push(inputsForRow);
    table.appendChild(tr);
  });
  container.appendChild(table);
  const addBtn = el('div', { class:'add-row-btn' }, document.createTextNode('+ Adicionar linha'));
  addBtn.onclick = () => {
    const novaLinha = ['', '', ''];
    if(state.payInfo.vencimento) novaLinha[1] = computeDueDate(state.payInfo.vencimento, state.payRows.length);
    if(state.payInfo.forma) novaLinha[2] = state.payInfo.forma;
    if(state.payInfo.total) novaLinha[0] = state.payInfo.total;
    state.payRows.push(novaLinha);
    refreshPanel();
  };
  container.appendChild(addBtn);

  // Sincroniza ao vivo o valor total (e a coluna "Valor" das linhas ainda vazias) com o total do plano de tratamento,
  // sem precisar re-renderizar o painel inteiro (o que tiraria o foco de campos em edição).
  refreshPaymentDisplay = () => {
    const totalValor = calcTotalTratamentos();
    const totalTexto = totalValor>0 ? ('R$ '+formatMoney(totalValor)) : '';
    state.payInfo.total = totalTexto;
    if(totalInputEl) totalInputEl.value = totalTexto;
    rowInputs.forEach((r, ri) => {
      if(!state.payRows[ri][0]){
        if(r.valorInput) r.valorInput.value = totalTexto;
        state.payRows[ri][0] = totalTexto;
      }
    });
  };
}

// ============ PDF GENERATION ============
function formatDateBR(dateStr){
  if(!dateStr) return '___/___/______';
  const [y,m,d] = dateStr.split('-');
  return `${d}/${m}/${y}`;
}

function valueByExtension(val){
  // Converte número para extenso (simplificado para reais brasileiros)
  // Formato brasileiro: ponto = separador de milhar, vírgula = separador decimal
  let clean = (val||'').replace(/[^\d,\.]/g,'');
  clean = clean.replace(/\./g,'').replace(',', '.');
  const num = parseFloat(clean);
  if(isNaN(num)||num<=0) return '';
  const inteiros = Math.floor(num);
  const centavos = Math.round((num - inteiros)*100);

  const unidades = ['','um','dois','três','quatro','cinco','seis','sete','oito','nove',
    'dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const dezenas = ['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const centenas = ['','cem','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];

  function toWords(n){
    if(n===0) return '';
    if(n===100) return 'cem';
    if(n<20) return unidades[n];
    if(n<100){
      const d=Math.floor(n/10), u=n%10;
      return dezenas[d]+(u?' e '+unidades[u]:'');
    }
    const c=Math.floor(n/100), resto=n%100;
    return centenas[c]+(resto?' e '+toWords(resto):'');
  }

  function toWordsMil(n){
    if(n===0) return 'zero';
    if(n<1000) return toWords(n);
    const mil=Math.floor(n/1000), resto=n%1000;
    const milStr = mil===1?'mil':(toWords(mil)+' mil');
    return milStr+(resto?' e '+toWords(resto):'');
  }

  let ext = toWordsMil(inteiros);
  ext += inteiros===1?' real':' reais';
  if(centavos>0){
    ext += ' e '+toWords(centavos);
    ext += centavos===1?' centavo':' centavos';
  }
  return ext.charAt(0).toUpperCase()+ext.slice(1);
}
