// Gera um PDF simples de ORÇAMENTO: plano de tratamento + valores propostos, SEM contrato
// e SEM nota promissória — para quando o paciente ainda está decidindo se vai fechar.
function generateOrcamentoPDF(){
  if(!window.jspdf || !window.jspdf.jsPDF){
    alert('Não foi possível carregar a biblioteca de geração de PDF. Verifique sua conexão com a internet e tente novamente.');
    return;
  }
  const pdfAnnotated = listarTodosTratamentosDentes();
  const pdfOutros = (state.outrosTratamentos||[]).filter(i=>i.descricao||i.valor);
  if(!pdfAnnotated.length && !pdfOutros.length){
    alert('Nenhum tratamento foi lançado ainda no odontograma. Preencha o plano de tratamento antes de gerar o orçamento.');
    return;
  }

  // Guarda um "retrato" deste orçamento no histórico do paciente, com data — mesmo que o
  // plano de tratamento seja alterado depois, este registro específico não se perde.
  const totalNoMomento = calcTotalTratamentos();
  state.historicoOrcamentos.unshift({
    id: 'orc' + Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    dataGeracao: Date.now(),
    itens: pdfAnnotated.map(item => ({ dente:item.dente, situacao:item.situacao, tratamento:item.tratamento, valor:item.valor })),
    outros: pdfOutros.map(i => ({ descricao:i.descricao||'', valor:i.valor||'' })),
    total: totalNoMomento
  });
  saveProgress();

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const pageW = 595.28, pageH = 841.89;
  const marginX = 40;
  const contentW = pageW - marginX*2;
  const BLUE = window._clinicaCorPrimariaRGB||[31,92,139];
  const BLUEHEAD = window.clarearCor(BLUE,0.85);
  const BLUELIGHT = window.clarearCor(BLUE,0.93);
  const LINECOL = [155,187,212];
  const INK = [26,26,26];
  const MUTED = [91,107,122];
  let y = 40;

  desenharMarcaDagua(doc, pageW, pageH, state.clinic);

  function newPage(){ doc.addPage(); y = 40; desenharMarcaDagua(doc, pageW, pageH, state.clinic); }
  function ensureSpace(needed){ if(y + needed > pageH - 50) newPage(); }

  // ---------- Cabeçalho da clínica ----------
  const clinicLogo = state.clinic.logo;
  const logoSize = 52;
  let titleX = marginX;
  if(clinicLogo){
    try{
      doc.setDrawColor(...LINECOL);
      doc.rect(marginX, y-8, logoSize, logoSize, 'D');
      const fmt = clinicLogo.includes('image/png') ? 'PNG' : 'JPEG';
      doc.addImage(clinicLogo, fmt, marginX, y-8, logoSize, logoSize);
      titleX = marginX + logoSize + 14;
    }catch(e){}
  }
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(...BLUE);
  doc.text((state.clinic.nome || 'Orçamento Odontológico').toUpperCase(), titleX, y+8);
  doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(...MUTED);
  const subParts = [state.clinic.dentista, state.clinic.cro?('CRO '+state.clinic.cro):''].filter(Boolean);
  doc.text(subParts.join(' — ') || ' ', titleX, y+22);
  y = Math.max(y+logoSize+2, y+34);
  doc.setDrawColor(...BLUE); doc.setLineWidth(1.4);
  doc.line(marginX, y, marginX+contentW, y);
  y += 26;

  // ---------- Título do documento ----------
  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(...BLUE);
  doc.text('ORÇAMENTO ODONTOLÓGICO', marginX, y);
  y += 24;

  // ---------- Paciente e data ----------
  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...INK);
  doc.text('Paciente: ', marginX, y);
  doc.setFont('helvetica','normal');
  doc.text(state.patient.nome || '_______________________', marginX+58, y);
  const hoje = new Date();
  const dataTxt = String(hoje.getDate()).padStart(2,'0')+'/'+String(hoje.getMonth()+1).padStart(2,'0')+'/'+hoje.getFullYear();
  doc.setFont('helvetica','bold');
  doc.text('Data: ', marginX+contentW-110, y);
  doc.setFont('helvetica','normal');
  doc.text(dataTxt, marginX+contentW-80, y);
  y += 26;

  // ---------- Tabela do plano de tratamento ----------
  const statusNames = ['Normal','Problema','Tratado','Ausente'];
  const txRows = pdfAnnotated.map(item => [String(item.dente), item.situacao||'', item.tratamento||'', item.valor||'']);
  const outrosRows = pdfOutros.map(item=>[item.descricao||'', '—', '—', item.valor||'']);
  const total = calcTotalTratamentos();
  const colWidths = [55, contentW*0.30, contentW*0.38, contentW - 55 - contentW*0.30 - contentW*0.38];
  const headers = ['Dente','Situação','Tratamento proposto','Valor (R$)'];
  const rowH = 18;

  function drawHeaderTabela(){
    let cx = marginX;
    headers.forEach((h,i) => {
      doc.setFillColor(...BLUEHEAD); doc.setDrawColor(...LINECOL);
      doc.rect(cx, y, colWidths[i], rowH, 'FD');
      doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(...BLUE);
      doc.text(h, cx+5, y+rowH-6);
      cx += colWidths[i];
    });
    y += rowH;
  }
  ensureSpace(rowH*2);
  drawHeaderTabela();
  [...txRows, ...outrosRows].forEach((row, ri) => {
    if(y + rowH > pageH - 90){ newPage(); drawHeaderTabela(); }
    let cx = marginX;
    const rowFill = ri % 2 === 1 ? BLUELIGHT : [255,255,255];
    row.forEach((val, ci) => {
      doc.setFillColor(...rowFill); doc.setDrawColor(...LINECOL);
      doc.rect(cx, y, colWidths[ci], rowH, 'FD');
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...INK);
      const clipped = doc.splitTextToSize(String(val||''), colWidths[ci]-8)[0] || '';
      doc.text(clipped, cx+5, y+rowH-6);
      cx += colWidths[ci];
    });
    y += rowH;
  });

  // ---------- Total ----------
  ensureSpace(30);
  y += 6;
  doc.setFillColor(...BLUE);
  doc.rect(marginX, y, contentW, 26, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(255,255,255);
  doc.text('VALOR TOTAL DO ORÇAMENTO', marginX+10, y+17);
  doc.text('R$ ' + formatMoney(total), marginX+contentW-10, y+17, { align:'right' });
  y += 40;

  // ---------- Observações ----------
  ensureSpace(70);
  doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(...MUTED);
  const observacoes = [
    'Este documento é um orçamento e não representa um contrato ou compromisso de pagamento.',
    'Os valores e o plano de tratamento propostos estão sujeitos a reavaliação clínica.',
    'Orçamento válido por 30 dias a partir da data de emissão acima.'
  ];
  observacoes.forEach(txt => {
    const linhas = doc.splitTextToSize('• ' + txt, contentW);
    linhas.forEach(l => { ensureSpace(14); doc.text(l, marginX, y); y += 13; });
  });

  const safeName = (state.patient.nome||'paciente').trim().replace(/\s+/g,'_') || 'paciente';
  doc.save('orcamento_' + safeName + '.pdf');
  toast('Orçamento gerado com sucesso!');
}

async function generatePDF(){
  migrateImages();
  if(typeof clinicaUpsertPaciente === 'function' && (state.patient.nome||'').trim()){
    await clinicaUpsertPaciente({
      id: fichaAtivaPacienteId || undefined,
      nome: state.patient.nome, nasc: state.patient.nasc, telefone: state.patient.telefone,
      cpf: state.patient.cpf, rg: state.patient.rg, endereco: state.patient.endereco, email: state.patient.email
    });
  }
  if(!window.jspdf || !window.jspdf.jsPDF){
    alert('Não foi possível carregar a biblioteca de geração de PDF. Verifique sua conexão com a internet e tente novamente. Se o problema persistir, abra este arquivo em outro navegador (Chrome ou Safari).');
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const pageW = 595.28, pageH = 841.89;
  const marginX = 40;
  const contentW = pageW - marginX*2;
  const BLUE = window._clinicaCorPrimariaRGB||[31,92,139];
  const BLUEHEAD = window.clarearCor(BLUE,0.85);
  const BLUELIGHT = window.clarearCor(BLUE,0.93);
  const LINECOL = [155,187,212];
  const INK = [26,26,26];
  const MUTED = [91,107,122];
  const RED = [176,40,40];
  let y = 0;

  desenharMarcaDagua(doc, pageW, pageH, state.clinic);

  function newPage(){
    doc.addPage();
    y = 40;
    desenharMarcaDagua(doc, pageW, pageH, state.clinic);
  }
  function ensureSpace(needed){
    if(y + needed > pageH - 50) newPage();
  }
  function sectionTitle(text){
    ensureSpace(34);
    doc.setFillColor(...BLUE);
    doc.rect(marginX, y, contentW, 22, 'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold');
    doc.setFontSize(11);
    doc.text(text.toUpperCase(), marginX+10, y+15);
    y += 22 + 12;
  }
  function fieldLine(label, value, x, w){
    doc.setFont('helvetica','bold');
    doc.setFontSize(9.5);
    doc.setTextColor(...INK);
    doc.text(label, x, y);
    const labelW = doc.getTextWidth(label) + 6;
    doc.setFont('helvetica','normal');
    doc.setTextColor(40,40,40);
    doc.text(String(value||''), x+labelW, y);
    doc.setDrawColor(...BLUE);
    doc.setLineWidth(0.7);
    doc.line(x, y+3, x+w, y+3);
  }
  function fieldRow(fields){
    fieldRowW(contentW, fields);
  }
  function fieldRowW(totalW, fields){
    ensureSpace(26);
    const gap = 14;
    const totalWeight = fields.reduce((s,f)=>s+(f.weight||1),0);
    let x = marginX;
    fields.forEach(f => {
      const w = (totalW - gap*(fields.length-1)) * (f.weight||1) / totalWeight;
      fieldLine(f.label, f.value, x, w);
      x += w + gap;
    });
    y += 22;
  }
  function questionBox(rows){
    ensureSpace(14);
    let boxTop = y;
    y += 2; // pequeno respiro para o texto não tocar a borda superior da caixa
    let boxPage = doc.internal.getNumberOfPages();
    function closeBox(endY){
      const curPage = doc.internal.getNumberOfPages();
      doc.setPage(boxPage);
      doc.setDrawColor(...LINECOL);
      doc.setLineWidth(0.75);
      doc.rect(marginX, boxTop-4, contentW, endY-boxTop-2, 'D');
      doc.setPage(curPage);
    }
    rows.forEach((r) => {
      doc.setFontSize(9.3);
      if(r.alert){ doc.setFont('helvetica','bold'); doc.setTextColor(...RED); }
      else if(r.bold){ doc.setFont('helvetica','bold'); doc.setTextColor(...INK); }
      else if(r.italic){ doc.setFont('helvetica','italic'); doc.setTextColor(...MUTED); }
      else { doc.setFont('helvetica','normal'); doc.setTextColor(...INK); }
      const split = doc.splitTextToSize(r.text, contentW-12);
      split.forEach(s => {
        // Verifica espaço antes de CADA linha (não só antes da pergunta), evitando texto cortado no rodapé
        if(y + 18 > pageH - 50){
          closeBox(y);
          newPage();
          boxTop = y;
          boxPage = doc.internal.getNumberOfPages();
        }
        doc.text(s, marginX+6, y+2);
        doc.setDrawColor(...LINECOL);
        doc.setLineWidth(0.5);
        doc.line(marginX, y+8, marginX+contentW, y+8);
        y += 16;
      });
    });
    closeBox(y);
    y += 8;
  }
  function ynRowText(q, store){
    const v = store[q.key];
    const respostaAlerta = q.alertOn || 'sim';
    let extra = '';
    if(q.sub){
      extra = q.sub.map(s => s.label + ' ' + (store[s.key]||'____')).join('   ');
    } else if(v === 'sim' && store[q.key+'_obs']){
      extra = 'Obs.: ' + store[q.key+'_obs'];
    }
    return {
      text: q.text + '   [' + (v==='sim'?'X':' ') + '] Sim  [' + (v==='nao'?'X':' ') + '] Não' + (extra?'    '+extra:''),
      alert: v === respostaAlerta
    };
  }

  function drawTable(headers, rows, colWidths, rowH, fontSize){
    rowH = rowH || 16;
    fontSize = fontSize || 8.5;
    ensureSpace(30);
    function drawHeader(){
      let cx = marginX;
      headers.forEach((h,i) => {
        doc.setFillColor(...BLUEHEAD);
        doc.setDrawColor(...LINECOL);
        doc.rect(cx, y, colWidths[i], rowH, 'FD');
        doc.setFont('helvetica','bold'); doc.setFontSize(fontSize); doc.setTextColor(...BLUE);
        doc.text(h, cx+4, y+rowH-5);
        cx += colWidths[i];
      });
      y += rowH;
    }
    drawHeader();
    rows.forEach((row, ri) => {
      if(y + rowH > pageH - 50){ newPage(); drawHeader(); }
      let cx = marginX;
      const rowFill = ri % 2 === 1 ? BLUELIGHT : [255,255,255];
      row.forEach((val, ci) => {
        doc.setFillColor(...rowFill);
        doc.setDrawColor(...LINECOL);
        doc.rect(cx, y, colWidths[ci], rowH, 'FD');
        doc.setFont('helvetica','normal'); doc.setFontSize(fontSize); doc.setTextColor(...INK);
        const txt = String(val||'');
        const clipped = doc.splitTextToSize(txt, colWidths[ci]-6)[0] || '';
        doc.text(clipped, cx+4, y+rowH-5);
        cx += colWidths[ci];
      });
      y += rowH;
    });
    y += 14;
  }

  function drawToothGridPDF(){
    const statusColors = [[255,255,255],[232,180,180],[185,214,236],[220,220,220]];
    const statusStrokes = [LINECOL,[192,57,43],[31,92,139],[136,136,136]];

    function drawPDFRow(nums, label, cellW, cellH, isDeciduous){
      ensureSpace(cellH+8);
      let cx = isDeciduous ? marginX + (contentW - nums.length*cellW)/2 : marginX;
      nums.forEach(n=>{
        const tData = state.toothData[n] || { status:0 };
        const s = tData.status||0;
        const absent = s===3;
        doc.setFillColor(...statusColors[s]);
        doc.setDrawColor(...statusStrokes[s]);
        doc.rect(cx, y, cellW-1, cellH, 'FD');
        if(absent){
          doc.setDrawColor(...statusStrokes[s]);
          doc.line(cx+2, y+2, cx+cellW-3, y+cellH-2);
          doc.line(cx+cellW-3, y+2, cx+2, y+cellH-2);
        } else {
          doc.setFont('helvetica','bold'); doc.setFontSize(isDeciduous?6.5:7); doc.setTextColor(...statusStrokes[s]);
          doc.text(String(n), cx+cellW/2-0.5, y+cellH/2+2.5, { align:'center' });
        }
        cx += cellW;
      });
      y += cellH + 4;
    }

    const permCellW = contentW/16;
    const decCellW = contentW/12;
    drawPDFRow([...UPPER_RIGHT,...UPPER_LEFT], 'SUPERIOR', permCellW, 22, false);
    drawPDFRow([...LOWER_RIGHT,...LOWER_LEFT], 'INFERIOR', permCellW, 22, false);
    y += 4;
    drawPDFRow([...DEC_UPPER_RIGHT,...DEC_UPPER_LEFT,...DEC_LOWER_RIGHT,...DEC_LOWER_LEFT].slice(0,10), 'DECÍDUOS — SUPERIOR', decCellW, 20, true);
    drawPDFRow([...DEC_UPPER_RIGHT,...DEC_UPPER_LEFT,...DEC_LOWER_RIGHT,...DEC_LOWER_LEFT].slice(10), 'DECÍDUOS — INFERIOR', decCellW, 20, true);

    y += 4;
    doc.setFontSize(7); doc.setTextColor(...MUTED);
    doc.text('Branco: sem alteração   |   Vermelho: problema   |   Azul: tratado   |   Cinza: ausente', marginX, y);
    y += 14;
  }

  // ---------- PAGE 1 ----------
  y = 40;
  const clinicLogo = state.clinic.logo;
  const logoSize = 50;
  const titleX = clinicLogo ? marginX + logoSize + 12 : marginX;
  if(clinicLogo){
    try{
      doc.setDrawColor(...LINECOL);
      doc.rect(marginX, y-30, logoSize, logoSize, 'D');
      const fmt = clinicLogo.includes('image/png') ? 'PNG' : 'JPEG';
      doc.addImage(clinicLogo, fmt, marginX, y-30, logoSize, logoSize);
    }catch(e){ /* if image fails to embed, silently skip it */ }
  }
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(...BLUE);
  const clinicMainTitle = (state.clinic.nome || state.clinic.dentista || 'Ficha de Anamnese Odontológica').toUpperCase();
  doc.text(clinicMainTitle, titleX, y);
  y += 14;
  doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(...MUTED);
  const clinicSubtitleParts = [state.clinic.dentista, state.clinic.cro ? ('CRO '+state.clinic.cro) : ''].filter(Boolean);
  doc.text(clinicSubtitleParts.length ? clinicSubtitleParts.join(' — ') : 'Ficha de Anamnese Odontológica', titleX, y);
  y += 6;
  if(clinicLogo && y < (40-30+logoSize)){ y = 40-30+logoSize+6; }
  doc.setDrawColor(...BLUE); doc.setLineWidth(1.4);
  doc.line(marginX, y+6, marginX+contentW, y+6);
  y += 24;

  sectionTitle('Dados da clínica / dentista');
  fieldRow([{label:'Clínica:', value:state.clinic.nome},{label:'Dentista:', value:state.clinic.dentista}]);
  fieldRow([{label:'CRO:', value:state.clinic.cro},{label:'CNPJ:', value:state.clinic.cnpj}]);
  fieldRow([{label:'Endereço:', value:state.clinic.endereco, weight:3}]);
  fieldRow([{label:'Telefone:', value:state.clinic.telefone},{label:'E-mail:', value:state.clinic.email}]);
  y += 6;

  sectionTitle('Dados do paciente');
  const hasPhoto = !!state.patient.foto;
  const photoSize = 86;
  const textW = hasPhoto ? contentW - photoSize - 14 : contentW;
  const photoTop = y - 12;
  const photoBottom = photoTop + photoSize;
  if(hasPhoto){
    try{
      doc.setDrawColor(...LINECOL);
      doc.rect(marginX+textW+14, photoTop, photoSize, photoSize, 'D');
      const fmt = state.patient.foto.includes('image/png') ? 'PNG' : 'JPEG';
      doc.addImage(state.patient.foto, fmt, marginX+textW+14, photoTop, photoSize, photoSize);
    }catch(e){ /* if image fails to embed, silently skip it */ }
  }
  // Enquanto a linha ainda estiver na altura da foto, usa a largura estreita
  // (mantendo as colunas alinhadas); assim que passar da foto, volta à largura total.
  function patientFieldRow(fields){
    const rowW = (hasPhoto && y < photoBottom) ? textW : contentW;
    fieldRowW(rowW, fields);
  }
  patientFieldRow([{label:'Nome:', value:state.patient.nome, weight:3}]);
  patientFieldRow([{label:'Nascimento:', value:formatDateBR(state.patient.nasc)},{label:'Sexo:', value:state.patient.sexo}]);
  patientFieldRow([{label:'RG:', value:state.patient.rg},{label:'Idade:', value:state.patient.idade}]);
  patientFieldRow([{label:'CPF:', value:state.patient.cpf},{label:'Telefone:', value:state.patient.telefone}]);
  if(hasPhoto && y < photoBottom){ y = photoBottom + 8; }
  fieldRow([{label:'Endereço:', value:state.patient.endereco, weight:3}]);
  fieldRow([{label:'Obs.:', value:state.patient.obs, weight:3}]);
  fieldRow([{label:'Responsável legal:', value:state.patient.responsavel, weight:3}]);
  y += 6;

  sectionTitle('Questionário de saúde geral');
  const queixaRow = [{text:'Queixa principal? ' + (state.general.queixaPrincipal||'________________________'), bold:true}];
  questionBox(queixaRow);
  const genRows = GENERAL_QUESTIONS.map(q => ynRowText(q, state.general));
  questionBox(genRows);

  ensureSpace(16);
  doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(...BLUE);
  doc.text('Sofre alguma destas doenças?', marginX, y); y += 12;
  const dCols = 3, dColW = contentW/dCols, dRowH = 15;
  for(let i=0;i<DISEASES.length;i+=dCols){
    ensureSpace(dRowH+2);
    const rowItems = DISEASES.slice(i, i+dCols);
    let cx = marginX;
    rowItems.forEach(name => {
      const checked = !!state.diseases[name];
      doc.setFillColor(...BLUELIGHT);
      doc.setDrawColor(...LINECOL);
      doc.rect(cx, y, dColW, dRowH, 'FD');
      if(checked){ doc.setFont('helvetica','bold'); doc.setTextColor(...RED); }
      else { doc.setFont('helvetica','normal'); doc.setTextColor(...INK); }
      doc.setFontSize(8.3);
      const mark = checked ? '[X] ' : '[ ] ';
      doc.text(mark+name, cx+4, y+dRowH-5);
      cx += dColW;
    });
    y += dRowH;
  }
  y += 10;

  const gen2Rows = [{text:'Outras doenças? Quais? ' + (state.general.outrasdoencas||'________________________'), bold:true}]
    .concat(GENERAL_QUESTIONS_2.map(q => ynRowText(q, state.general)));
  questionBox(gen2Rows);

  sectionTitle('Questionário de saúde bucal');
  const oralRows = ORAL_QUESTIONS.map(q => ynRowText(q, state.oral));
  questionBox(oralRows);

  sectionTitle('Espaço reservado para o cirurgião-dentista');
  ensureSpace(60);
  doc.setDrawColor(...LINECOL);
  doc.setLineWidth(0.75);
  doc.rect(marginX, y, contentW, 50, 'D');
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...BLUE);
  doc.text('Observações:', marginX+8, y+14);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...INK);
  const obsLines = doc.splitTextToSize(state.dentist.obs||'', contentW-16);
  obsLines.slice(0,3).forEach((l,i)=> doc.text(l, marginX+8, y+28+i*11));
  y += 60;

  ensureSpace(30);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...INK);
  doc.text('Data: ' + (state.contract.dataContrato ? formatDateBR(state.contract.dataContrato) : '_______________'), pageW/2, y, { align:'center' });
  y += 36;

  ensureSpace(60);
  const sigGap = 24;
  const sigW = (contentW - sigGap) / 2;
  doc.setDrawColor(...LINECOL); doc.setLineWidth(0.7);
  doc.line(marginX, y, marginX+sigW, y);
  doc.line(marginX+sigW+sigGap, y, marginX+contentW, y);
  doc.setFontSize(8.5); doc.setTextColor(...MUTED);
  const patientSigLabel = 'Assinatura do paciente' + (state.patient.nome ? (' — '+state.patient.nome) : '') + (state.patient.cpf ? (' — CPF: '+state.patient.cpf) : '');
  const dentistSigLabel = 'Assinatura do(a) dentista' + (state.clinic.dentista ? (' — Dr.(a) '+state.clinic.dentista) : '');
  function drawWrappedCentered(text, cx, startY, maxW, lineH){
    const lines = doc.splitTextToSize(text, maxW);
    lines.forEach((l,i)=> doc.text(l, cx, startY+i*lineH, { align:'center' }));
    return lines.length;
  }
  const patLines = drawWrappedCentered(patientSigLabel, marginX+sigW/2, y+11, sigW-6, 10);
  const denLines = drawWrappedCentered(dentistSigLabel, marginX+sigW+sigGap+sigW/2, y+11, sigW-6, 10);
  let sigExtraLines = denLines;
  if(state.clinic.cro){
    doc.text('CRO: '+state.clinic.cro, marginX+sigW+sigGap+sigW/2, y+11+denLines*10, { align:'center' });
    sigExtraLines += 1;
  }
  sigExtraLines = Math.max(sigExtraLines, patLines);
  y += 20 + (sigExtraLines-1)*10;

  // ---------- Imagens / Radiografias ----------
  function drawImageGallery(label, arr, placeholderText){
    sectionTitle(label);
    if(!arr || arr.length === 0){
      ensureSpace(160);
      doc.setFillColor(...BLUELIGHT);
      doc.setDrawColor(...LINECOL);
      doc.setLineDashPattern([3,2], 0);
      doc.rect(marginX, y, contentW, 150, 'FD');
      doc.setLineDashPattern([], 0);
      doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(...MUTED);
      doc.text(placeholderText, pageW/2, y+78, { align:'center' });
      y += 170;
      return;
    }
    const cols = 2;
    const gap = 10;
    const cellW = (contentW - gap*(cols-1)) / cols;
    const cellH = 130; // fixed slot height; the image is scaled to fit inside without distortion
    const captionH = 16; // espaço reservado para o título/descrição abaixo de cada imagem
    let cx = marginX, colCount = 0;
    arr.forEach((item) => {
      const dataUrl = item.url || item; // compatível com formato antigo (string), por segurança
      const titulo = item.titulo || '';
      ensureSpace(cellH + captionH + 10);
      try{
        const fmt = dataUrl.includes('image/png') ? 'PNG' : 'JPEG';
        // Slot border (always the fixed size, for visual alignment)
        doc.setDrawColor(...LINECOL);
        doc.rect(cx, y, cellW, cellH, 'D');
        // Compute real image dimensions to preserve aspect ratio (contain, not stretch)
        const props = doc.getImageProperties(dataUrl);
        const ratio = props.width / props.height;
        let drawW = cellW, drawH = cellW / ratio;
        if(drawH > cellH){
          drawH = cellH;
          drawW = cellH * ratio;
        }
        const offsetX = cx + (cellW - drawW) / 2;
        const offsetY = y + (cellH - drawH) / 2;
        doc.addImage(dataUrl, fmt, offsetX, offsetY, drawW, drawH);
      }catch(e){ /* skip image if it fails to embed */ }
      // Título / descrição abaixo da imagem
      doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(...BLUE);
      const captionTxt = titulo.trim() ? doc.splitTextToSize(titulo, cellW-4)[0] : '';
      if(captionTxt) doc.text(captionTxt, cx+2, y+cellH+11);
      colCount++;
      if(colCount >= cols){
        cx = marginX;
        colCount = 0;
        y += cellH + captionH + gap;
      } else {
        cx += cellW + gap;
      }
    });
    if(colCount !== 0){ y += cellH + captionH + gap; }
    y += 4;
  }

  newPage();
  drawImageGallery('Imagens', state.images.clinicas, 'Espaço para inserir imagens clínicas');
  drawImageGallery('Radiografias', state.images.radiografias, 'Espaço para inserir radiografias');

  // ---------- Plano de tratamento ----------
  newPage();
  sectionTitle('Odontograma e plano de tratamento');
  drawToothGridPDF();

  // Build treatment table from toothData
  const pdfAnnotated = listarTodosTratamentosDentes();
  const pdfOutros = (state.outrosTratamentos||[]).filter(i=>i.descricao||i.valor);
  const statusNames2 = ['Normal','Problema','Tratado','Ausente'];

  if(pdfAnnotated.length || pdfOutros.length){

    // Linhas dos outros tratamentos

    // Total
    const total = calcTotalTratamentos();
    const totalRow = ['TOTAL','','','','R$ '+formatMoney(total)];
    const allRows = [...txRows2, ...outrosRows2, totalRow];
    drawTable(['Dente / Descrição','Estado','Situação','Tratamento','Valor (R$)'], allRows, [60,55,contentW-60-55-130-70,130,70]);
  }

  // ---------- Pagamento ----------
  syncTotalToPayInfo();
  sectionTitle('Plano de pagamento');
  ensureSpace(60);
  [['Valor total do tratamento', state.payInfo.total],['Forma de pagamento', state.payInfo.forma],['Vencimento todo dia', state.payInfo.vencimento]].forEach(([label,val]) => {
    ensureSpace(18);
    doc.setFillColor(...BLUEHEAD);
    doc.setDrawColor(...LINECOL);
    doc.rect(marginX, y, contentW*0.42, 16, 'FD');
    doc.setFillColor(255,255,255);
    doc.setDrawColor(...LINECOL);
    doc.rect(marginX+contentW*0.42, y, contentW*0.58, 16, 'FD');
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(...BLUE);
    doc.text(label, marginX+4, y+11);
    doc.setFont('helvetica','normal'); doc.setTextColor(...INK);
    doc.text(String(val||''), marginX+contentW*0.42+4, y+11);
    y += 16;
  });
  y += 10;
  drawTable(['Valor','Data do pagamento','Forma do pagamento'], state.payRows, [contentW/3, contentW/3, contentW/3]);

  // ---------- Contrato ----------
  newPage();
  const v = (val) => (val && String(val).trim()) ? String(val) : '________________________';

  let contractScale = 1;
  function contractTitle(text){
    const fs = 10*contractScale;
    ensureSpace(20*contractScale);
    doc.setFont('helvetica','bold'); doc.setFontSize(fs); doc.setTextColor(...BLUE);
    doc.text(text, marginX, y);
    y += 14*contractScale;
  }
  function contractPara(text, opts={}){
    doc.setFont('helvetica', opts.bold ? 'bold' : 'normal');
    doc.setFontSize(9*contractScale); doc.setTextColor(...INK);
    const lines = doc.splitTextToSize(text, contentW);
    lines.forEach(l => {
      ensureSpace(13*contractScale);
      doc.text(l, marginX, y);
      y += 12*contractScale;
    });
    y += 4*contractScale;
  }

  // Monta os textos usados no contrato uma única vez, para que a estimativa de altura e o desenho real usem exatamente o mesmo conteúdo
  const contratanteParas = [
    'Nome: ' + v(state.patient.nome) + '   CPF: ' + v(state.patient.cpf) + '   RG: ' + v(state.patient.rg),
    'Endereço: ' + v(state.patient.endereco),
    'Telefone: ' + v(state.patient.telefone) + '   E-mail: ' + v(state.patient.email)
  ];
  if((state.patient.responsavel||'').trim()){
    contratanteParas.push('Responsável legal (quando aplicável): ' + v(state.patient.responsavel) + '   CPF: ' + v(state.patient.respCpf));
  }
  const contratadoParas = [
    'Nome do profissional ou clínica: ' + v(state.clinic.nome) + (state.clinic.dentista ? (' — Dr.(a) '+state.clinic.dentista) : ''),
    'CNPJ/CPF: ' + v(state.clinic.cnpj) + '   CRO: ' + v(state.clinic.cro),
    'Endereço profissional: ' + v(state.clinic.endereco),
    'Telefone: ' + v(state.clinic.telefone) + '   E-mail: ' + v(state.clinic.email)
  ];
  const usaTextoPersonalizado = (state.contract.textoPersonalizado||'').trim();
  const clausulasParaImprimir = usaTextoPersonalizado ? null : buildContractClauses();
  const contractPayRows = (state.payRows||[]).filter(r => (r[0]||'').trim() || (r[1]||'').trim() || (r[2]||'').trim());

  // Estima a altura total do contrato para uma dada escala de fonte, para descobrir o maior tamanho que cabe em uma página
  function estimateContractHeight(scale){
    let h = 22*scale; // título principal
    const measurePara = (text) => {
      doc.setFont('helvetica','normal');
      doc.setFontSize(9*scale);
      const lines = doc.splitTextToSize(text, contentW);
      return lines.length * (12*scale) + 4*scale;
    };
    h += 14*scale;
    contratanteParas.forEach(p => h += measurePara(p));
    h += 14*scale;
    contratadoParas.forEach(p => h += measurePara(p));
    if(usaTextoPersonalizado){
      h += 14*scale;
      h += measurePara(state.contract.textoPersonalizado);
    } else {
      clausulasParaImprimir.forEach(c=>{
        h += 14*scale;
        c.paragraphs.forEach(p => h += measurePara(p));
      });
    }
    if(contractPayRows.length){
      h += 14*scale; // título da tabela
      h += (16*scale) * (contractPayRows.length + 1) + 14*scale; // cabeçalho + linhas + respiro final
    }
    h += 8 + 20 + 36; // linha de cidade/data (mantida em tamanho fixo, é pequena)
    h += 70 + 46 + 40 + 30; // blocos de assinatura (mantidos em tamanho fixo, por serem curtos e precisarem ficar legíveis)
    return h;
  }

  // Testa escalas decrescentes até encontrar a maior que caiba em uma única página
  const availableHeight = (pageH - 50) - y;
  const scalesToTry = [1, 0.93, 0.86, 0.79, 0.72, 0.66, 0.6];
  for(let i=0; i<scalesToTry.length; i++){
    const s = scalesToTry[i];
    if(estimateContractHeight(s) <= availableHeight || i === scalesToTry.length-1){
      contractScale = s;
      break;
    }
  }

  doc.setFont('helvetica','bold'); doc.setFontSize(14*contractScale); doc.setTextColor(...BLUE);
  doc.text('CONTRATO DE PRESTAÇÃO DE SERVIÇOS ODONTOLÓGICOS', pageW/2, y, { align:'center' });
  y += 22*contractScale;

  contractTitle('CONTRATANTE (PACIENTE)');
  contratanteParas.forEach(p => contractPara(p));

  contractTitle('CONTRATADO (PROFISSIONAL / CLÍNICA)');
  contratadoParas.forEach(p => contractPara(p));

  if(usaTextoPersonalizado){
    contractTitle('CLÁUSULAS CONTRATUAIS (texto revisado pelo profissional)');
    contractPara(state.contract.textoPersonalizado);
  } else {
    clausulasParaImprimir.forEach(c=>{
      contractTitle(c.title);
      c.paragraphs.forEach(p=>contractPara(p));
    });
  }

  if(contractPayRows.length){
    contractTitle('TABELA DE PARCELAS (Cláusula 6ª)');
    drawTable(['Valor','Data do pagamento','Forma do pagamento'], contractPayRows, [contentW/3, contentW/3, contentW/3], 16*contractScale, 8.5*contractScale);
  }

  y += 8;
  ensureSpace(20);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...INK);
  doc.text('Cidade: ' + v(state.clinic.cidade) + '     Data: ' + (state.contract.dataContrato ? formatDateBR(state.contract.dataContrato) : v(state.contract.dataContrato)), marginX, y);
  y += 36;

  ensureSpace(70);
  doc.setDrawColor(...LINECOL); doc.setLineWidth(0.7);
  doc.line(marginX, y, marginX+220, y);
  doc.setFontSize(8.5); doc.setTextColor(...MUTED);
  doc.text(v(state.patient.nome), marginX, y+11);
  doc.text('CONTRATANTE', marginX, y+22);

  if((state.patient.responsavel||'').trim()){
    doc.line(marginX+260, y, marginX+contentW, y);
    doc.text(v(state.patient.responsavel), marginX+260, y+11);
    doc.text('RESPONSÁVEL LEGAL', marginX+260, y+22);
  }
  y += 46;

  ensureSpace(40);
  doc.line(marginX, y, marginX+contentW, y);
  doc.text(v(state.clinic.nome) + (state.clinic.dentista ? (' — Dr.(a) '+state.clinic.dentista) : ''), marginX, y+11);
  doc.text('CONTRATADO(A)', marginX, y+22);
  y += 30;

  const safeName = (state.patient.nome||'paciente').trim().replace(/\s+/g,'_') || 'paciente';
  const fileName = 'ficha_anamnese_' + safeName + '.pdf';
  // ---------- Nota Promissória (só quando a forma de pagamento escolhida for "Promissória") ----------
  if(state.payInfo.forma === 'Promissória'){
    doc.addPage();
    desenharMarcaDagua(doc, pageW, pageH, state.clinic);
    drawPromissoryPage(doc, pageW, pageH);
  }

  // ---------- Dados financeiros embutidos (para importação no Controle de Pagamentos e Comissões) ----------
  const tratamentosParaFinanceiro = [];
  listarTodosTratamentosDentes().forEach(item=>{
    if((item.tratamento||'').trim() || (item.valor||'').trim()){
      tratamentosParaFinanceiro.push({ descricao: 'Dente '+item.dente+(item.tratamento?(': '+item.tratamento.trim()):''), valor: parseMoney(item.valor) });
    }
  });
  (state.outrosTratamentos||[]).forEach(item=>{
    if((item.descricao||'').trim() || (item.valor||'').trim()){
      tratamentosParaFinanceiro.push({ descricao: item.descricao||'', valor: parseMoney(item.valor) });
    }
  });
  const parcelasParaFinanceiro = (state.payRows||[])
    .filter(r => (r[0]||'').trim() || (r[1]||'').trim() || (r[2]||'').trim())
    .map(r => ({ valor: parseMoney(r[0]), data: converterDataBRparaISO(r[1]), forma: r[2]||'' }));
  const financeiroPayload = {
    paciente: state.patient.nome||'',
    profissionalNome: (window._clinicaMe && window._clinicaMe.nome) || state.clinic.dentista || state.clinic.nome || '',
    clinicaNome: state.clinic.nome||'',
    dataContrato: state.contract.dataContrato||'',
    valorTotal: calcTotalTratamentos(),
    tratamentos: tratamentosParaFinanceiro,
    parcelas: parcelasParaFinanceiro
  };
  const FINANCEIRO_TAG = 'FICHA_FINANCEIRO_DATA:';
  const financeiroCode = encodePdfData(financeiroPayload);
  if(financeiroCode){
    doc.setProperties({ keywords: FINANCEIRO_TAG + financeiroCode });
  }

  // ---------- Lança automaticamente no Financeiro (sem precisar importar o PDF manualmente) ----------
  lancarAutomaticamenteNoFinanceiro(financeiroPayload);

  sharePDF(doc, fileName);
}

// Escreve (ou atualiza, se já existir) o lançamento financeiro correspondente a esta ficha,
// direto no módulo Financeiro — sem precisar do passo manual de "Importar PDF".
// Parcelas pagas com cartão já entram marcadas como recebidas; as demais formas (dinheiro,
// Pix, promissória, boleto) ficam pendentes até serem confirmadas manualmente no Financeiro.
async function lancarAutomaticamenteNoFinanceiro(payload){
  try{
    const dados = await ClinicaStorage.load('controle_pagamentos_comissoes_v1') || { profissionais:[], rateiosFixos:[], lancamentos:[] };
    if(!Array.isArray(dados.lancamentos)) dados.lancamentos = [];

    // Busca o profissional na lista COMPARTILHADA (Perfil da Clínica), que é sempre a fonte
    // de verdade mais atual — a cópia dentro do Financeiro só atualiza quando alguém abre e
    // salva algo lá, então não dá pra confiar só nela pra esse cruzamento automático.
    const nomeAlvo = (payload.profissionalNome||'').trim().toLowerCase();
    let profEncontrado = null;
    if(nomeAlvo){
      try{
        const profissionaisCompartilhados = await ClinicaStorage.load('clinica_profissionais_agenda_v1') || [];
        profEncontrado = profissionaisCompartilhados.find(p => (p.nome||'').trim().toLowerCase() === nomeAlvo);
        // Garante que esse profissional também exista na lista interna do Financeiro, com o
        // MESMO id, senão o cruzamento por profissionalId nas telas de comissão não bate.
        if(profEncontrado){
          if(!Array.isArray(dados.profissionais)) dados.profissionais = [];
          const jaExiste = dados.profissionais.find(p => p.id === profEncontrado.id);
          if(!jaExiste){
            dados.profissionais.push(Object.assign({ comissaoPercent: (profEncontrado.pagamento&&profEncontrado.pagamento.percentual)||'' }, profEncontrado));
          }
        }
      }catch(e){ /* segue sem achar, fica sem profissional atribuído */ }
    }

    const parcelasMontadas = (payload.parcelas||[]).map(p => {
      const ehCartao = /cart[ãa]o/i.test(p.forma||'');
      return {
        id: uidFinLocal(),
        valor: parseFloat(p.valor)||0,
        data: p.data||'',
        forma: p.forma||'',
        pago: ehCartao,
        dataRecebimento: ehCartao ? hojeISOFinLocal() : '',
        horaRecebimento: ''
      };
    });

    const lancamento = {
      id: state.financeiroLancamentoId || uidFinLocal(),
      paciente: payload.paciente || '(sem nome)',
      pacienteId: fichaAtivaPacienteId || '',
      profissionalId: profEncontrado ? profEncontrado.id : '',
      profissionalNomeOriginal: payload.profissionalNome || '',
      clinicaNome: payload.clinicaNome || '',
      dataContrato: payload.dataContrato || '',
      valorTotal: parseFloat(payload.valorTotal)||0,
      tratamentos: Array.isArray(payload.tratamentos) ? payload.tratamentos : [],
      parcelas: parcelasMontadas,
      origem: 'automatico'
    };

    const idxExistente = dados.lancamentos.findIndex(l => l.id === lancamento.id);
    if(idxExistente > -1) dados.lancamentos[idxExistente] = lancamento;
    else dados.lancamentos.unshift(lancamento);

    if(!state.financeiroLancamentoId){
      state.financeiroLancamentoId = lancamento.id;
      saveProgressDebounced();
    }

    await ClinicaStorage.save('controle_pagamentos_comissoes_v1', dados);
    toast('Lançado automaticamente no Financeiro!');
  }catch(e){
    console.error('Não foi possível lançar automaticamente no Financeiro:', e);
  }
}
function uidFinLocal(){ return 'lanc'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function hojeISOFinLocal(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

async function sharePDF(doc, fileName){
  doc.save(fileName);
  toast('PDF baixado com sucesso!');
}

// ============ PERSISTÊNCIA (servidor, múltiplas fichas por paciente) ============
const CLINICA_PERFIL_KEY = 'clinica_perfil_v1';
const INDICE_STORAGE_KEY = 'ficha_anamnese_indice_v1';
function chaveFicha(pacienteId){ return 'ficha_anamnese_paciente_' + pacienteId; }

async function carregarClinica(){
  const saved = await ClinicaStorage.load(CLINICA_PERFIL_KEY);
  if(saved) Object.assign(state.clinic, saved);
}

async function carregarIndiceFichas(){
  const saved = await ClinicaStorage.load(INDICE_STORAGE_KEY);
  return Array.isArray(saved) ? saved : [];
}
function salvarIndiceFichas(lista){
  ClinicaStorage.save(INDICE_STORAGE_KEY, lista);
}
async function registrarFichaNoIndice(pacienteId){
  const lista = await carregarIndiceFichas();
  const existente = lista.find(f => f.pacienteId === pacienteId);
  if(existente){
    existente.atualizadoEm = Date.now();
  } else {
    lista.push({ pacienteId, criadoEm: Date.now(), atualizadoEm: Date.now() });
  }
  salvarIndiceFichas(lista);
}

function extrairDadosFicha(){
  const dados = {};
  FICHA_KEYS.forEach(k => { dados[k] = state[k]; });
  return dados;
}

function saveProgress(){
  // Os dados da clínica agora são só leitura aqui (editados no Perfil da Clínica), não salvamos de volta.
  if(modoAtual === 'ficha' && fichaAtivaPacienteId){
    ClinicaStorage.save(chaveFicha(fichaAtivaPacienteId), extrairDadosFicha());
  }
}

function clearProgress(){
  // Limpa apenas a ficha ativa (não mexe no cadastro nem nas outras fichas)
  if(fichaAtivaPacienteId){
    ClinicaStorage.save(chaveFicha(fichaAtivaPacienteId), null);
  }
}

// Abre (ou cria) a ficha de um paciente específico e mostra as abas normais
async function abrirFicha(pacienteId){
  fichaAtivaPacienteId = pacienteId;
  await carregarEstoqueCache();
  const salvo = await ClinicaStorage.load(chaveFicha(pacienteId));
  const dadosFicha = salvo || JSON.parse(JSON.stringify(FICHA_TEMPLATE_VAZIA));
  FICHA_KEYS.forEach(k => { state[k] = dadosFicha[k] !== undefined ? dadosFicha[k] : FICHA_TEMPLATE_VAZIA[k]; });
  Object.keys(state.toothData).forEach(n => td(n)); // migra dentes já preenchidos para o novo formato (lista de tratamentos)

  // Os dados pessoais do paciente (nome, nascimento, CPF etc.) vêm sempre do cadastro
  // compartilhado (módulo Pacientes) — assim, se algo for atualizado lá, reflete aqui também.
  const pac = clinicaFindPacienteById(pacienteId);
  if(pac){
    state.patient.nome = pac.nome || '';
    state.patient.nasc = pac.nasc || '';
    state.patient.sexo = pac.sexo || state.patient.sexo || '';
    state.patient.telefone = pac.telefone || '';
    state.patient.cpf = pac.cpf || '';
    state.patient.rg = pac.rg || '';
    state.patient.endereco = pac.endereco || '';
    state.patient.email = pac.email || '';
    if(pac.foto) state.patient.foto = pac.foto;
  }
  if(!salvo){
    await registrarFichaNoIndice(pacienteId);
  }

  modoAtual = 'ficha';
  currentStep = 0;
  document.getElementById('stepsNav').style.display = '';
  document.querySelector('footer.bottombar').style.display = '';
  document.getElementById('voltarListaBtn').style.display = '';
  renderPanel(0);
  iniciarTelaSempreAtivaAutomaticamente();
}

// Volta para a lista de pacientes/fichas
function mostrarListaFichas(){
  modoAtual = 'lista';
  fichaAtivaPacienteId = null;
  document.getElementById('stepsNav').style.display = 'none';
  document.querySelector('footer.bottombar').style.display = 'none';
  document.getElementById('voltarListaBtn').style.display = 'none';
  renderListaFichas();
  pararTelaSempreAtiva();
}

let filtroListaFichas = '';
async function renderListaFichas(){
  const main = document.getElementById('main');
  main.innerHTML = '';
  document.getElementById('clinicSubtitle').textContent = [state.clinic.nome, state.clinic.dentista].filter(Boolean).join(' — ') || 'Nome da Clínica / Cirurgião-Dentista';

  main.appendChild(el('div', { class:'section-title' }, document.createTextNode('Pacientes')));
  main.appendChild(el('p', { style:'font-size:12px;color:var(--muted);margin-top:-6px;margin-bottom:14px;' },
    document.createTextNode('Escolha um paciente para abrir a ficha dele, ou crie uma nova. Para cadastrar um paciente novo, use a tela inicial do sistema.')));

  const searchInput = el('input', { type:'text', placeholder:'Buscar paciente...', value: filtroListaFichas,
    style:'width:100%;padding:12px 10px;font-size:15px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;margin-bottom:14px;' });
  searchInput.oninput = (e) => { filtroListaFichas = e.target.value; renderListaInterna(); };
  main.appendChild(searchInput);

  const listWrap = el('div', {});
  main.appendChild(listWrap);

  async function renderListaInterna(){
    listWrap.innerHTML = '';
    const pacientes = clinicaGetPacientes();
    const indice = await carregarIndiceFichas();
    const termo = filtroListaFichas.trim().toLowerCase();
    const filtrados = pacientes.filter(p => !termo || (p.nome||'').toLowerCase().includes(termo));

    if(!filtrados.length){
      listWrap.appendChild(el('div', { class:'empty-hint', style:'text-align:center;padding:20px;border-radius:10px;' }, document.createTextNode(
        pacientes.length ? 'Nenhum paciente encontrado.' : 'Nenhum paciente cadastrado ainda. Cadastre na tela inicial do sistema.'
      )));
      return;
    }

    filtrados.forEach(p => {
      const registro = indice.find(f => f.pacienteId === p.id);
      const card = el('div', { class:'card', style:'margin-bottom:12px;' });
      const top = el('div', { class:'card-top' });
      const info = el('div', {});
      info.appendChild(el('div', { class:'card-title' }, document.createTextNode(p.nome)));
      info.appendChild(el('div', { class:'card-sub' }, document.createTextNode(
        registro ? ('Ficha atualizada em ' + new Date(registro.atualizadoEm).toLocaleDateString('pt-BR')) : 'Ainda sem ficha de anamnese'
      )));
      top.appendChild(info);
      card.appendChild(top);
      const btn = el('div', { class:'add-row-btn', style:'margin-top:10px;text-align:center;' },
        document.createTextNode(registro ? 'Abrir ficha' : '+ Criar ficha'));
      btn.onclick = () => abrirFicha(p.id);
      card.appendChild(btn);
      listWrap.appendChild(card);
    });
  }
  await renderListaInterna();
}

// Auto-save acontece dentro de refreshPanel() (ver acima)

function showFatalError(err){
  try{
    document.body.innerHTML =
      '<div style="max-width:600px;margin:40px auto;padding:20px;font-family:Arial,sans-serif;color:#1A1A1A;">' +
      '<h2 style="color:#C0392B;">Não foi possível carregar a ficha</h2>' +
      '<p>Ocorreu um erro técnico ao iniciar o formulário. Copie a mensagem abaixo e envie para o suporte:</p>' +
      '<pre style="background:#F4F8FB;border:1px solid #C9DCEC;border-radius:8px;padding:12px;white-space:pre-wrap;font-size:12px;color:#C0392B;">' +
      (err && err.stack ? err.stack : String(err)) +
      '</pre>' +
      '<p style="font-size:13px;color:#5B6B7A;">Dica: tente também abrir este mesmo arquivo diretamente no Chrome ou no Safari normal (não dentro de outro app), com internet ativada.</p>' +
      '</div>';
  }catch(e2){ /* if even this fails, nothing more we can do */ }
}

(async function iniciarAnamnese(){
  try{
    await aplicarIdentidadeClinica();
    const meResp = await fetch('/api/me', { credentials:'same-origin' });
    window._clinicaMe = meResp.ok ? await meResp.json() : null;
    await clinicaInitPacientes();
    await carregarClinica();
    document.getElementById('stepsNav').style.display = 'none';
    document.querySelector('footer.bottombar').style.display = 'none';

    const params = new URLSearchParams(window.location.search);
    const pacienteDaUrl = params.get('paciente');
    if(pacienteDaUrl && clinicaFindPacienteById(pacienteDaUrl)){
      await abrirFicha(pacienteDaUrl);
    } else {
      mostrarListaFichas();
    }
  }catch(err){
    showFatalError(err);
  }
})();

window.addEventListener('error', (e) => {
  // Catches errors that happen after init too (e.g. during a button click)
  if(document.body && document.body.children.length === 0){
    showFatalError(e.error || e.message);
  }
});
